<br />\nSPOILER SECTION Far: Lone Sails: 00:55:47 \u2013 01:34:11<br />\nClosing: 01:34:11<br />\nBanter: 01:36:05</p>\n<p align=\"center\"></p>\n<p style=\"text-align: center;\"><strong>Please send feedback and mailbag questions to SoVideogamesPODCAST (at) gmail (dot) com, or post them in the comments section below. Thanks!</strong></p>", "date": "2019-04-13", "url": "https://gamecritics.com/brad-gallaway/gamecritics-radio-so-videogames-ep-126/"}, {"title": "GameCritics Radio: So\u2026 Videogames! Ep. 123", "desc": "<p class=\"wp-block-paragraph\">Brad and Corey had a tough time finding a slot to record, so they put together a pocket-size show this week \u2014 better to have a short show than no show! They hit some new news items, chat about a couple of games and have the usual banter for the post-show-show.</p>\n\n\n\n<p class=\"wp-block-paragraph\" style=\"text-align:center\"><strong>Timestamps:</strong><br>News: 00:02:56<br>Beat Cop: 00:09:37<br>The Occupation: 00:20:25<br>Closing: 00:36:04<br>Banter: 00:38:20</p>", "date": "2019-03-25", "url": "https://gamecritics.com/brad-gallaway/gamecritics-radio-so-videogames-ep-123/"}, {"title": "GameCritics Radio: So\u2026 Videogames! Ep. 122", "desc": "<p><a href=\"https://gamecritics.com/wp-content/uploads/2017/07/SVG-GC-Logo.jpg\"></a></p>\n<p>Brad and Corey have a bit of a throwback episode this week \u2014 they return to their old show format of banter first and games after. Don\u2019t worry, it\u2019s not a permanent change. They both thought they didn\u2019t have much to talk about this week, but it turns out they have 13 games on the docket \u2014 some are updates from last week and most are games Brad has tested for us (so you don\u2019t have to?) They also discuss Brad\u2019s theatre work finally opening for the masses, Corey\u2019s recent parkour photography trip to Georgia, International Women\u2019s Day and much much more. Enjoy!</p>\n<p style=\"text-align: center;\"><strong>Timestamps:</strong><br />\nBanter: 00:01:55<br />\nHousekeeping: 00:36:12<br />\nMr. Shifty: 00:44:44<br />\nSingularity 5: 00:53:53<br />\nApe Out: 01:01:05<br />\nDaggerhood: 01:08:00<br />\nGhoulboy: 01:10:37<br />\nTetris 99: 01:11:57<br />\nTower of Babel: 01:16:27<br />\nI Wanna Fly: 01:17:34<br />\nGrab Lab: 01:18:25<br />\nSuperbrothers: Sword & Sworcery EP: 01:20:30<br />\nBeeky Reloaded: 01:30:00<br />\nSaboteur!: 01:30:57<br />\nHungry Shark World: 01:33:06<br />\nUpcoming Games: 01:35:46<br />\nClosing: 01:48:36</p>\n<p style=\"text-align: center;\"></p>\n<p style=\"text-align: center;\"><strong>Please send feedback and mailbag questions to SoVideogamesPODCAST (at) gmail (dot) com, or post them in the comments section below. Thanks!</strong></p>", "date": "2019-03-19", "url": "https://gamecritics.com/brad-gallaway/gamecritics-radio-so-videogames-ep-122/"}, {"title": "GameCritics Radio: So\u2026 Videogames! Ep. 121", "desc": "<p><a href=\"https://gamecritics.com/wp-content/uploads/2017/07/SVG-GC-Logo.jpg\"></a></p>\n<p style=\"text-align: center;\"><strong>SPOILER ALERT </strong></p>\n<p>Brad and Corey host a spoiler-filled segment for the game <strong>The Count Lucanor</strong> for the final discussion of this show. We give a long spoiler warning during the show, but be warned, it starts at 01:07:05 and ends at 01:36:34. No more games are discussed after this section, only the show closure and banter. Avoid this segment if you don\u2019t want to be spoiled!</p>\n<p>Otherwise\u2026Brad and Corey are delivering updates and new info on a ton of games this week. Beyond that, they discuss Mardi Gras in New Orleans, Santa Clarita Diet, Raisins (?) and watching people play videogames for the first time.</p>\n<p style=\"text-align: center;\"><strong>Timestamps:</strong></p>\n<p style=\"text-align: center;\">Trials Rising: 00:02:55<br />\nMr. Shifty: 00:04:02<br />\nFortnite Season 8: 00:06:46<br />\nDevotion: 00:18:20<br />\nDaggerhood: 00:25:43<br />\nSingularity 5: 00:37:51<br />\nApe Out: 00:55:25<br />\nThe Count Lucanor: 01:05:50<br />\nSpoiler Discussion: 01:07:05 \u2013 01:36:34<br />\nClosing: 01:36:45<br />\nBanter: 01:39:20</p>\n<p align=\"center\"></p>\n<p style=\"text-align: center;\"><strong>Please send feedback and mailbag questions to SoVideogamesPODCAST (at) gmail (dot) com, or post them in the comments section below. Thanks!</strong></p>", "date": "2019-03-07", "url": "https://gamecritics.com/brad-gallaway/gamecritics-radio-so-videogames-ep-121/"}, {"title": "GameCritics Radio: So\u2026 Videogames! Ep. 120", "desc": "<p><a href=\"https://gamecritics.com/wp-content/uploads/2017/07/SVG-GC-Logo.jpg\"></a></p>\n<p>You\u2019ll never guess what Brad and Corey are up to this week\u2026 Games! What a surprise. Even more surprising is (spoiler alert) they <strong>like</strong> almost everything they played this week. Aside from games, they discuss the Oscars and award shows in general, Brad is recovering from the Seattle Snowpocalypse and he\u2019s enamored with a new\u2026 breakfast cereal?</p>\n<p style=\"text-align: center;\"><strong>Timestamps:</strong><br />\nMr. Shifty: 00:04:25<br />\nRemiLore: Lost Girl in the Lands of Lore: 00:18:26<br />\nDevotion: 00:24:05<br />\nMeteorfall: 00:38:20<br />\nTrials Rising: 00:45:15<br />\nClosing: 00:55:22<br />\nBanter: 00:56:55</p>\n<p align=\"center\"></p>\n<p style=\"text-align: center;\"><strong>Please send feedback and mailbag questions to SoVideogamesPODCAST (at) gmail (dot) com, or post them in the comments section below. Thanks!</strong></p>", "date": "2019-03-05", "url": "https://gamecritics.com/brad-gallaway/gamecritics-radio-so-videogames-ep-120/"}];

(function initTheme() {
  const t = document.getElementById('theme');
  if (localStorage.getItem('theme') === 'light') {
    document.documentElement.classList.add('light');
    t.textContent = '☾ Dark';
  }
  t.onclick = function() {
    document.documentElement.classList.toggle('light');
    const isLight = document.documentElement.classList.contains('light');
    localStorage.setItem('theme', isLight ? 'light' : 'dark');
    t.textContent = isLight ? '☾ Dark' : '☀ Light';
  };
})();

function filter() {
  const q = document.getElementById('search').value.toLowerCase().trim();
  const r = document.getElementById('results');
  let f = q ? episodes.filter(e => (e.title.toLowerCase().includes(q) || (e.desc && e.desc.toLowerCase().includes(q)))) : episodes;
  document.getElementById('count').textContent = f.length + ' / 486 episodes';
  r.innerHTML = f.length ? f.map(e => epHTML(e, q)).join('') : '<p style="color:#888">No matches</p>';
}

function esc(s) {
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function epHTML(e, q) {
  const tid = 'd' + e.url.replace(/[^a-zA-Z0-9]/g, '');
  const title = hl(esc(e.title), esc(q));
  let desc = e.desc || '';
  const inDesc = q && desc.toLowerCase().includes(q);
  const vis = q && !e.title.toLowerCase().includes(q) && inDesc;
  const hlDesc = q ? hlDescText(desc, q) : desc;
  return '<div class="ep"><div class="ep-title"><a href="' + e.url + '" target="_blank">' + title + '</a></div>'
    + '<div class="ep-date">' + e.date + '</div>'
    + (desc ? '<div id="' + tid + '" class="desc' + (vis ? ' vis' : '') + '">' + hlDesc + '</div>' : '')
    + (desc ? '<div class="tog" onclick="var d=document.getElementById(\'' + tid + '\');d.classList.toggle(\'vis\');this.textContent=d.classList.contains(\'vis\')?\'▾ Hide\':\'▸ Show\'">' + (vis ? '▾ Hide' : '▸ Show') + '</div>' : '')
    + '</div>';
}

function hl(t, q) {
  if (!q) return t;
  try { return t.replace(new RegExp('(' + q.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + ')', 'gi'), '<mark class="hi">$1</mark>'); }
  catch(e) { return t; }
}

function hlDescText(html, q) {
  if (!q) return html;
  const tmp = document.createElement('div');
  tmp.innerHTML = html;
  walkText(tmp, q);
  return tmp.innerHTML;
}

function walkText(node, q) {
  if (node.nodeType === 3) {
    const txt = node.textContent;
    if (txt.toLowerCase().includes(q)) {
      const span = document.createElement('span');
      span.innerHTML = hl(esc(txt), esc(q));
      node.parentNode.replaceChild(span, node);
    }
  } else {
    for (let i = node.childNodes.length - 1; i >= 0; i--) {
      if (node.childNodes[i].nodeType !== 1 || !/^(script|style|iframe)$/i.test(node.childNodes[i].tagName)) {
        walkText(node.childNodes[i], q);
      }
    }
  }
}

document.getElementById('search').addEventListener('input', filter);
filter();
</script>
