Thanks!</strong></p>", "date": "2022-09-12", "url": "https://gamecritics.com/brad-gallaway/so-videogames-ep-301-that-game-with-the-thing/"}, {"title": "So Videogames Ep. 300: Kids In A Pit", "desc": "<a href=\"https://gamecritics.com/wp-content/uploads/2022/04/SVG-Twitter.jpg\"></a>\n\n\n\n<p class=\"wp-block-paragraph\">In this *300th* anniversary epic-length episode, Carlos and Brad\u2026 Don\u2019t spend a lot of time on celebrating!</p>\n\n\n\n<p class=\"wp-block-paragraph\">No, they\u2019re all about delivering the same weekly good you know and love. To that end, they cover:</p>\n\n\n\n<p class=\"wp-block-paragraph\">Immortality<br>Time on Frog Island<br>Made in Abyss<br>Like No Other: The Legend of the Twin Books<br>Saints Row<br>RPG Time: Legend of Wright</p>\n\n\n\n<p class=\"wp-block-paragraph\">\u2026And more!</p>\n\n\n\n<p class=\"wp-block-paragraph\"></p>\n\n\n\n<p class=\"has-text-align-center wp-block-paragraph\"><strong>Please send feedback and mailbag questions to SoVideogamesPODCAST (at) gmail (dot) com, or post them in the comments section below. Thanks!</strong></p>", "date": "2022-09-05", "url": "https://gamecritics.com/brad-gallaway/so-videogames-ep-300-kids-in-a-pit/"}, {"title": "So Videogames Ep. 299: Solo Coffeecola", "desc": "<a href=\"https://gamecritics.com/wp-content/uploads/2022/04/SVG-Twitter.jpg\"></a>\n\n\n\n<p class=\"wp-block-paragraph\">In this episode, Carlos is away and mounting his one-man off-off-off-Broadway show. In the meantime, Brad is holding it down all on his own.</p>\n\n\n\n<p class=\"wp-block-paragraph\">This week, he covers:</p>\n\n\n\n<p class=\"wp-block-paragraph\">>Midnight Fight Express<br>>Soul Hackers 2<br>>Yars: Recharged<br>>I Was A Teenage Exocolonist</p>\n\n\n\n<p class=\"wp-block-paragraph\">\u2026And more!</p>\n\n\n\n<p class=\"wp-block-paragraph\"></p>\n\n\n\n<p class=\"has-text-align-center wp-block-paragraph\"><strong>Please send feedback and mailbag questions to SoVideogamesPODCAST (at) gmail (dot) com, or post them in the comments section below. Thanks!</strong></p>", "date": "2022-08-30", "url": "https://gamecritics.com/brad-gallaway/so-videogames-ep-299-solo-coffeecola/"}, {"title": "So Videogames Ep. 298: Rememberable & Necessitary", "desc": "<a href=\"https://gamecritics.com/wp-content/uploads/2022/04/SVG-Twitter.jpg\"></a>\n\n\n\n<p class=\"wp-block-paragraph\">In this episode, Carlos & Brad cover:</p>\n\n\n\n<p class=\"wp-block-paragraph\">Cult of the Lamb (review)<br>Hindsight<br>Rollerdrome<br>Cursed to Golf<br>Thymesia<br>Video Game Fables<br>Voyage<br>Diofeld Chronicle (demo)</p>\n\n\n\n<p class=\"wp-block-paragraph\">\u2026And more!</p>\n\n\n\n<p class=\"wp-block-paragraph\"></p>\n\n\n\n<p class=\"has-text-align-center wp-block-paragraph\"><strong>Please send feedback and mailbag questions to SoVideogamesPODCAST (at) gmail (dot) com, or post them in the comments section below. Thanks!</strong></p>", "date": "2022-08-21", "url": "https://gamecritics.com/brad-gallaway/so-videogames-ep-298-rememberable-necessitary/"}, {"title": "SVG Review: Stray", "desc": "<a href=\"https://gamecritics.com/wp-content/uploads/2022/08/SVG-Twitter-1.jpg\"></a>\n\n\n\n<p class=\"wp-block-paragraph\">This is a transcript excerpt covering the score awarded to <em>Stray </em>on the So Videogames podcast, <a href=\"https://gamecritics.com/brad-gallaway/so-videogames-ep-293-the-radcliffe-train/\">episode\u00a0293: The Radcliffe Train</a>. </p>\n\n\n\n<hr>\n\n\n\n<p class=\"wp-block-paragraph\"></p>\n\n\n\n<p class=\"wp-block-paragraph\"><strong>REVIEW TRANSCRIPT</strong></p>\n\n\n\n<p class=\"wp-block-paragraph\">1:12:03</p>\n\n\n\n<p class=\"wp-block-paragraph\">BRAD: So, Stray. we saw videos of this and you were hooked from the jump. You were like, I gotta play that. This is where all I know is you\u2019re a cat. And that\u2019s all I know about it. And you\u2019re in the city and look pretty cool. So you\u2019ve got a code from the developer. Thank you very much to the developer. Thank you. You\u2019re a cat. And that\u2019s all I know. So please, fill us in on everything. Although don\u2019t spoil any spoilers because we are still under embargo for story spoilers. But tell us about the game itself. Stray. What\u2019s up with being a cat?</p>\n\n\n\n<p class=\"wp-block-paragraph\">1:12:33</p>\n\n\n\n<p class=\"wp-block-paragraph\">CARLOS: Oh, wait, how much story? Can I explain?</p>\n\n\n\n<p class=\"wp-block-paragraph\">1:12:37</p>\n\n\n\n<p class=\"wp-block-paragraph\">BRAD: I can\u2019t say it out loud. Don\u2019t say anything about your companion. Don\u2019t talk about that. And don\u2019t talk about anything past the first couple levels. We\u2019re probably fine.</p>\n\n\n\n<p class=\"wp-block-paragraph\">1:12:48</p>\n\n\n\n<p class=\"wp-block-paragraph\">CARLOS: Oh, wait a minute. So I\u2026 Okay. This is like, in real time on the podcast, readjusting my idea for review. I can do it. Because that\u2019s what we do.</p>\n\n\n\n<p class=\"wp-block-paragraph\">BRAD: You can do it I believe in you.</p>\n\n\n\n<p class=\"wp-block-paragraph\">CARLOS: I finished the game by the way. I finally did it.</p>\n\n\n\n<p class=\"wp-block-paragraph\">BRAD: How long was it?</p>\n\n\n\n<p class=\"wp-block-paragraph\">CARLOS: I don\u2019t know. I didn\u2019t really care. I like put it down for a while because I didn\u2019t want it to be over. And I felt myself doing you know, a lot of stuff. And I think I did it with like, five or six sittings \u2014 six evenings, probably or something. Okay, so maybe like 10 hours, maybe something like that. There\u2019s more to do than I did. You know, that kind of thing where there\u2019s all these little mini side missions? There\u2019s not a ton of side missions, or just smaller things you could go looking for. And I didn\u2019t, because I really wanted to know the story. And but anyways, I finished the game. Was it last night, I think? And I go, that was a perfect game. Oh, shit. That\u2019s it. It\u2019s 10 out of 10. It\u2019s a perfect game.</p>\n\n\n\n<p class=\"wp-block-paragraph\">There\u2019s like, literally a couple cons I\u2019ll say at the end that are not spoilery. And it\u2019s a perfect game. Now the first thing and why I was always interested in this game, is there\u2019s so many games I played, we both played, as cats. I\u2019m a big fan of cats. And I\u2019m a big fan of playing cat RPGs and any kind of game you can \u2014 cat simulator. I played all of them, probably. But this one is the most realistic depiction of a cat period. Now that might just sound like ah, that\u2019s interesting. But no, it\u2019s really difficult to do even to the fact that like, if the cat just standing there, you can see it like breathing little, you know, little cat breaths. Or if it decides to curl up next to something it does it in a very cat way everything is cat. It\u2019s like a perfect cat simulator. When it comes to the body of the cat. Also, it feels so intuitive to walk around and move as a cat. It\u2019s crazy. The game starts, which I can talk about, and you\u2019re with a bunch of other cats and before you get separated from them and the actual story starts. But it starts in the most perfect way. Like, you\u2019re under like this bridge area and it\u2019s like raining out and it\u2019s very relaxing because you\u2019re instantly just relaxed. I feel like and you\u2019re moving a cat around and you\u2019re like you can hit triangle the play with the other cats. And you just like go up to them and do different things. And you can take a nap and you just like, take a nap by the rain. And I was like, if it was just this, it\u2019d be fine. You know, you\u2019re</p>\n\n\n\n<p class=\"wp-block-paragraph\">1:15:10</p>\n\n\n\n<p class=\"wp-block-paragraph\">still in.</p>\n\n\n\n<p class=\"wp-block-paragraph\">1:15:10</p>\n\n\n\n<p class=\"wp-block-paragraph\">I\u2019m still in. But of course, what happens is you get separated from your cat friends. And it shows you kind of like mini tutorial, how to jump around to things and stuff like that and the environment. And then you enter the city, which is the main game, which I don\u2019t even have to talk about much because it\u2019s cyberpunk style, futuristic city.</p>\n\n\n\n<p class=\"wp-block-paragraph\">BRAD: Yeah, we saw that in the trailer</p>\n\n\n\n<p class=\"wp-block-paragraph\">CARLOS: And there\u2019s, you know, mainly like a lot of robots there, which is also in the trailers. <strong>\u2026There are a lot of great ideas here, and what you go through in the adventure is just awesome.</strong> <strong>But without spoiling, Stray is really just about just the beautiful, intuitive experience of being a cat</strong>. And even down to the fact that like, anywhere you aim, you\u2019re like, you know, your vision, you\u2019ll see like a little x if you can jump to it. And it\u2019s weird, because you know, cats can jump up unnaturally high or something, they can go really far, further than you would think further when you think you\u2019re like \u2014 I can\u2019t get up to there. But I can\u2019t can you know, and so the cat will like, look up and then you\u2019ll be able to get to these crazy places. So a lot of verticality, right, going up buildings and stuff like that. But even things like you know, of course, the first thing you do is you run up to a table and you hit something off of it as a cat, because it\u2019s funny.</p>\n\n\n\n<p class=\"wp-block-paragraph\">1:16:25</p>\n\n\n\n<p class=\"wp-block-paragraph\">BRAD: Okay, I\u2019m out. I\u2019m out.</p>\n\n\n\n<p class=\"wp-block-paragraph\">1:16:27</p>\n\n\n\n<p class=\"wp-block-paragraph\">CARLOS: I shouldn\u2019t have told you that one. You\u2019re all\u2026 because you\u2019re mad at the cats.</p>\n\n\n\n<p class=\"wp-block-paragraph\">BRAD: Yeah, yes.</p>\n\n\n\n<p class=\"wp-block-paragraph\">1:16:32</p>\n\n\n\n<p class=\"wp-block-paragraph\">I have just a side note. I\u2019ve we\u2019ve had cats before. And I gotta say it is. It is so enraging to me when a cat like, knocks something off or like, you know, knock something off the shelf or shoves something over, I just I can\u2019t deal with it. And we don\u2019t have cats anymore. So right this is my outpoint.</p>\n\n\n\n<p class=\"wp-block-paragraph\">1:16:50</p>\n\n\n\n<p class=\"wp-block-paragraph\">CARLOS: I get it. But it\u2019s not about that this \u2014 the game is not about that. But it is also again, this really just cool. Like, there\u2019s a lot of little physics in the world. So you can like move around objects and hit things and things will fall off. I have a little series of video collection I will be showing once this podcast is up on Twitter. And I just captured all these moments that felt really good. But yeah, it\u2019s hard to explain without saying more story stuff, why I like it. But I will say that the story is super engaging. It all just feels like just I don\u2019t know, like perfect, and it doesn\u2019t overstay. It\u2019s welcome, right? That\u2019s the biggest thing right? When it wrapped, I was like, yep, that\u2019s the story. I totally get it now. It felt good and felt fun the whole time.</p>\n\n\n\n<p class=\"wp-block-paragraph\">The only mini con is that there is no map. And it almost goes together with like the fiction of the world. Because you\u2019re a cat. Like it would be weird. I guess if you\u2019re looking checking a map all the time. A cat can\u2019t map. And so I got lost a couple of times, but the environments that you\u2019re in, there\u2019s many different ones. They\u2019re not too huge. So you know, you can just backtrack. And then there\u2019s also like, points where they don\u2019t tell you specifically what to do. So you have to figure things out sometimes. But other than that, there\u2019s a couple of points that stuck out.</p>\n\n\n\n<p class=\"wp-block-paragraph\">But graphically, it is stunning. Like, yeah, just on par with anything else I think is like an impressive PS5 showcase. Because the coloring, so different, you know, the varied levels. You\u2019re in some dank sewer, it\u2019s dark, and it\u2019s beautiful and dark at the same time grotesque. And the fidelity is there. Everything is just awesome. Bright colors, and then oranges. And yeah, everything just feels great. The cities feel alive. And now I\u2019m like, again, stuck, because I can\u2019t talk more about the story.</p>\n\n\n\n<p class=\"wp-block-paragraph\">1:18:44</p>\n\n\n\n<p class=\"wp-block-paragraph\">BRAD: Well, let me let me ask you a question. Because I know we\u2019ve kind of hamstrung you. I know that, you know, I\u2019m sorry, I\u2019m sorry. We\u2019re still under embargo. That was part of the\u2026 you know, we have to agree to certain things before we can get code. And that was one of them, is we can\u2019t talk about very specific things in the story. And I know that probably makes it very difficult to talk about what makes this game good. But as someone who doesn\u2019t know a lot about this game, let me just ask you a couple questions. And so without spoiling anything, it seems to me like if I understand you correctly, so you\u2019re just playing a cat, and you\u2019re just like wandering around the city doing stuff. I mean, is there can you describe it without spoilers, like any kind of like mission structure? I mean, what are you doing besides walking around as a cat? I mean, jumping on stuff. What else are you doing?</p>\n\n\n\n<p class=\"wp-block-paragraph\">1:19:24</p>\n\n\n\n<p class=\"wp-block-paragraph\">CARLOS: Yeah, that\u2019s important. I can talk about some of the mechanics I\u2019m sure. That\u2019s fine. Yeah, it\u2019s okay. So at some point, you know, and this isn\u2019t the trailer to\u2026 it\u2019s what was interesting to me is that you gain abilities. So, you know, you\u2019re basically in\u2026 what\u2019s the word, I can think of interacting with the environment in different ways. So it\u2019s not just you just jumping on things and hitting things. Although that\u2019s always funny to me. There\u2019s one story part which I\u2019m not telling the story, but you have to like knock out this panel and get at these wires. It\u2019s a very cat thing to do. You know, again, annoying cat thing, but I\u2019m the cat this time so it was not annoying because you thought \u201cYeah, so I\u2019m like biting up all these wires because I have to\u201d, you know, and there\u2019s actually like a thing to scratch. And by the way, you can do that almost anywhere, like on couches and stuff. And I like totally did it. And I was like, this is what I thought \u2014 my cat was an asshole for. But now I\u2019m doing it. It\u2019s funny. Yeah, there\u2019s a lot of cat things you could do it the environment.</p>\n\n\n\n<p class=\"wp-block-paragraph\">1:20:20</p>\n\n\n\n<p class=\"wp-block-paragraph\">I was just thinking, like, I wonder if your cat thinks it\u2019s funny, like, you know, like, they must think it\u2019s funny because they do it all the time. They think they put you inside the cat\u2019s brain like, oh, this is hilarious. I\u2019m gonna knock this guy\u2019s drink.</p>\n\n\n\n<p class=\"wp-block-paragraph\">1:20:29</p>\n\n\n\n<p class=\"wp-block-paragraph\">They\u2019re really doing this to\u2026 fuck, I don\u2019t know, there\u2019s a lot of that in this game. You know, even like some cathartic stuff. Like, there\u2019s just like a rug, there\u2019s like different rugs. And they can just like, you scratch it just because you want to or like there\u2019s a tree and you can scratch the tree. And there\u2019s, you know, haptic feedback. So it feels good to do it. But to the point, it is really kind of story driven, there are more things you can do interact with the environment, that really are about like gameplay stuff. So it\u2019s not just running around as a cat, like you have, like, things you do in the environment.</p>\n\n\n\n<p class=\"wp-block-paragraph\">1:20:59</p>\n\n\n\n<p class=\"wp-block-paragraph\">BRAD: Can you give us like a basic like overview, like I\u2019m still kind of struggling to feel like\u2026 to kind of place this on my brain? Like, give us like a rundown of like, one of the early missions, like what is what is a typical mission?</p>\n\n\n\n<p class=\"wp-block-paragraph\">1:21:08</p>\n\n\n\n<p class=\"wp-block-paragraph\">CARLOS: I can if I can\u2019t talk about the companion\u2026 Okay, well, I will say this, you can like, there are like enemies kind of. There\u2019s like monsters that live in this world. Not big monsters or anything, but they\u2019re just kind of annoying things like rodents. Okay, and so they are around, definitely the very beginning of the game. And, you know, essentially, you\u2019re just running from them, you know, those kinds of running missions for a while, in the happens in games where you can\u2019t fight yet, but later on, you can fight a bit. So let\u2019s just say the cat can fight back. And so that\u2019s a really cool mechanic, which I can\u2019t talk about, but it\u2019s\u2026</p>\n\n\n\n<p class=\"wp-block-paragraph\">1:21:42</p>\n\n\n\n<p class=\"wp-block-paragraph\">BRAD: Iis there like actual, like combat sections where you\u2019re like scratching rats and stuff?</p>\n\n\n\n<p class=\"wp-block-paragraph\">1:21:46</p>\n\n\n\n<p class=\"wp-block-paragraph\">CARLOS: I can\u2019t talk about it. Now I again, I am hamstrung. But I will say this, there\u2019s definitely like combat. And it\u2019s kind of throughout the game, you know, it\u2019s just like kind of when it makes sense. And that\u2019s really what I want to stress here is that everything works in context of the story. So as you\u2019re going from place to place and meeting different robots and different story bits are being revealed, you feel like the mechanics match it, you know, here\u2019s a good example, this is nothing that\u2019s spoilery, you\u2019re in a club one time, and you like have to like, get to a certain area of the club, like the VIP section. But you\u2019re a cat and you could jump different places. But you still can\u2019t get to this one room, what you have to do is, you know, do things with levers, jumping on levers to make automated things go up and down, get someone to run at you and yell at you or something and you get up into the rafters and then it\u2019s kind of platform me, right. And you\u2019re hitting different buttons to get to different platforms to get to that section. So that just happens in that environment in this club. But I don\u2019t think ever did that again. You know, like that, that specific style of puzzle solving.</p>\n\n\n\n<p class=\"wp-block-paragraph\">1:22:53</p>\n\n\n\n<p class=\"wp-block-paragraph\">BRAD: So there\u2019s probably like, the, the variety is pretty good? Like you\u2019re always doing something new?</p>\n\n\n\n<p class=\"wp-block-paragraph\">1:22:57</p>\n\n\n\n<p class=\"wp-block-paragraph\">CARLOS: Yeah. I mean, it\u2019s attached to the idea of running a jumping on things for sure. But they all feel like it makes sense within the in the environment. And also, again, back to story stuff I can\u2019t talk about there are things where you\u2019re collecting things for people, you know. And you know, by doing that, you\u2019re getting new stuff. I can\u2019t say shit about this game, but it is fucking great. And it is a perfect game, I believe 100%. And I think there\u2019s anything wrong with it. I think all the mechanics work. And the only thing I wrote down two cons. One was a map. One was the map. The other one was the end of the game. I wanted to keep playing, because I just love and adore these controls. And it\u2019s over over. So you can\u2019t go back and mess around. And I\u2019m not going to do that bullshit. Like it\u2019s, you know, one playthrough for me is canon. So I\u2019m not gonna go through and like, oh, like the little little things I didn\u2019t know. It\u2019s a beautiful, beautiful ending that I will talk about someday on this podcast. But that\u2019s it, you know, credits roll, and you can\u2019t go back. So I was like, I want to just be in a free environment and run around and this cat, but I can.</p>\n\n\n\n<p class=\"wp-block-paragraph\">1:24:04</p>\n\n\n\n<p class=\"wp-block-paragraph\">BRAD: Well, you know, it\u2019s unfortunate that we\u2019re cutting this so close to the embargo. This is a really good intro. You know, if you want, we can probably I mean, I bet when a week goes by, we\u2019ll be fine to talk about whatever. We just can\u2019t talk about it like initially. So let\u2019s just play it safe for now. And if you want to bring it back to the show next week and talk about you know, maybe like a brief intro for the show, spoiler section or something, I will probably do my best to play this game this coming week. So, you know, maybe I\u2019ll want to talk about it. Maybe we can kind of tag team and revisit it with less, less restrictions on the spoilers. I mean, I feel like you\u2019re\u2026 I feel like there are very big chunks of this game that you\u2019re not talking about, which you can\u2019t talk about to be fair. Yeah. So maybe we should come back on this in a week. And we can you know, pull the curtain back and talk more about the things you\u2019re not mentioned.</p>\n\n\n\n<p class=\"wp-block-paragraph\">1:24:48</p>\n\n\n\n<p class=\"wp-block-paragraph\">CARLOS: That is perfect because until then I will be like frustrated. Just be sitting here my room not rocking back and forth. I need to talk about it and like, it\u2019s a huge thumbs up, right? I mean, it called it it\u2019s a perfect game. I don\u2019t say that ever.</p>\n\n\n\n<p class=\"wp-block-paragraph\">BRAD: Yeah, you don\u2019t say that often.</p>\n\n\n\n<p class=\"wp-block-paragraph\">CARLOS: I don\u2019t really. I feel like you won\u2019t like it as much again, you\u2019re already kind of like bias. You don\u2019t like cats.</p>\n\n\n\n<p class=\"wp-block-paragraph\">BRAD: That\u2019s, that\u2019s true. I gotta get past my cat dislike, but it will be interesting.</p>\n\n\n\n<p class=\"wp-block-paragraph\">CARLOS: You come back, we\u2019ll come back next week, we\u2019ll talk about it spoilery I won\u2019t spoil, like the ending for you if you don\u2019t want but</p>\n\n\n\n<p class=\"wp-block-paragraph\">1:25:23</p>\n\n\n\n<p class=\"wp-block-paragraph\">BRAD: All right, well, cool. Let me um, I mean, if it\u2019s only like eight or 10 hours, I mean, if I if I click with it, I can probably try to find the time this week. We\u2019ll see. I mean, that\u2019s, I don\u2019t know if it\u2019s possible. You know, I\u2019m pretty busy. But we\u2019ll do what I can. I will definitely start it this week. And let\u2019s come back to it next week. And I\u2019m sure by that time, we will be more free to talk about the other aspects of the game that you haven\u2019t mentioned so far. Okay. And we\u2019ll just we\u2019ll circle back.</p>\n\n\n\n<p class=\"wp-block-paragraph\">1:25:43</p>\n\n\n\n<p class=\"wp-block-paragraph\">CARLOS: All right. I love it. I love it.</p>\n\n\n\n<p class=\"wp-block-paragraph\"></p>\n\n\n\n<hr>\n\n\n\n<p class=\"wp-block-paragraph\"><strong>So Videogames Stray Official Score:\u00a0</strong>10/10</p>\n\n\n\n<p class=\"wp-block-paragraph\"><strong>Developer:</strong>\u00a0Blue12</p>\n\n\n\n<p class=\"wp-block-paragraph\"><strong>Publisher:</strong>\u00a0Annapurna Interactive</p>\n\n\n\n<p class=\"wp-block-paragraph\"><strong>Platform Reviewed:\u00a0</strong>PS5</p>\n\n\n\n<p class=\"wp-block-paragraph\"><strong>ESRB Rating:</strong> E10+</p>\n\n\n\n<p class=\"wp-block-paragraph\"><strong>Colorblind Modes:</strong>\u00a0None</p>\n\n\n\n<p class=\"wp-block-paragraph\"><strong>Subtitles:</strong>\u00a0There is text in-game, but the text is not resizable. Audio mostly serves aesthetic purposes and is not needed for gameplay, as there are no spoken dialogues. Audio cues are not needed for gameplay.\u00a0<em>Stray\u00a0</em>is\u00a0<strong>fully accessible.</strong></p>\n\n\n\n<a href=\"https://gamecritics.com/wp-content/uploads/2022/08/Stray_20220806223214-1.jpg\"></a>\n\n\n\n<p class=\"wp-block-paragraph\"><strong>Remappable controls:\u00a0</strong>Controls\u00a0<strong>are remappable.</strong></p>\n\n\n\n<a href=\"https://gamecritics.com/wp-content/uploads/2022/08/Stray_20220812155819-1.jpg\"></a>\n\n\n\n<a href=\"https://gamecritics.com/wp-content/uploads/2022/08/Stray_20220812155828-1.jpg\"></a>\n\n\n\n<a href=\"https://gamecritics.com/wp-content/uploads/2022/08/Stray_20220812155836-1.jpg\"></a>\n\n\n\n<a href=\"https://gamecritics.com/wp-content/uploads/2022/08/Stray_20220812155850-1.jpg\"></a>", "date": "2022-08-19", "url": "https://gamecritics.com/brad-gallaway/svg-review-stray/"}, {"title": "SVG Review: Sword & Fairy Together Forever", "desc": "<a href=\"https://gamecritics.com/wp-content/uploads/2022/08/SVG-Twitter.jpg\"></a>\n\n\n\n<p class=\"wp-block-paragraph\">This is a transcript excerpt covering the score awarded on the So Videogames podcast, episode <a href=\"https://gamecritics.com/brad-gallaway/so-videogames-ep-297-enter-sandman/\">297: Enter Sandman</a>. For our in-depth thoughts and deeper discussion on <em>Sword and Fairy: Together Forever</em>, you can find it in episode <a href=\"https://gamecritics.com/brad-gallaway/so-videogames-ep-296-bag-off/\">296: Bag Off</a>. </p>\n\n\n\n<hr>\n\n\n\n<p class=\"wp-block-paragraph\"></p>\n\n\n\n<p class=\"wp-block-paragraph\"><strong>REVIEW TRANSCRIPT</strong></p>\n\n\n\n<p class=\"wp-block-paragraph\">14:59</p>\n\n\n\n<p class=\"wp-block-paragraph\"><strong>BRAD:</strong> Let\u2019s do it. We\u2019re gonna be starting with you this week, sir. Circling back. So we\u2019re going to do something a little bit different this this week, this month is a month of change. I know the change is kind of difficult for people, but I think we\u2019re gonna power through I think we got a good track now. So, in addition to the structure changes, I think we finally have got a good fixed structure. We\u2019re going to be doing official reviews.</p>\n\n\n\n<p class=\"wp-block-paragraph\">So we haven\u2019t really done official reviews in the past, we\u2019ve said the word \u201creview\u201d here and there. We\u2019ve definitely given our thoughts and feelings, but we haven\u2019t really like, given an official score, but I feel like that\u2019s going to change now. I feel like we\u2019re gonna do something different this week.</p>\n\n\n\n<p class=\"wp-block-paragraph\">Carlos, you\u2019re gonna have the honor of giving our first official, intentional, scored review. And I think I think we\u2019re gonna start with Sword and Fairy. That wasn\u2019t the full title. Sword Forever? Yeah, you really liked it a lot. We went into it in great detail last week, we\u2019re not going to go into same detail now. Please go back and listen to that episode if you want all the deets. But we will come back because you\u2019ve had more time to play it. And I assume\u2026 Did you finish it?</p>\n\n\n\n<p class=\"wp-block-paragraph\">16:00</p>\n\n\n\n<p class=\"wp-block-paragraph\"><strong>CARLOS:</strong> No, I didn\u2019t. But I\u2019m so close. I can easily\u2026 Yeah, say I know everything about the ins and outs about the game. So I think\u2026</p>\n\n\n\n<p class=\"wp-block-paragraph\">16:07</p>\n\n\n\n<p class=\"wp-block-paragraph\"><strong>BRAD:</strong> That\u2019s totally fair. We have the same policy at GameCritics where we realize you know, we\u2019re not infinite vampires living in a basement, we don\u2019t have all the time in the world. We have jobs, families, sometimes we just don\u2019t have time to finish like a million-hour game. So as long as we get to a point where we feel like we have seen all the big ideas, we understand those ideas, and we can talk intelligently about them, I feel like that\u2019s a pretty good place to talk about a review. I mean, of course finish if you can, but it\u2019s not always possible. So in this particular case, you have played enough, you\u2019re almost done. You feel like you\u2019ve got a good handle on it. You\u2019re ready to review. I say let\u2019s do our very first official intentional So Videogames game review, complete with score. Carlos, please take it away.</p>\n\n\n\n<p class=\"wp-block-paragraph\">16:44</p>\n\n\n\n<p class=\"wp-block-paragraph\"><strong>CARLOS:</strong> Yeah. And to your point, this is our second scored game, because unintentionally, I said 10 out of 10 for Stray. And then someone heard that and said, really? And we\u2019re like, I guess yeah, but then I was like, well, actually \u2014 I didn\u2019t say I guess, I said 100%. I mean, I said 100 and we\u2019re like, do we do that here? And so yeah, I\u2019m glad that we are adding this to our repertoire. So it\u2019s something we\u2019re gonna do. It\u2019s not every single episode maybe but it\u2019s when we feel like we need to, to do it.</p>\n\n\n\n<p class=\"wp-block-paragraph\">You know, like, when we kind of feel like we\u2019ve got a handle on the game, either finished it or really close to finishing it. And yes, I stand by 10 out of 10 \u2014 frustrated because you know I loved it.</p>\n\n\n\n<p class=\"wp-block-paragraph\"><strong>BRAD:</strong> You love that like nobody\u2019s business, your perfect game.</p>\n\n\n\n<p class=\"wp-block-paragraph\"><strong>CARLOS:</strong> Oh, shit. Yeah, it\u2019s already done. Ouch, ouch. So this is my second one, sort of, Fairy Sword: Together Forever. A couple of little bits and bobs before I get into the number.</p>\n\n\n\n<p class=\"wp-block-paragraph\">I think that, like I mentioned last time, there are some bugs in this. I know, they\u2019ll get patched out at some point. Nothing\u2019s like game breaking. But they\u2019re just weird. And they do show up, you know? And then the biggest bug is the thing that I can\u2019t change \u2014 my main character\u2019s outfit right now.</p>\n\n\n\n<p class=\"wp-block-paragraph\"><strong>BRAD:</strong> Is it still not fixed?</p>\n\n\n\n<p class=\"wp-block-paragraph\"><strong>CARLOS:</strong> It\u2019s still not fixed. It\u2019s and they did like four patches since. I was like, every time I got a patch, I was like, this is the one. So I can\u2019t believe it isn\u2019t. I don\u2019t know about it.</p>\n\n\n\n<p class=\"wp-block-paragraph\"><strong>BRAD:</strong> Did you tell them?</p>\n\n\n\n<p class=\"wp-block-paragraph\"><strong>CARLOS:</strong> No, I didn\u2019t directly tell them, I probably should have after this score.</p>\n\n\n\n<p class=\"wp-block-paragraph\"><strong>BRAD:</strong> Oh, no.</p>\n\n\n\n<p class=\"wp-block-paragraph\"><strong>CARLOS:</strong> Okay, no, no, no, that doesn\u2019t\u2026 That\u2019s not\u2026. But meaning like I gave, I\u2019m giving him a good score. And I really would like that fix, but it doesn\u2019t impact almost anything. You know, I mean, I\u2019ve never been a cosmetic guy. Like, it doesn\u2019t change the armor. We didn\u2019t talk about this. But in this game, it\u2019s like strictly cosmetic in what you look like. And it\u2019s one of those things where like all the armor is just number values. Which sometimes can be a weird because you know you\u2019re playing an RPG, you want to see your change.</p>\n\n\n\n<p class=\"wp-block-paragraph\"><strong>BRAD:</strong> I definitely want to see the change.</p>\n\n\n\n<p class=\"wp-block-paragraph\"><strong>CARLOS:</strong> It\u2019s because this game has so many cutscenes. It\u2019s very like a heavy duty storyline game, that they\u2019re going to keep those characters in those outfits. I guess that\u2019s maybe the reason? I don\u2019t know. Anyways, that doesn\u2019t bother me enough. And yeah, a couple of little bugs here and there. But the only other con i would say before I do the score is that it is super long. And in the beginning I loved it because I was doing every single side mission and just eating it up. And while I still love the game and look forward to it every night \u2014 and it\u2019s like, you know, something I really really enjoy \u2014 it\u2019s pretty long. Right now I think it\u2019s a good 33 chapters. I\u2019m in like chapter 25 or 26 or something.</p>\n\n\n\n<p class=\"wp-block-paragraph\"><strong>BRAD:</strong> You feel like you\u2019re good? Ready to wrap things up.</p>\n\n\n\n<p class=\"wp-block-paragraph\"><strong>CARLOS:</strong> Yeah. That said, I liked it a lot. My main reason for the score is because not only is the combat so fun, like just as fun as Final Fantasy 15, if not better with the dodge moves. I think the dodge mechanic is one of the best ever used \u2014 it\u2019s just like I said last episode, it\u2019s like a dance mechanic. When you move out of the way you\u2019re either, like, moving like a god, literally. Or you\u2019re moving like an acrobatic, you know, dancer, and it\u2019s just amazing.</p>\n\n\n\n<p class=\"wp-block-paragraph\">And<strong> I love all the little side quests and I love learning about Chinese culture and mythology. Like that\u2019s a huge reason. That\u2019s great. I love it. Yeah, and I think that this game\u2026it was an eye-opening experience, as well as just, I really, really fell into it and kind of like, let it wash over me. </strong>And the fact that like, here\u2019s a bunch of history you don\u2019t know about, here\u2019s a lot of story where other people will be like, it\u2019s too much cutscenes it\u2019s too much story. I just liked the fact that I was getting all this info. And for some reason, I just, yeah, I absorbed it.</p>\n\n\n\n<p class=\"wp-block-paragraph\">So\u2026official score. And again, it would be a little higher without a couple of little bugs. And the fact that, you know, I think it\u2019s a little long. That\u2019s the only reason I think it\u2019s a little less than that. But I\u2019m saying 8.5 out of 10.</p>\n\n\n\n<p class=\"wp-block-paragraph\">20:36</p>\n\n\n\n<p class=\"wp-block-paragraph\"><strong>BRAD:</strong> I mean, that\u2019s pretty good. That\u2019s pretty good. We\u2019re not GameCritics. So we, we go by a slightly different review scale here. But I mean, 8.5 out of 10, excuse me, no matter which way you slice, it is a great score. So I don\u2019t think that\u2019s anything for anybody to be ashamed of. That\u2019s, I mean, that to me is a winner.</p>\n\n\n\n<p class=\"wp-block-paragraph\">20:49</p>\n\n\n\n<p class=\"wp-block-paragraph\"><strong>CARLOS:</strong> It was so close to almost nine, I kind of don\u2019t go between, like 2.75. And that stuff, I kind of just do the half sometimes, right? And it\u2019s because like the bugs, and you know, the fact that I\u2019m almost done with the game, and I can\u2019t change my outfit, that\u2019s a little problem.</p>\n\n\n\n<p class=\"wp-block-paragraph\"><strong>BRAD:</strong> So you played the entire time in an outfit you didn\u2019t like.</p>\n\n\n\n<p class=\"wp-block-paragraph\"><strong>CARLOS:</strong> Yeah, exactly. And so that\u2019s kind of\u2026 and then also, just the fact that it\u2019s pretty damn long. And you know, there\u2019s times where I go, this is the most amazing combat ever, I\u2019m really having a lot of fun. And then I have to wait for another 40 minutes to do it really, again. That\u2019s a long time. That\u2019s an exaggeration. But you know, like, sure,</p>\n\n\n\n<p class=\"wp-block-paragraph\">21:23</p>\n\n\n\n<p class=\"wp-block-paragraph\"><strong>BRAD:</strong> If you gotta\u2026 you gotta\u2026 you can\u2019t interrupt the flow all the time.</p>\n\n\n\n<p class=\"wp-block-paragraph\">21:27</p>\n\n\n\n<p class=\"wp-block-paragraph\"><strong>CARLOS:</strong> Well, here\u2019s the thing. Oh, this is why it\u2019s it was almost nine. I know, I\u2019m not going back on my score. But the other day, like, there was a character and I felt really sad for her. And I don\u2019t know what last time I felt sad for an RPG character. But like, I was like, fuck, I\u2019m depressed for her. And it was like this really sad scene. And the other character was like, consoling her. And I just felt that moment so hard. And so even though I wanted to get back to combat and leveling up, you know what I mean? It kept me there, because I really cared about the characters.</p>\n\n\n\n<p class=\"wp-block-paragraph\">21:55</p>\n\n\n\n<p class=\"wp-block-paragraph\"><strong>BRAD:</strong> So that\u2019s good. When you can feel something.</p>\n\n\n\n<p class=\"wp-block-paragraph\"><strong>CARLOS:</strong> Yeah, it\u2019s wonderful. Yeah,</p>\n\n\n\n<p class=\"wp-block-paragraph\">22:00</p>\n\n\n\n<p class=\"wp-block-paragraph\">I love the game. I fucking love the game. I\u2019m gonna finish it. And it\u2019s something I look forward to every night to go back to so</p>\n\n\n\n<p class=\"wp-block-paragraph\">22:06</p>\n\n\n\n<p class=\"wp-block-paragraph\"><strong>BRAD:</strong> And you can look forward to that for the next six months, apparently,</p>\n\n\n\n<p class=\"wp-block-paragraph\">22:08</p>\n\n\n\n<p class=\"wp-block-paragraph\"><strong>CARLOS:</strong> I know. Oh, like seven more chapters. But yeah.</p>\n\n\n\n<p class=\"wp-block-paragraph\">22:12</p>\n\n\n\n<p class=\"wp-block-paragraph\"><strong>BRAD:</strong> Well, all right. Well, there we go. There we go. The very first intentional official So Videogames podcast review brought to us by our very own Carlos Rodela. Carlos Dodge-Rodela. 8.5 is a fine\u2026 that\u2019s a great score to start off with.</p>\n\n\n\n<p class=\"wp-block-paragraph\">22:25</p>\n\n\n\n<p class=\"wp-block-paragraph\"><strong>CARLOS:</strong> And when we do these, I guess I just kind of decided that I was using a .5 system?</p>\n\n\n\n<p class=\"wp-block-paragraph\">22:31</p>\n\n\n\n<p class=\"wp-block-paragraph\"><strong>BRAD:</strong> Yeah, I\u2019m gonna keep the GameCritics review scale, even though this is not GameCritics, just to be clear, even though the So Videogames podcast, I mean, it\u2019s hosted at GameCritics. I am the editor of GameCritics. There\u2019s definitely ties to GameCritics. But we\u2019re not going to follow the same kind of rubric that we use at GameCritics because I mean, written review, as opposed to podcast review, they are kind of different beasts in terms of how I think of them as editor. So I\u2019m going to use the GameCritics scale, as in zero through 10. And using .5s as necessary.</p>\n\n\n\n<p class=\"wp-block-paragraph\"><strong>CARLOS:</strong> But I may not hew to the same kind of standards that we hold for print reviews, right?</p>\n\n\n\n<p class=\"wp-block-paragraph\"><strong>BRAD:</strong> Yeah, .5 is, I\u2019m totally fine with .5.</p>\n\n\n\n<p class=\"wp-block-paragraph\">23:07</p>\n\n\n\n<p class=\"wp-block-paragraph\"><strong>CARLOS:</strong> Okay, cool. So we\u2019re on the same page. All right. Well, there you go. That\u2019s thing and people should play it because it will definitely like open your eyes to a different culture and mythology. And that\u2019s the reason alone to play it.</p>\n\n\n\n<p class=\"wp-block-paragraph\">23:18</p>\n\n\n\n<p class=\"wp-block-paragraph\"><strong>BRAD:</strong> Sounds great. All right, there we go. First official review\u2026 a winner!</p>\n\n\n\n<hr>\n\n\n\n<p class=\"wp-block-paragraph\"></p>\n\n\n\n<p class=\"wp-block-paragraph\"><strong>So Videogames Sword and Fairy: Together Forever Official Score: </strong>8.5/10</p>\n\n\n\n<p class=\"wp-block-paragraph\"><strong>Developer:</strong> Softstar Technology</p>\n\n\n\n<p class=\"wp-block-paragraph\"><strong>Publisher:</strong> EastAsiaSoft</p>\n\n\n\n<p class=\"wp-block-paragraph\"><strong>Platform Reviewed: </strong>PS5</p>\n\n\n\n<p class=\"wp-block-paragraph\"><strong>ESRB Rating: </strong>T for <strong>Blood</strong> and <strong>Violence</strong>.</p>\n\n\n\n<p class=\"wp-block-paragraph\"><strong>Colorblind Modes:</strong> There are<strong> no colorblind modes</strong>.</p>\n\n\n\n<p class=\"wp-block-paragraph\"><strong>Subtitles:</strong> Subtitles <strong>can </strong>be resized and altered. </p>\n\n\n\n<a href=\"https://gamecritics.com/wp-content/uploads/2022/08/Sword-and-Fairy-_-Together-Forever_20220818100958.jpg\"></a>\n\n\n\n<a href=\"https://gamecritics.com/wp-content/uploads/2022/08/Sword-and-Fairy-_-Together-Forever_20220818102923.jpg\"></a>\n\n\n\n<p class=\"wp-block-paragraph\"><strong>Controller Remapping:</strong> Controls <strong>can</strong> be remapped. </p>\n\n\n\n<a href=\"https://gamecritics.com/wp-content/uploads/2022/08/Sword-and-Fairy-_-Together-Forever_20220818101034.jpg\"></a>\n\n\n\n<a href=\"https://gamecritics.com/wp-content/uploads/2022/08/Sword-and-Fairy-_-Together-Forever_20220818101040.jpg\"></a>\n\n\n\n<a href=\"https://gamecritics.com/wp-content/uploads/2022/08/Sword-and-Fairy-_-Together-Forever_20220818101048.jpg\"></a>", "date": "2022-08-18", "url": "https://gamecritics.com/brad-gallaway/svg-review-sword-fairy-together-forever/"}, {"title": "So Videogames Ep. 297: Enter Sandman", "desc": "<a href=\"https://gamecritics.com/wp-content/uploads/2022/04/SVG-Twitter.jpg\"></a>\n\n\n\n<p class=\"wp-block-paragraph\">In this episode, Carlos & Brad cover:</p>\n\n\n\n<p class=\"wp-block-paragraph\">>Sword & Fairy official scored review<br>>Lord Winklebottom Investigates<br>>Super Bullet Break<br>>Soulstice preview<br>>Please Touch the Artwork!<br>>Cult of the Lamb<br>>Countess in Crimson</p>\n\n\n\n<p class=\"wp-block-paragraph\">\u2026And more!</p>\n\n\n\n<p class=\"wp-block-paragraph\"></p>\n\n\n\n<p class=\"has-text-align-center wp-block-paragraph\"><strong>Please send feedback and mailbag questions to SoVideogamesPODCAST (at) gmail (dot) com, or post them in the comments section below. Thanks!</strong></p>", "date": "2022-08-16", "url": "https://gamecritics.com/brad-gallaway/so-videogames-ep-297-enter-sandman/"}, {"title": "So Videogames Ep. 296: Bag Off", "desc": "<a href=\"https://gamecritics.com/wp-content/uploads/2022/04/SVG-Twitter.jpg\"></a>\n\n\n\n<p class=\"wp-block-paragraph\">In this episode, Carlos & Brad cover:</p>\n\n\n\n<p class=\"wp-block-paragraph\">Hell Pie<br>Gigabash<br>Gigapocalypse<br>Sword & Fairy: Together Forever<br>South of the Circle</p>\n\n\n\n<p class=\"wp-block-paragraph\">\u2026And more!</p>\n\n\n\n<p class=\"wp-block-paragraph\"></p>\n\n\n\n<p class=\"has-text-align-center wp-block-paragraph\"><strong>Please send feedback and mailbag questions to SoVideogamesPODCAST (at) gmail (dot) com, or post them in the comments section below. Thanks!</strong></p>", "date": "2022-08-08", "url": "https://gamecritics.com/brad-gallaway/so-videogames-ep-296-bag-off/"}, {"title": "So Videogames Ep. 295: The Nearly Full Monty", "desc": "<a href=\"https://gamecritics.com/wp-content/uploads/2022/04/SVG-Twitter.jpg\"></a>\n\n\n\n<p class=\"wp-block-paragraph\">In this episode, Carlos & Brad revamp the show with a slightly different format. The house is closed for fumigation, and instead they save the extra bits and bobs for the end of the program.</p>\n\n\n\n<p class=\"wp-block-paragraph\">Like it? Don\u2019t like it? They want your feedback!</p>\n\n\n\n<p class=\"wp-block-paragraph\">Otherwise, you can expect the same great games content, featuring:</p>\n\n\n\n<p class=\"wp-block-paragraph\">Train Valley: Console Edition<br>Citizen Sleeper DLC: Flux<br>Lost Epic<br>Slay the Princess (demo)<br>Scarlet Hollow<br>Thirsty Suitors (demo)<br>Agents of Mayhem</p>\n\n\n\n<p class=\"wp-block-paragraph\">\u2026And more!</p>\n\n\n\n<p class=\"wp-block-paragraph\"></p>\n\n\n\n<p class=\"has-text-align-center wp-block-paragraph\"><strong>Please send feedback and mailbag questions to SoVideogamesPODCAST (at) gmail (dot) com, or post them in the comments section below. Thanks!</strong></p>", "date": "2022-08-01", "url": "https://gamecritics.com/brad-gallaway/so-videogames-ep-295-the-nearly-full-monty/"}, {"title": "So Videogames Ep. 294: Balancing Out The Stray", "desc": "<a href=\"https://gamecritics.com/wp-content/uploads/2022/04/SVG-Twitter.jpg\"></a>\n\n\n\n<p ph\"></p>\n\n\n\n<p class=\"has-text-align-center wp-block-paragraph\"><strong>Please send feedback and mailbag questions to SoVideogamesPODCAST (at) gmail (dot) com, or post them in the comments section below. Thanks!</strong></p>", "date": "2022-05-01", "url": "https://gamecritics.com/brad-gallaway/so-videogames-ep-282/"}, {"title": "So Videogames Ep. 281: The Speedcast", "desc": "<a href=\"https://gamecritics.com/wp-content/uploads/2022/04/SVG-Twitter.jpg\"></a>\n\n\n\n<p class=\"wp-block-paragraph\">In this episode, Brad and Carlos both had some pressing real-life schedules to keep, but they didn\u2019t want to cancel the show.</p>\n\n\n\n<p class=\"wp-block-paragraph\">So what did they do? They enabled SPEED MODE!!</p>\n\n\n\n<p class=\"wp-block-paragraph\">Listen to the guys rocket through this week\u2019s content in record time, and they even finished early! They cover:</p>\n\n\n\n<p class=\"wp-block-paragraph\">Road 96<br>The Last Friend<br>Ghostwire: Tokyo (Visual Novel)<br>Ghostwire: Tokyo (main game)<br>Boreal Tenebrae<br>Samurai Bringer\u2026 And more!!</p>\n\n\n\n<p class=\"wp-block-paragraph\">Also, heads up: the teased content featuring Brad\u2019s son Whitty didn\u2019t make it this week, but we\u2019ll definitely get it on the air in ep. 282.</p>\n\n\n\n<p class=\"wp-block-paragraph\"></p>\n\n\n\n<p class=\"has-text-align-center wp-block-paragraph\"><strong>Please send feedback and mailbag questions to SoVideogamesPODCAST (at) gmail (dot) com, or post them in the comments section below. Thanks!</strong></p>", "date": "2022-04-23", "url": "https://gamecritics.com/brad-gallaway/so-videogames-ep-281-the-speedcast/"}, {"title": "So Videogames Ep. 280", "desc": "<p><a href=\"https://gamecritics.com/wp-content/uploads/2017/07/SVG-GC-Logo.jpg\"></a></p>\n<p>In this episode Carlos is away, so former co-host Corey Motley steps in to fill his chair.</p>\n<p><strong>FULL DISCLOSURE:</strong> Carlos usually does the editing. So, since he was out of action, Brad had to step in and try to piece things together. This is only the second podcast he\u2019s ever assembled, so please be merciful. ^_^</p>\n<p>With that said, the games covered this time around are:</p>\n<p>Far: Changing Tides<br />\nMind Scanners<br />\nCastlevania Advance Collection<br />\nDeck of Ashes<br />\nThe Last Of Us 2<br />\nRoad 96</p>\n<p>\u2026And more!</p>\n<p>We hope you enjoy the show, and hopefully Carlos will be back next episode with a smoother cut! ; D</p>\n<p align=\"center\"></p>\n<p style=\"text-align: center;\"><strong>Please send feedback and mailbag questions to SoVideogamesPODCAST (at) gmail (dot) com, or post them in the comments section below. Thanks!</strong></p>", "date": "2022-04-19", "url": "https://gamecritics.com/brad-gallaway/so-videogames-ep-280/"}, {"title": "So Videogames Ep 279: Sharper Than A Blunt Tack", "desc": "<p><a href=\"https://gamecritics.com/wp-content/uploads/2017/07/SVG-GC-Logo.jpg\"></a></p>\n<p>In this episode, Carlos & Brad discuss:</p>\n<p>Tunic<br />\nA Memoir Blue<br />\n35MM<br />\nTrek to Yomi<br />\ntERRORbane<br />\nDemon\u2019s Souls<br />\nPrincess Farmer<br />\nElden Ring (wrapup)</p>\n<p>\u2026And more!</p>\n<p><a href=\"https://gamecritics.com/brad-gallaway/dem\u2026-review-10-06-09/\">Link to Brad\u2019s Demon\u2019s Souls Review</a></p>\n<p align=\"center\"></p>\n<p style=\"text-align: center;\"><strong>Please send feedback and mailbag questions to SoVideogamesPODCAST (at) gmail (dot) com, or post them in the comments section below. Thanks!</strong></p>", "date": "2022-04-10", "url": "https://gamecritics.com/brad-gallaway/so-videogames-ep-279-sharper-than-a-blunt-tack/"}, {"title": "So Videogames Ep. 278: Git Gud, Git Mad", "desc": "<p><a href=\"https://gamecritics.com/wp-content/uploads/2017/07/SVG-GC-Logo.jpg\"></a></p>\n<p>In this episode, Carlos & Brad cover:</p>\n<p>Mr. Prepper<br />\nFor the Warp<br />\nSMT 5<br />\nNeurodeck<br />\nWeird West<br />\nCrusader Kings III</p>\n<p>\u2026And more!!</p>\n<p align=\"center\"></p>\n<p style=\"text-align: center;\"><strong>Please send feedback and mailbag questions to SoVideogamesPODCAST (at) gmail (dot) com, or post them in the comments section below. Thanks!</strong></p>", "date": "2022-04-01", "url": "https://gamecritics.com/brad-gallaway/so-videogames-ep-278-git-gud-git-mad/"}, {"title": "So Videogames Ep. 277: The Elden Spousecast", "desc": "<p><a href=\"https://gamecritics.com/wp-content/uploads/2017/07/SVG-GC-Logo.jpg\"></a></p>\n<p>In this episode Carlos is out on a leave of absence, so his chair is filled by Brad\u2019s wife Gina. The pair discuss:</p>\n<p>Vengeful Heart<br />\nRoyal Frontier<br />\nNeon Abyss<br />\nWeird West</p>\n<p>\u2026And then they wrap the show with a lengthy discussion on Elden Ring.</p>\n<p>It\u2019s the Elden Spousecast!</p>\n<p align=\"center\"></p>\n<p style=\"text-align: center;\"><strong>Please send feedback and mailbag questions to SoVideogamesPODCAST (at) gmail (dot) com, or post them in the comments section below. Thanks!</strong></p>", "date": "2022-03-27", "url": "https://gamecritics.com/brad-gallaway/so-videogames-ep-277-the-elden-spousecast/"}, {"title": "So Videogames Ep. 276", "desc": "<p><a href=\"https://gamecritics.com/wp-content/uploads/2017/07/SVG-GC-Logo.jpg\"></a></p>\n<p>In this episode, Carlos & Brad cover:</p>\n<p>RPG Time: Legend of Wright<br />\nRoguebook<br />\nWho Pressed Mute on Uncle Marcus?<br />\nPrison Princess<br />\nShadow Warrior 3<br />\nThe Life and Suffering of Sir Brante<br />\nStranger of Paradise: Final Fantasy Origin</p>\n<p>\u2026And more!</p>\n<p align=\"center\"></p>\n<p style=\"text-align: center;\"><strong>Please send feedback and mailbag questions to SoVideogamesPODCAST (at) gmail (dot) com, or post them in the comments section below. Thanks!</strong></p>", "date": "2022-03-19", "url": "https://gamecritics.com/brad-gallaway/so-videogames-ep-276/"}, {"title": "So Videogames Ep. 275: The Eldencast", "desc": "<p><a href=\"https://gamecritics.com/wp-content/uploads/2017/07/SVG-GC-Logo.jpg\"></a></p>\n<p>In this episode, Carlos & Brad discuss <strong>Time Loader</strong> and <strong>Aztech: Forgotten Gods</strong> before deep-diving into the world of <strong>Elden Ring</strong>.</p>\n<p>Elden is the first Souls game that Carlos has sunk time into, and Brad has been a FromSoft fan for 27 years. The two of us are bringing hugely different perspectives on what is sure to be one of the biggest games of the year, and we spend the majority of the show chatting about the bad, and the Tarnished.</p>\n<p><strong>SPOILER WARNING</strong> \u2013 we don\u2019t hold anything back in the Elden Ring segment, so heads up that there may be spoilers of all kinds during the chat. We do give warnings during the show before we start to spill. = )</p>\n<p align=\"center\"></p>\n<p style=\"text-align: center;\"><strong>Please send feedback and mailbag questions to SoVideogamesPODCAST (at) gmail (dot) com, or post them in the comments section below. Thanks!</strong></p>", "date": "2022-03-14", "url": "https://gamecritics.com/brad-gallaway/so-videogames-ep-275-the-eldencast/"}, {"title": "So Videogames Ep. 274 \u2013 A Grower, Not A Shower", "desc": "<p><a href=\"https://gamecritics.com/wp-content/uploads/2017/07/SVG-GC-Logo.jpg\"></a></p>\n<p>In this episode, Carlos & Brad are joined by the delightful Evelyn Rose Hall (@PixyFreakinStix) of Stegosoft Games (@StegosoftGames) to discuss their indie RPG Rise of the Third Power (@R3Pgame) and other topics.</p>\n<p>Of course, there\u2019s games chat as well. They cover:</p>\n<p>Elex II<br />\nPrimordia<br />\nElden Ring</p>\n<p>\u2026And more!!</p>\n<p align=\"center\"></p>\n<p style=\"text-align: center;\"><strong>Please send feedback and mailbag questions to SoVideogamesPODCAST (at) gmail (dot) com, or post them in the comments section below. Thanks!</strong></p>", "date": "2022-03-07", "url": "https://gamecritics.com/brad-gallaway/so-videogames-ep-274-a-grower-not-a-shower/"}, {"title": "So Videogames Ep. 273", "desc": "<p><a href=\"https://gamecritics.com/wp-content/uploads/2017/07/SVG-GC-Logo.jpg\"></a></p>\n<p>In this episode, Carlos & Brad discuss:</p>\n<p><a href=\"https://bit.ly/3JDs5aJ\">E-Win Gaming Chairs</a><br />\nHorizon: Forbidden West<br />\nGem Wizards Tactics<br />\nZombie Rollerz: Pinball Heroes<br />\nElden Ring<br />\nGestuFumaDen: Undying Moon<br />\nBraveland Trilogy</p>\n<p>\u2026And more!</p>\n<p align=\"center\"></p>\n<p style=\"text-align: center;\"><strong>Please send feedback and mailbag questions to SoVideogamesPODCAST (at) gmail (dot) com, or post them in the comments section below. Thanks!</strong></p>", "date": "2022-03-01", "url": "https://gamecritics.com/brad-gallaway/so-videogames-ep-273/"}, {"title": "So Videogames Ep. 272", "desc": "<p><a href=\"https://gamecritics.com/wp-content/uploads/2017/07/SVG-GC-Logo.jpg\"></a></p>\n<p>In this episode, Carlos & Brad discuss:</p>\n<p>Infernax<br />\nLacuna<br />\nRise of the Third Power<br />\nDying Light 2<br />\nRed Ronin<br />\nGrapple Dog<br />\nCyberpunk 2077<br />\nGrim Dawn: Definitive Edition</p>\n<p>\u2026And more!</p>\n<p align=\"center\"></p>\n<p style=\"text-align: center;\"><strong>Please send feedback and mailbag questions to SoVideogamesPODCAST (at) gmail (dot) com, or post them in the comments section below. Thanks!</strong></p>", "date": "2022-02-18", "url": "https://gamecritics.com/brad-gallaway/so-videogames-ep-272/"}, {"title": "So Videogames Ep. 271: The Angrycast", "desc": "<p><a href=\"https://gamecritics.com/wp-content/uploads/2017/07/SVG-GC-Logo.jpg\"></a></p>\n<p>In this episode, Carlos & Brad discuss:</p>\n<p>Dreamscaper<br />\nTux & Fanny<br />\nRise of the Third Power<br />\nScrapnaut<br />\nDraw a Stickman: Epic<br />\nDying Light 2: Stay Human<br />\nTransformers: Battlegrounds</p>\n<p>\u2026And more!</p>\n<p align=\"center\"></p>\n<p style=\"text-align: center;\"><strong>Please send feedback and mailbag questions to SoVideogamesPODCAST (at) gmail (dot) com, or post them in the comments section below. Thanks!</strong></p>", "date": "2022-02-11", "url": "https://gamecritics.com/brad-gallaway/so-videogames-ep-271-the-angrycast/"}, {"title": "So Videogames Ep. 270", "desc": "<p><a href=\"https://gamecritics.com/wp-content/uploads/2017/07/SVG-GC-Logo.jpg\"></a></p>\n<p>In this episode, Carlos & Brad discuss:</p>\n<p>Lake<br />\nGuardian of Lore<br />\nTears of Avia<br />\nCastle Morihisa<br />\nOlliOlli World<br />\nBlood Will Be Spilled<br />\nDying Light 2<br />\nThe Company Man</p>\n<p>\u2026And more!</p>\n<p align=\"center\"></p>\n<p style=\"text-align: center;\"><strong>Please send feedback and mailbag questions to SoVideogamesPODCAST (at) gmail (dot) com, or post them in the comments section below. Thanks!</strong></p>", "date": "2022-02-06", "url": "https://gamecritics.com/brad-gallaway/so-videogames-ep-270/"}, {"title": "So Videogames Ep. 269: E for Effort", "desc": "<p><a href=\"https://gamecritics.com/wp-content/uploads/2017/07/SVG-GC-Logo.jpg\"></a><br />\nIn this episode, Carlos and Brad discuss:</p>\n<p>Rage<br />\nUltra Age<br />\nVagante<br />\nThe Pedestrian<br />\nBad North<br />\nEternal Radiance<br />\nAnvil: Vault Breakers</p>\n<p>\u2026And more!</p>\n<p align=\"center\"></p>\n<p style=\"text-align: center;\"><strong>Please send feedback and mailbag questions to SoVideogamesPODCAST (at) gmail (dot) com, or post them in the comments section below. Thanks!</strong></p>", "date": "2022-01-28", "url": "https://gamecritics.com/brad-gallaway/so-videogames-ep-269-e-for-effort/"}, {"title": "So Videogames Ep. 268: Other People, But Talking About Myself", "desc": "<p><a href=\"https://gamecritics.com/wp-content/uploads/2017/07/SVG-GC-Logo.jpg\"></a></p>\n<p>In this episode, Carlos & Brad discuss:</p>\n<p>Blackwind<br />\nSNK v Capcom: Card Fighters Clash<br />\nDysmantle<br />\nRainbow 6: Extraction<br />\nNobody Saves the World</p>\n<p>\u2026And more!</p>\n<p align=\"center\"></p>\n<p style=\"text-align: center;\"><strong>Please send feedback and mailbag questions to SoVideogamesPODCAST (at) gmail (dot) com, or post them in the comments section below. Thanks!</strong></p>", "date": "2022-01-22", "url": "https://gamecritics.com/brad-gallaway/so-videogames-ep-268-other-people-but-talking-about-myself/"}, {"title": "So Videogames Ep. 267", "desc": "<p><a href=\"https://gamecritics.com/wp-content/uploads/2017/07/SVG-GC-Logo.jpg\"></a></p>\n<p>In this episode, Carlos & Brad cover:</p>\n<p>Nights of Azure<br />\nArcadia Fallen<br />\nDull Grey<br />\nDeep Rock Galactic<br />\nKena: Bridge of Spirits<br />\nNeon Abyss<br />\nFF12<br />\nLake</p>\n<p>\u2026And more!</p>\n<p align=\"center\"></p>\n<p style=\"text-align: center;\"><strong>Please send feedback and mailbag questions to SoVideogamesPODCAST (at) gmail (dot) com, or post them in the comments section below. Thanks!</strong></p>", "date": "2022-01-14", "url": "https://gamecritics.com/brad-gallaway/so-videogames-ep-267/"}, {"title": "So Videogames Ep. 266", "desc": "<p><a href=\"https://gamecritics.com/wp-content/uploads/2017/07/SVG-GC-Logo.jpg\"></a></p>\n<p>In this episode, Carlos takes a break and Brad\u2019s wife Gina fills in. Please excuse the super-rough edit, this was Brad\u2019s first time ever editing a podcast \u2014 and it shows!!</p>\n<p>Games covered include:</p>\n<p>The Gunk<br />\nDead Cells<br />\nKeyWe<br />\nHermitage: Strange Case Files<br />\nTimelie</p>\n<p>\u2026And more!</p>\n<p align=\"center\"></p>\n<p style=\"text-align: center;\"><strong>Please send feedback and mailbag questions to SoVideogamesPODCAST (at) gmail (dot) com, or post them in the comments section below. Thanks!</strong></p>", "date": "2022-01-07", "url": "https://gamecritics.com/brad-gallaway/so-videogames-ep-266/"}, {"title": "So Videogames Ep. 265: Hitting Things, Getting Things", "desc": "<p><a href=\"https://gamecritics.com/wp-content/uploads/2017/07/SVG-GC-Logo.jpg\"></a></p>\n<p>In this episode, Carlos & Brad discuss:</p>\n<p>Tunnel of Doom<br />\nFor the King<br />\nPawn of the Dead<br />\nRecord of Lodoss War: Deedlit<br />\nKeyWe<br />\nBiomutant<br />\nWarhammer 40K: Battlesector<br />\nOne Hand Clapping</p>\n<p>\u2026And more!</p>\n<p align=\"center\"></p>\n<p style=\"text-align: center;\"><strong>Please send feedback and mailbag questions to SoVideogamesPODCAST (at) gmail (dot) com, or post them in the comments section below. Thanks!</strong></p>", "date": "2021-12-31", "url": "https://gamecritics.com/brad-gallaway/so-videogames-ep-265-hitting-things-getting-things/"}, {"title": "So Videogames Ep. 263", "desc": "<p><a href=\"https://gamecritics.com/wp-content/uploads/2017/07/SVG-GC-Logo.jpg\"></a></p>\n<p>In this episode Carlos & Brad are prepping for the 2021 GOTY show coming next week, so they take a semi-break and play a bunch of demos from the current Microsoft Xbox Indie Winter Demo-Fest Thing.</p>\n<p>Enjoy this demo talk and grab them from the Xbox store(they\u2019re up until Dec 21!) and then send in your top 3 games of 2021 and 1 terrible one, whether it was just straight-up bad, a disappointment, or anything along those lines.</p>\n<p>We\u2019ll read your pick and give you a shout on the show next week!</p>\n<p align=\"center\"></p>\n<p style=\"text-align: center;\"><strong>Please send feedback and mailbag questions to SoVideogamesPODCAST (at) gmail (dot) com, or post them in the comments section below. Thanks!</strong></p>", "date": "2021-12-18", "url": "https://gamecritics.com/brad-gallaway/so-videogames-ep-263/"}, {"title": "So Videogames Ep. 262: All That Remains", "desc": "<p><a href=\"https://gamecritics.com/wp-content/uploads/2017/07/SVG-GC-Logo.jpg\"></a></p>\n<p>Apologies in advance \u2014 in Ep. 262, Brad\u2019s PC crashed during recording. Unfortunately, most of the show was lost and unable to be recovered. However, we carried on and made the most of what was left.</p>\n<p>It\u2019s probably the shortest show So Videogames has ever recorded and it\u2019s just a shadow of its former self, but we didn\u2019t want to skip a week and let our faithful listeners down!!</p>\n<p>Covered (BRIEFLY!!!) on this week\u2019s show:</p>\n<p>Halo Infinite<br />\nLoop Hero<br />\nShovel Knight Puzzle Dungeon<br />\nThe last Oricru (demo)<br />\nDate Night Bowling<br />\nAluna: Sentinel of the Shards<br />\nHeavenly Bodies<br />\nNobody Saves the World<br />\nSolar Ash</p>\n<p>\u2026And there was more, but it\u2019s gone. >_></p>\n<p>We\u2019ll be back to a regular, crash-free show next week!</p>\n<p align=\"center\"></p>\n<p style=\"text-align: center;\"><strong>Please send feedback and mailbag questions to SoVideogamesPODCAST (at) gmail (dot) com, or post them in the comments section below. Thanks!</strong></p>", "date": "2021-12-12", "url": "https://gamecritics.com/brad-gallaway/so-videogames-ep-262-all-that-remains/"}, {"title": "So Videogames Ep. 261", "desc": "<p><a href=\"https://gamecritics.com/wp-content/uploads/2017/07/SVG-GC-Logo.jpg\"></a></p>\n<p>In this episode, Carlos & Brad discuss\u2026</p>\n<p>Deathloop<br />\nLego Builder\u2019s Journey<br />\nIn My Shadow<br />\nThe Good Life<br />\nGrow: Song of the Evertree<br />\nWhere Cards Fall<br />\nLost in Random<br />\nChorus<br />\nCarve<br />\nPlaydate<br />\nCursed Golf</p>\n<p>AND they\u2019re joined by special guest Kinsey Burke, an old podcast buddy now working at Chuhai Labs!</p>\n<p align=\"center\"></p>\n<p style=\"text-align: center;\"><strong>Please send feedback and mailbag questions to SoVideogamesPODCAST (at) gmail (dot) com, or post them in the comments section below. Thanks!</strong></p>", "date": "2021-12-03", "url": "https://gamecritics.com/brad-gallaway/so-videogames-ep-261/"}, {"title": "So Videogames Ep. 260: Carlos Shoots Good", "desc": "<p><a href=\"https://gamecritics.com/wp-content/uploads/2017/07/SVG-GC-Logo.jpg\"></a></p>\n<p>In this episode, Carlos & Brad cover:</p>\n<p>DEEEER Simulator<br />\nUndungeon<br />\nSheepo< n: left;\"><a href=\"https://www.youtube.com/watch?v=pEZuUR_pTyo\">Carlos is over puzzles</a></p>\n<p style=\"text-align: left;\"><a href=\"https://www.thegamer.com/someone-built-a-large-ps5-the-size-of-a-small-ps5/\">The tiny PS5</a></p>\n<p align=\"center\"></p>\n<p style=\"text-align: center;\"><strong>Please send feedback and mailbag questions to SoVideogamesPODCAST (at) gmail (dot) com, or post them in the comments section below. Thanks!</strong></p>", "date": "2021-05-28", "url": "https://gamecritics.com/brad-gallaway/so-videogames-ep-234/"}, {"title": "So\u2026 Videogames! Ep. 233", "desc": "<p><a href=\"https://gamecritics.com/wp-content/uploads/2017/07/SVG-GC-Logo.jpg\"></a></p>\n<p>In this episode, Corey Motley returns!</p>\n<p>Carlos is off on sabbatical, so the SVG former co-host pops back in for one episode of fun and frivolity!</p>\n<p>The games discussed are:</p>\n<p>Talisman: Digital Edition<br />\nMass Effect: Legendary Edition<br />\nSpace Commander: War & Trade<br />\nDeath Crown</p>\n<p>And then the men segue into a sizable chat on Resident Evil: Village.</p>\n<p>The first half of the discussion is a spoiler-free examination of the mechanics and generalities, and the second half (AFTER A HUGE SPOILER WARNING) discusses the plot twists, surprises and OMG moments.</p>\n<p>Come join us, won\u2019t you!</p>\n<p>Special thanks to Matt Hunter!</p>\n<p align=\"center\"></p>\n<p style=\"text-align: center;\"><strong>Please send feedback and mailbag questions to SoVideogamesPODCAST (at) gmail (dot) com, or post them in the comments section below. Thanks!</strong></p>", "date": "2021-05-21", "url": "https://gamecritics.com/brad-gallaway/so-videogames-ep-233/"}, {"title": "So\u2026 Videogames! Ep. 232: Enter The Artie", "desc": "<p><a href=\"https://gamecritics.com/wp-content/uploads/2017/07/SVG-GC-Logo.jpg\"></a></p>\n<p>In this episode, Carlos and Brad are having an off day, and they unexpectedly find themselves joined by Artie \u2014 he\u2019s sick of their stumbles and shows them how to podcast correctly!</p>\n<p>Don\u2019t Give up<br />\nThe Colonists<br />\nSkate City<br />\nBuildings Have Feelings Too!<br />\nBaldur\u2019s Gate: Dark Alliance<br />\nLegend of Keepers</p>\n<p>\u2026And more!</p>\n<p align=\"center\"></p>\n<p style=\"text-align: center;\"><strong>Please send feedback and mailbag questions to SoVideogamesPODCAST (at) gmail (dot) com, or post them in the comments section below. Thanks!</strong></p>", "date": "2021-05-14", "url": "https://gamecritics.com/brad-gallaway/so-videogames-ep-232-enter-the-artie/"}, {"title": "So\u2026 Videogames! Ep. 231: Carlos is OVER Videogames", "desc": "<p><a href=\"https://gamecritics.com/wp-content/uploads/2017/07/SVG-GC-Logo.jpg\"></a></p>\n<p>In this episode, any adults of legal age might want to crack open a cold one for the first-ever So Videogames \u201ctake a drink\u201d game. That said, Carlos is OVER videogames, so if you play along, make sure you know when to say when!</p>\n<p>The titles covered are:</p>\n<p>Terminator: Resistance<br />\nSecond Extinction<br />\nReturnal<br />\nMonster Hunter Rise<br />\nProtocol<br />\nSmashing The Battle</p>\n<p>\u2026And more!</p>\n<p align=\"center\"></p>\n<p style=\"text-align: center;\"><strong>Please send feedback and mailbag questions to SoVideogamesPODCAST (at) gmail (dot) com, or post them in the comments section below. Thanks!</strong></p>", "date": "2021-05-07", "url": "https://gamecritics.com/brad-gallaway/so-videogames-ep-231-carlos-is-over-videogames/"}, {"title": "So\u2026 Videogames! Ep. 230", "desc": "<p class=\"wp-block-paragraph\"></p>\n\n\n<p><a href=\"https://gamecritics.com/wp-content/uploads/2017/07/SVG-GC-Logo.jpg\"></a></p>\n<p>In this episode, Carlos & Brad discuss:</p>\n<p>Breathedge<br />Little Mouse\u2019s Encyclopedia<br />Devil Slayer Raksasi<br />Journey of the Broken Circle<br />Terminator: Resistance<br />Nier Replicant<br />El Hijo</p>\n<p>\u2026And more!</p>\n<p align=\"center\"></p>\n<p style=\"text-align: center;\"><strong>Please send feedback and mailbag questions to SoVideogamesPODCAST (at) gmail (dot) com, or post them in the comments section below. Thanks!</strong></p>", "date": "2021-04-30", "url": "https://gamecritics.com/brad-gallaway/so-videogames-ep-230/"}, {"title": "So\u2026 Videogames! Ep. 229", "desc": "<p><a href=\"https://gamecritics.com/wp-content/uploads/2017/07/SVG-GC-Logo.jpg\"></a></p>\n<p>In this episode, Carlos & Brad discuss:</p>\n<p>RE: Village Demo<br />\nSay No! More<br />\nSmelter<br />\nRuvato: Original Complex<br />\nRain on Your Parade<br />\nThe Longing<br />\nHitchhiker<br />\nOutriders</p>\n<p>\u2026And more!</p>\n<p align=\"center\"></p>\n<p style=\"text-align: center;\"><strong>Please send feedback and mailbag questions to SoVideogamesPODCAST (at) gmail (dot) com, or post them in the comments section below. Thanks!</strong></p>", "date": "2021-04-24", "url": "https://gamecritics.com/brad-gallaway/so-videogames-ep-229/"}, {"title": "So\u2026 Videogames! Ep. 228", "desc": "<p><a href=\"https://gamecritics.com/wp-content/uploads/2017/07/SVG-GC-Logo.jpg\"></a></p>\n<p>In this episode, Carlos & Brad discuss:</p>\n<p>Omori<br />\nGodstrike (aka Profane)<br />\nCozy Grove<br />\nIt Takes Two<br />\nPoison Control<br />\nOutriders</p>\n<p>\u2026And more!</p>\n<p align=\"center\"></p>\n<p style=\"text-align: center;\"><strong>Please send feedback and mailbag questions to SoVideogamesPODCAST (at) gmail (dot) com, or post them in the comments section below. Thanks!</strong></p>", "date": "2021-04-16", "url": "https://gamecritics.com/brad-gallaway/so-videogames-ep-228/"}, {"title": "So\u2026 Videogames! Ep. 227", "desc": "<p><a href=\"https://gamecritics.com/wp-content/uploads/2017/07/SVG-GC-Logo.jpg\"></a></p>\n<p>In this episode, Carlos & Brad discuss:</p>\n<p>Genesis Noir<br />\nKosmokrats<br />\nI Saw Black Clouds<br />\nDisco Elysium: The Final Cut<br />\nLuckslinger<br />\nMonster Hunter Rise</p>\n<p>\u2026And more!</p>\n<p>ALSO, there\u2019s a brief spoiler section for Godzilla vs. Kong after the end of the show. Stay tuned if you want to hear thoughts from the guys and don\u2019t mind being spoiled!</p>\n<p align=\"center\"></p>\n<p style=\"text-align: center;\"><strong>Please send feedback and mailbag questions to SoVideogamesPODCAST (at) gmail (dot) com, or post them in the comments section below. Thanks!</strong></p>", "date": "2021-04-09", "url": "https://gamecritics.com/brad-gallaway/so-videogames-ep-227/"}, {"title": "So\u2026 Videogames! Ep. 226", "desc": "<p><a href=\"https://gamecritics.com/wp-content/uploads/2017/07/SVG-GC-Logo.jpg\"></a></p>\n<p><strong>In this episode, Carlos & Brad discuss:</strong></p>\n<p>Balan Wonderworld</p>\n<p>Black Legend</p>\n<p>Starbase Startopia</p>\n<p>Gensou Skydrift</p>\n<p>Octopath Traveler</p>\n<p>Samurai Shodown</p>\n<p>Cyberpunk 2077 Patch 1.2</p>\n<p>Leap of Fate</p>\n<p><strong>\u2026And more!</strong></p>\n<p align=\"center\"></p>\n<p style=\"text-align: center;\"><strong>Please send feedback and mailbag questions to SoVideogamesPODCAST (at) gmail (dot) com, or post them in the comments section below. Thanks!</strong></p>", "date": "2021-04-02", "url": "https://gamecritics.com/brad-gallaway/so-videogames-ep-226/"}, {"title": "So\u2026 Videogames! Ep. 225: The Days Gone A-to-Z Spoilercast!", "desc": "<p><a href=\"https://gamecritics.com/wp-content/uploads/2017/07/SVG-GC-Logo.jpg\"></a></p>\n<p>Carlos and Brad have been banging on about Days Gone for the last few episodes, but this time they blow the doors off of it \u2014 they\u2019ve both finished this massive game and are now going to pick it apart from A-to-Z.</p>\n<p>HEADS UP! the first half of the show is SPOILER-FREE where the guys talk generalities, mechanics, gameplay, and concepts.</p>\n<p>Then, they give a HUGE SPOILER WARNING in the middle of the show, and after that, all bets are off. From that point it\u2019s spoiler-palooza for all of the many twists, turns, and surprise reveals that lay in store.</p>\n<p>And, at the very end, they read listener comments!</p>\n<p align=\"center\"></p>\n<p style=\"text-align: center;\"><strong>Please send feedback and mailbag questions to SoVideogamesPODCAST (at) gmail (dot) com, or post them in the comments section below. Thanks!</strong></p>", "date": "2021-03-26", "url": "https://gamecritics.com/brad-gallaway/so-videogames-ep-225-the-days-gone-a-to-z-spoilercast/"}, {"title": "So\u2026 Videogames! Ep. 224", "desc": "<p><a href=\"https://gamecritics.com/wp-content/uploads/2017/07/SVG-GC-Logo.jpg\"></a></p>\n<p>In this episode, Carlos & Brad discuss:</p>\n<p>Signs of the Sojourner<br />\nBodyquest<br />\nPet Clinic: Cats & Dogs<br />\nCan\u2019t Drive This<br />\nBishoujo Battle Cyber Panic!<br />\nMundaun<br />\nIn Rays of Light<br />\nThe Outer Worlds: Murder on Eridanos</p>\n<p>\u2026And more!</p>\n<p align=\"center\"></p>\n<p style=\"text-align: center;\"><strong>Please send feedback and mailbag questions to SoVideogamesPODCAST (at) gmail (dot) com, or post them in the comments section below. Thanks!</strong></p>", "date": "2021-03-20", "url": "https://gamecritics.com/brad-gallaway/so-videogames-ep-224/"}, {"title": "So\u2026 Videogames! Ep. 223", "desc": "<p><a href=\"https://gamecritics.com/wp-content/uploads/2017/07/SVG-GC-Logo.jpg\"></a></p>\n<p>In this episode, Carlos & Brad discuss:</p>\n<p>Dreaming Sarah<br />\nUnder Leaves<br />\nWind Peaks<br />\nBattle Brothers<br />\nKatana Kata<br />\nMaquette<br />\nSteampunk Tower 2<br />\nTurok: Dinosaur Hunter<br />\nDays Gone</p>\n<p>\u2026And more!</p>\n<p align=\"center\"></p>\n<p style=\"text-align: center;\"><strong>Please send feedback and mailbag questions to SoVideogamesPODCAST (at) gmail (dot) com, or post them in the comments section below. Thanks!</strong></p>", "date": "2021-03-12", "url": "https://gamecritics.com/brad-gallaway/so-videogames-ep-223/"}, {"title": "So\u2026 Videogames! Ep. 222", "desc": "<p><a href=\"https://game za: Like a Dragon<br />\nDisjunction</p>\n<p>\u2026And more!</p>\n<p align=\"center\"></p>\n<p style=\"text-align: center;\"><strong>Please send feedback and mailbag questions to SoVideogamesPODCAST (at) gmail (dot) com, or post them in the comments section below. Thanks!</strong></p>", "date": "2021-01-29", "url": "https://gamecritics.com/brad-gallaway/so-videogames-ep-217/"}, {"title": "So\u2026 Videogames! Ep. 216", "desc": "<p><a href=\"https://gamecritics.com/wp-content/uploads/2017/07/SVG-GC-Logo.jpg\"></a></p>\n<p>In this episode, Carlos & Brad discuss:</p>\n<p>Neoverse</p>\n<p>Phogs!</p>\n<p>Ride 4</p>\n<p>Drunken Fist</p>\n<p>Gibbous</p>\n<p>Hitman 3</p>\n<p>All Walls Must Fall   <strong>\u2026And more!</strong></p>\n<p align=\"center\"></p>\n<p style=\"text-align: center;\"><strong>Please send feedback and mailbag questions to SoVideogamesPODCAST (at) gmail (dot) com, or post them in the comments section below. Thanks!</strong></p>", "date": "2021-01-27", "url": "https://gamecritics.com/brad-gallaway/so-videogames-ep-216/"}, {"title": "So\u2026 Videogames! Ep. 215", "desc": "<p><a href=\"https://gamecritics.com/wp-content/uploads/2017/07/SVG-GC-Logo.jpg\"></a></p>\n<p>In this episode, Carlos & Brad discuss:</p>\n<p>\u2013 Blacksmith of the sand kingdom<br />\n\u2013 Werewolf: Heart of the Forest<br />\n\u2013 The innsmouth case<br />\n\u2013 Misk School\u2019s Quest<br />\n\u2013 Grindstone<br />\n\u2013 Monster Hunter Rise demo<br />\n\u2013 Cyberpunk 2077<br />\n\u2013 AC Odyssey</p>\n<p>\u2026And more!</p>\n<p align=\"center\"></p>\n<p style=\"text-align: center;\"><strong>Please send feedback and mailbag questions to SoVideogamesPODCAST (at) gmail (dot) com, or post them in the comments section below. Thanks!</strong></p>", "date": "2021-01-17", "url": "https://gamecritics.com/brad-gallaway/so-videogames-ep-215/"}, {"title": "So\u2026 Videogames! Ep. 214", "desc": "<p><a href=\"https://gamecritics.com/wp-content/uploads/2017/07/SVG-GC-Logo.jpg\"></a></p>\n<p>In this episode, Carlos & Brad discuss:</p>\n<p style=\"text-align: center;\">Cobra Kai<br />\nNeoverse<br />\nWhen the Past Was Around<br />\nPine<br />\nCalico<br />\nDestropolis<br />\nMonster Train<br />\nGodfall<br />\nAC: Odyssey</p>\n<p style=\"text-align: right;\">\u2026And more!</p>\n<p align=\"center\"></p>\n<p style=\"text-align: center;\"><strong>Please send feedback and mailbag questions to SoVideogamesPODCAST (at) gmail (dot) com, or post them in the comments section below. Thanks!</strong></p>", "date": "2021-01-09", "url": "https://gamecritics.com/brad-gallaway/so-videogames-ep-214/"}, {"title": "So\u2026 Videogames! Ep. 213: GOTY 2020", "desc": "<p><a href=\"https://gamecritics.com/wp-content/uploads/2017/07/SVG-GC-Logo.jpg\"></a></p>\n<p>It\u2019s that time again!</p>\n<p>Carlos and Brad take a look back at 202 in the annual GOTY show. Each of the hosts brings their top 10, their Honorable Mentions, their Disappointments, and then finish up with listener picks!</p>\n<p>It\u2019s a two-hour extravaganza!</p>\n<p align=\"center\"></p>\n<p style=\"text-align: center;\"><strong>Please send feedback and mailbag questions to SoVideogamesPODCAST (at) gmail (dot) com, or post them in the comments section below. Thanks!</strong></p>", "date": "2020-12-31", "url": "https://gamecritics.com/brad-gallaway/so-videogames-ep-213-goty-2020/"}, {"title": "So\u2026 Videogames! Ep. 212: Cyberpunk 2077", "desc": "<div class=\"wp-block-image\"><a href=\"https://gamecritics.com/wp-content/uploads/2017/07/SVG-GC-Logo.jpg\"></a></div>\n\n\n\n<p class=\"wp-block-paragraph\">In this episode, Carlos & Brad discuss:</p>\n\n\n\n<p class=\"wp-block-paragraph\">11:23 Dragon Audit<br>19:44 Wingspan<br>24:28 Kentucky Route Zero<br>30:18 Synthetik Ultimate<br>34:41 Haven<br>47:38 Crawlco Block Knockers<br>55:45 Dicey Dungeons<br>1:03:29 Cyberpunk 2077<br>1:16:23 Assassin\u2019s Creed Odyssey</p>\n\n\n\n<p class=\"wp-block-paragraph\">\u2026And more!</p>\n\n\n\n<p class=\"wp-block-paragraph\"></p>\n\n\n\n<p class=\"has-text-align-center wp-block-paragraph\"><strong>Please send feedback and mailbag questions to SoVideogamesPODCAST (at) gmail (dot) com, or post them in the comments section below. Thanks!</strong></p>", "date": "2020-12-24", "url": "https://gamecritics.com/brad-gallaway/so-videogames-ep-212-cyberpunk-2077/"}, {"title": "So\u2026 Videogames! Ep. 211", "desc": "<div class=\"wp-block-image\"><a href=\"https://gamecritics.com/wp-content/uploads/2017/07/SVG-GC-Logo.jpg\"></a></div>\n\n\n\n<p class=\"wp-block-paragraph\">In this episode, Carlos & Brad discuss\u2026</p>\n\n\n\n<p class=\"wp-block-paragraph\">09:31     Temtem</p>\n\n\n\n<p class=\"wp-block-paragraph\">15:11       Picklock</p>\n\n\n\n<p class=\"wp-block-paragraph\">16:52\u00a0\u00a0\u00a0 \u00a0Absolute Drift: Zen Edition</p>\n\n\n\n<p class=\"wp-block-paragraph\">19:54\u00a0\u00a0\u00a0\u00a0 Call of the Sea</p>\n\n\n\n<p class=\"wp-block-paragraph\">22:38\u00a0\u00a0\u00a0 Morkredd</p>\n\n\n\n<p class=\"wp-block-paragraph\">25:09\u00a0\u00a0\u00a0 Immortals: Fenyx Rising</p>\n\n\n\n<p class=\"wp-block-paragraph\">43:18\u00a0\u00a0\u00a0\u00a0 Bridge Constructor: The Walking Dead</p>\n\n\n\n<p class=\"wp-block-paragraph\">45:04\u00a0\u00a0\u00a0 Evolution</p>\n\n\n\n<p class=\"wp-block-paragraph\">47:57\u00a0\u00a0\u00a0 Cyberpunk 2077</p>\n\n\n\n<p class=\"wp-block-paragraph\">01:17:04\u00a0\u00a0\u00a0\u00a0 Nine Witches: Family Disruption</p>\n\n\n\n<p class=\"wp-block-paragraph\">\u2026And more!</p>\n\n\n\n<p class=\"wp-block-paragraph\"></p>\n\n\n\n<p class=\"has-text-align-center wp-block-paragraph\"><strong>Please send feedback and mailbag questions to SoVideogamesPODCAST (at) gmail (dot) com, or post them in the comments section below. Thanks!</strong></p>", "date": "2020-12-21", "url": "https://gamecritics.com/brad-gallaway/so-videogames-ep-211/"}, {"title": "So\u2026 Videogames! Ep. 210: Recontexting", "desc": "<p><a href=\"https://gamecritics.com/wp-content/uploads/2017/07/SVG-GC-Logo.jpg\"></a></p>\n<p>In this episode, Carlos & Brad devote the entire show to a request from listener @Arhei777.</p>\n<p>The ask was to have the hosts list their favorite videogame stories of all time, but the discussion also covers what makes a good story and even what kinds of stories exist in games.</p>\n<p>Also, the listeners were asked what THEIR favorite game stories are, and we offer up the results!</p>\n<p align=\"center\"></p>\n<p style=\"text-align: center;\"><strong>Please send feedback and mailbag questions to SoVideogamesPODCAST (at) gmail (dot) com, or post them in the comments section below. Thanks!</strong></p>", "date": "2020-12-15", "url": "https://gamecritics.com/brad-gallaway/so-videogames-ep-210-recontexting/"}, {"title": "So\u2026 Videogames! Ep. 209", "desc": "<p><a href=\"https://gamecritics.com/wp-content/uploads/2017/07/SVG-GC-Logo.jpg\"></a></p>\n<p>In this episode, Carlos & Brad discuss:</p>\n<p>24:55         Tesla Force<br />\n36:45         If Found\u2026<br />\n40:00         Foregone<br />\n43:10         Morbid: the Seven Acolytes<br />\n47:55         Jydge<br />\n55:10         VtM: Shadows of New York<br />\n58:19         Gonner 2<br />\n01:01:19    Ponpu<br />\n01:05:35    Paw Paw Paw<br />\n01:11:54    Yakuza: Like A Dragon<br />\n01:18:16    Jeroen\u2019s Q&A</p>\n<p>\u2026And more!</p>\n<p align=\"center\"></p>\n<p style=\"text-align: center;\"><strong>Please send feedback and mailbag questions to SoVideogamesPODCAST (at) gmail (dot) com, or post them in the comments section below. Thanks!</strong></p>", "date": "2020-12-09", "url": "https://gamecritics.com/brad-gallaway/so-videogames-ep-209/"}, {"title": "So\u2026 Videogames! Ep. 208", "desc": "<p><a href=\"https://gamecritics.com/wp-content/uploads/2017/07/SVG-GC-Logo.jpg\"></a></p>\n<p>In this episode, Carlos & Brad take a break from the usual format and take a look back at the end of the PS4 era by choosing their top 10 games and discussing.</p>\n<
