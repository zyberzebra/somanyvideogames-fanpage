p>They also gathered the top PS4 picks from listeners through an online poll and share the results \u2014 spoiler, they have almost nothing in common with what the guys picked!</p>\n<p>For those of you who\u2019d like some video, Carlos covered his list (and a little extra) <a href=\"https://www.youtube.com/watch?v=P2wJRJBfBKg&feature=youtu.be\">right here</a>.</p>\n<p align=\"center\"></p>\n<p style=\"text-align: center;\"><strong>Please send feedback and mailbag questions to SoVideogamesPODCAST (at) gmail (dot) com, or post them in the comments section below. Thanks!</strong></p>", "date": "2020-12-03", "url": "https://gamecritics.com/brad-gallaway/so-videogames-ep-208/"}, {"title": "So\u2026 Videogames! Ep. 207", "desc": "<p><a href=\"https://gamecritics.com/wp-content/uploads/2017/07/SVG-GC-Logo.jpg\"></a></p>\n<p>In this episode, Carlos & Brad discuss:</p>\n<p>05:08 Watch Dogs Legion<br />\n12:24 The Pathless<br />\n29:01 Batbarian: Testament of the Primordials<br />\n31:20 Carto<br />\n35:17 Iris and the Giant<br />\n44:01 Spider Man: Miles Morales<br />\n54:32 Chicken Police: Paint it Red<br />\n01:00:55 Wasteland 3<br />\n01:11:21 Assassin\u2019s Creed: Valhalla</p>\n<p align=\"center\"></p>\n<p style=\"text-align: center;\"><strong>Please send feedback and mailbag questions to SoVideogamesPODCAST (at) gmail (dot) com, or post them in the comments section below. Thanks!</strong></p>", "date": "2020-11-27", "url": "https://gamecritics.com/brad-gallaway/so-videogames-ep-207/"}, {"title": "So\u2026 Videogames! Ep. 206", "desc": "<p><a href=\"https://gamecritics.com/wp-content/uploads/2017/07/SVG-GC-Logo.jpg\"></a></p>\n<p>In this episode, Carlos & Brad discuss:</p>\n<p>03:06   Watch Dogs: Legion</p>\n<p>07:32   Colt Canyon</p>\n<p>11:52   The Wizard & The Slug</p>\n<p>20:20   Yuppie Psycho: Executive Edition</p>\n<p>31:55   Assassin\u2019s Creed: Valhalla</p>\n<p>\u2026And more!</p>\n<p align=\"center\"></p>\n<p style=\"text-align: center;\"><strong>Please send feedback and mailbag questions to SoVideogamesPODCAST (at) gmail (dot) com, or post them in the comments section below. Thanks!</strong></p>", "date": "2020-11-20", "url": "https://gamecritics.com/brad-gallaway/so-videogames-ep-206/"}, {"title": "So\u2026 Videogames! Ep. 205", "desc": "<p><a href=\"https://gamecritics.com/wp-content/uploads/2017/07/SVG-GC-Logo.jpg\"></a></p>\n<p>In this episode, Carlos & Brad discuss:</p>\n<p>06:33 Carlos\u2019 new PS5<br />\n18:36 Astro\u2019s Playroom<br />\n25:16 The Last of Us, Part II<br />\n31:39 Crown Trick<br />\n35:25 Dreamscaper<br />\n35:24 Bugsnax<br />\n44:27 The Dark Pictures Anthology: Little Hope</p>\n<p>\u2026And more!</p>\n<p align=\"center\"></p>\n<p style=\"text-align: center;\"><strong>Please send feedback and mailbag questions to SoVideogamesPODCAST (at) gmail (dot) com, or post them in the comments section below. Thanks!</strong></p>", "date": "2020-11-16", "url": "https://gamecritics.com/brad-gallaway/so-videogames-ep-205/"}, {"title": "So\u2026 Videogames! Ep. 204", "desc": "<p><a href=\"https://gamecritics.com/wp-content/uploads/2017/07/SVG-GC-Logo.jpg\"></a></p>\n<p>In this episode, Carlos & Brad get back to their standard show format. Games discussed include:</p>\n<p style=\"text-align: left;\">08:45 A.I. Dungeon<br />\n14:50 Red Lantern<br />\n21:52 Watch Dogs: Legion<br />\n35:50 Wasteland 3<br />\n41:50 Disc Room<br />\n47:20 Filament</p>\n<p style=\"text-align: left;\">\u2026And more!</p>\n<p align=\"center\"></p>\n<p style=\"text-align: center;\"><strong>Please send feedback and mailbag questions to SoVideogamesPODCAST (at) gmail (dot) com, or post them in the comments section below. Thanks!</strong></p>", "date": "2020-11-09", "url": "https://gamecritics.com/brad-gallaway/so-videogames-ep-204/"}, {"title": "So\u2026 Videogames! Ep. 203: Nathan Fouts", "desc": "<p><a href=\"https://gamecritics.com/wp-content/uploads/2017/07/SVG-GC-Logo.jpg\"></a></p>\n<p>In this episode, Carlos & Brad put the normal routine on pause and instead spend an hour talking with the man behind Mommy\u2019s Best Games, Nathan Fouts.</p>\n<p>Topics include Nathan\u2019s history in the birth of Xbox Live Indies, indie development in general, starting his own studio and launching his own games, and his most recent release, a port of his XBLI classic, Shoot 1UP DX which recently hit the Switch.</p>\n<p align=\"center\"></p>\n<p style=\"text-align: center;\"><strong>Please send feedback and mailbag questions to SoVideogamesPODCAST (at) gmail (dot) com, or post them in the comments section below. Thanks!</strong></p>", "date": "2020-11-03", "url": "https://gamecritics.com/brad-gallaway/so-videogames-ep-203-nathan-fouts/"}, {"title": "So\u2026 Videogames! Ep. 202: Halloween Hop \u2018n Bop", "desc": "<p><a href=\"https://gamecritics.com/wp-content/uploads/2017/07/SVG-GC-Logo.jpg\"></a></p>\n<p>In this episode, Carlos & Brad discuss why Carlos was absent in Episode 201, they chat about a few random topics in Housekeeping, and bring a FULL plate of games to the show.</p>\n<p>ALSO, stay tuned after the end music for a special SPOILER discussion of the movie \u201cLove and Monsters\u201d with special guest star, Gina Gallaway. Why is it a *perfect* film for our modern times? Listen in and find out!!</p>\n<p><strong>TIMESTAMPS:</strong></p>\n<p>0:00 \u2013 3:00                   Opening</p>\n<p>03:00 \u2013 27:15               Housekeeping, Misc. Chat</p>\n<p>27:15 \u2013 40:25               Torchlight III</p>\n<p>40:25 \u2013 48:00               Ikenfell</p>\n<p>48:00 \u2013 55:43               G.I. Joe: Operation Blackout</p>\n<p>55:43 \u2013 01:00:51          Horace</p>\n<p>01:00:51 \u2013 01:12:30     Cloupunk</p>\n<p>01:12:30 \u2013 01:27:12     Amnesia: Rebirth</p>\n<p>01:27:12 \u2013 01:30:11     Pumpkin Jack</p>\n<p>01:30:11 \u2013 01:37:43     Scourgebringer</p>\n<p>01:37:43 \u2013 01:39:17     Closing</p>\n<p>01:39:17 \u2013 02:10:02    <strong>BONUS SEGMENT!</strong></p>\n<p>Spoiler discussion on \u201cLove & Monsters\u201d with Gina Gallaway</p>\n<p align=\"center\"></p>\n<p style=\"text-align: center;\"><strong>Please send feedback and mailbag questions to SoVideogamesPODCAST (at) gmail (dot) com, or post them in the comments section below. Thanks!</strong></p>", "date": "2020-10-25", "url": "https://gamecritics.com/brad-gallaway/so-videogames-ep-202-halloween-hop-n-bop/"}, {"title": "So\u2026 Videogames! Ep. 201", "desc": "<p><a href=\"https://gamecritics.com/wp-content/uploads/2017/07/SVG-GC-Logo.jpg\"></a></p>\n<p>In this episode, listeners can look forward to the surprise return of Corey Motley. Corey fills the pod\u2019s second seat while Carlos is off on a secret mission, probably somewhere warm and tropical.</p>\n<p>Although we don\u2019t usually do timestamps, we have added them below since this particular show is unusually front-heavy with chat.</p>\n<p>Also, a huge shout-out and thanks to my friend Donald W. Taylor II, who stepped in with a last-minute save and edited the podcast after I had been trying to self-teach myself how to do audio editing while Carlos was away. He did an infinitely better job than I could have done!!</p>\n<p style=\"text-align: center;\">Intro & Catching up with Corey: 00:20<br />\nHousekeeping: 33:41<br />\nThe Outer Worlds: Peril on Gorgon DLC: 51:06<br />\nRing of Pain: 1:06:10<br />\nSpellbreak: 1:15:04<br />\nFallout 76: 1:25:39<br />\nSpace Crew: 1:51:23<br />\nRebel Galaxy Outlaws: 2:01:39</p>\n<p align=\"center\"></p>\n<p style=\"text-align: center;\"><strong>Please send feedback and mailbag questions to SoVideogamesPODCAST (at) gmail (dot) com, or post them in the comments section below. Thanks!</strong></p>", "date": "2020-10-18", "url": "https://gamecritics.com/brad-gallaway/so-videogames-ep-201/"}, {"title": "So\u2026 Videogames! Ep. 200", "desc": "<p><a href=\"https://gamecritics.com/wp-content/uploads/2017/07/SVG-GC-Logo.jpg\"></a></p>\n<p style=\"text-align: center;\"><strong>Episode 200! </strong></p>\n<p>In this milestone, Carlos & Brad want to get to know the listening audience a little better before discussing:</p>\n<p style=\"text-align: center;\">Genshin Impact<br />\nGoing Under<br />\nGirls! Girls! Girls!? (Kickstarter)<br />\nSay No More<br />\nInmost<br />\nHellpoint<br />\nDeathtrap: World of Van Helsing</p>\n<p style=\"text-align: center;\">\u2026And more!!</p>\n<p align=\"center\"></p>\n<p style=\"text-align: center;\"><strong>Please send feedback and mailbag questions to SoVideogamesPODCAST (at) gmail (dot) com, or post them in the comments section below. Thanks!</strong></p>", "date": "2020-10-12", "url": "https://gamecritics.com/brad-gallaway/so-videogames-ep-200/"}, {"title": "So\u2026 Videogames! Ep. 199", "desc": "<p><a href=\"https://gamecritics.com/wp-content/uploads/2017/07/SVG-GC-Logo.jpg\"></a></p>\n<p>In this episode, Carlos & Brad discuss:</p>\n<p style=\"text-align: center;\">Kingdoms of Amalur: Re-Reckoning (check-in)<br />\nGoing Under (check in)<br />\nBartlow\u2019s Dread Machine<br />\nUnrailed<br />\nGenshin Impact<br />\nJenny LeClue, Detectivu<br />\nWarsaw</p>\n<p style=\"text-align: right;\">\u2026And more!</p>\n<p align=\"center\"></p>\n<p style=\"text-align: center;\"><strong>Please send feedback and mailbag questions to SoVideogamesPODCAST (at) gmail (dot) com, or post them in the comments section below. Thanks!</strong></p>", "date": "2020-10-01", "url": "https://gamecritics.com/brad-gallaway/so-videogames-ep-199/"}, {"title": "So\u2026 Videogames! Ep. 198", "desc": "<p><a href=\"https://gamecritics.com/wp-content/uploads/2017/07/SVG-GC-Logo.jpg\"></a></p>\n<p style=\"text-align: left;\">In this episode, Carlos & Brad discuss:</p>\n<p style=\"text-align: center;\">\nGoing Under<br />\nNecromunda: Underhive Wars<br />\nMortal Shell<br />\nKingdoms of Amalur: Re-Reckoning<br />\n13 Sentinels: Aegis Rim<br />\nHades<br />\nSpitkiss<br />\nFinal Fantasy: Crystal Chronicles Remastered</p>\n<p style=\"text-align: right;\">\u2026And more!</p>\n<p align=\"center\"></p>\n<p style=\"text-align: center;\"><strong>Please send feedback and mailbag questions to SoVideogamesPODCAST (at) gmail (dot) com, or post them in the comments section below. Thanks!</strong></p>", "date": "2020-09-25", "url": "https://gamecritics.com/brad-gallaway/so-videogames-ep-198/"}, {"title": "So\u2026 Videogames! Ep. 197", "desc": "<p><a href=\"https://gamecritics.com/wp-content/uploads/2017/07/SVG-GC-Logo.jpg\"></a></p>\n<p>In this episode, Carlos & Brad discuss:</p>\n<p style=\"text-align: center;\">Control\u2019s \u201cFoundation\u201d DLC<br />\nStruggling<br />\nWest of Dead<br />\nOuter Worlds \u201cPeril\u201d DLC<br />\nV:tM \u2013 Coteries of New York<br />\nParadise Killer<br />\nHere Be Dragons<br />\nWintermoor Tactics Club<br />\nFight Crab<br />\nWelcome to Elk</p>\n<p style=\"text-align: right;\"><strong>\u2026And more!</strong></p>\n<p align=\"center\"></p>\n<p style=\"text-align: center;\"><strong>Please send feedback and mailbag questions to SoVideogamesPODCAST (at) gmail (dot) com, or post them in the comments section below. Thanks!</strong></p>", "date": "2020-09-19", "url": "https://gamecritics.com/brad-gallaway/so-videogames-ep-197/"}, {"title": "So\u2026 Videogames! Ep. 196", "desc": "<p><a href=\"https://gamecritics.com/wp-content/uploads/2017/07/SVG-GC-Logo.jpg\"></a></p>\n<p>In this episode, Carlos & Brad discuss:</p>\n<p>Wasteland 3 (update)<br />\nDescenders (update)<br />\nNioh 2 (update)<br />\nOne Line Coloring<br />\nTony Hawk 1&2 Remake<br />\nControl: AWE<br />\nStruggling<br />\nAvengers<br />\nNecromunda: Underhive Wars<br />\nLair of the Clockwork God</p>\n<p>\u2026And more!</p>\n<p align=\"center\"></p>\n<p style=\"text-align: center;\"><strong>Please send feedback and mailbag questions to SoVideogamesPODCAST (at) gmail (dot) com, or post them in the comments section below. Thanks!</strong></p>", "date": "2020-09-10", "url": "https://gamecritics.com/brad-gallaway/so-videogames-ep-196/"}, {"title": "So\u2026 Videogames! Ep. 195", "desc": "<p><a href=\"https://gamecritics.com/wp-content/uploads/2017/07/SVG-GC-Logo.jpg\"></a></p>\n<p>In this episode, Caros & Brad discuss:</p>\n<p style=\"text-align: center;\">Helheim Hassle<br />\nA Short Hike<br />\nDivinity: Original Sin 2<br />\nDescenders<br />\nLonely Mountains: Downhill<br />\nRaji: An Ancient Epic<br />\nRunestone Keeper<br />\nDeath\u2019s Hangover<br />\nWasteland 3<br />\nGamescom Announcements</p>\n<p style=\"text-align: right;\">\u2026And more!</p>\n<p align=\"center\"></p>\n<p style=\"text-align: center;\"><strong>Please send feedback and mailbag questions to SoVideogamesPODCAST (at) gmail (dot) com, or post them in the comments section below. Thanks!</strong></p>", "date": "2020-08-31", "url": "https://gamecritics.com/brad-gallaway/so-videogames-ep-195/"}, {"title": "So\u2026 Videogames! Ep. 194: The FREE Episode", "desc": "<p><a href=\"https://gamecritics.com/wp-content/uploads/2017/07/SVG-GC-Logo.jpg\"></a></p>\n<p>In this episode, Brad & Carlos put the regular show on pause to give away a ton of free games!</p>\n<p>It\u2019s first-come, first-served as PC, PS4, Switch and Xbox One games are handed out to any listener who wants one.</p>\n<p>Listen in for details!</p>\n<p align=\"center\"></p>\n<p style=\"text-align: center;\"><strong>Please send feedback and mailbag questions to SoVideogamesPODCAST (at) gmail (dot) com, or post them in the comments section below. Thanks!</strong></p>", "date": "2020-08-26", "url": "https://gamecritics.com/brad-gallaway/so-videogames-ep-194-the-free-episode/"}, {"title": "So\u2026 Videogames! Ep. 193: People Ass", "desc": "<p><a href=\"https://gamecritics.com/wp-content/uploads/2017/07/SVG-GC-Logo.jpg\"></a></p>\n<p>It\u2019s a jam-packed episode with rapid-fire round-robin coverage of game after game from start to finish!</p>\n<p>Carlos & Brad cover a wide range of topics, and the games discussed in this episode include (but are not limited to):</p>\n<p>Zanki Zero: Last Beginning<br />\nImmortal Unchained<br />\nHeroes of Hammerwatch<br />\nIs it wrong to pick up girls in a dungeon: Infinite Combat<br />\nMeteorfall: Krumit\u2019s Tale<br />\nBuried Stars<br />\nCruel Bands Career<br />\nHyper Scape<br />\nWide Ocean, Big Jacket<br />\nFall Guys<br />\nNippon Marathon<br />\nVolta-X<br />\nThe Avengers (beta)\u2026 And more!</p>\n<p align=\"center\"></p>\n<p style=\"text-align: center;\"><strong>Please send feedback and mailbag questions to SoVideogamesPODCAST (at) gmail (dot) com, or post them in the comments section below. Thanks!</strong></p>", "date": "2020-08-14", "url": "https://gamecritics.com/brad-gallaway/so-videogames-ep-193-people-ass/"}, {"title": "So\u2026 Videogames! Ep. 192: Sexy Simpsons", "desc": "<p><a href=\"https://gamecritics.com/wp-content/uploads/2017/07/SVG-GC-Logo.jpg\"></a></p>\n<p style=\"text-align: center;\">Episode 192 is jam-packed with games! Carlos & Brad discuss:</p>\n<p style=\"text-align: center;\">Sword Art Online: Alicization Lycoris<br />\nOthercide<br />\nMittelborg: City of Mages<br />\nCarrion<br />\nRadical Rabbit Stew<br />\nEverreach: Project Eden<br />\nMax Gentlemen Sexy Business!<br />\nNowhere Prophet<br />\nWe Should Talk</p>\n<p style=\"text-align: center;\">\u2026 And more!!</p>\n<p align=\"center\"></p>\n<p style=\"text-align: center;\"><strong>Please send feedback and mailbag questions to SoVideogamesPODCAST (at) gmail (dot) com, or post them in the comments section below. Thanks!</strong></p>", "date": "2020-08-04", "url": "https://gamecritics.com/brad-gallaway/so-videogames-ep-192-sexy-simpsons/"}, {"title": "So\u2026 Videogames! Ep. 191: Scuttlebutt", "desc": "<p><a href=\"https://gamecritics.com/wp-content/uploads/2017/07/SVG-GC-Logo.jpg\"></a></p>\n<p>In this episode, Carlos & Brad focus on a single topic \u2013 the Xbox Games Showcase that took place in July, 2020. They cover each game that was announced and go on several tangents along the way.</p>\n<p align=\"center\"></p>\n<p style=\"text-align: center;\"><strong>Please send feedback and mailbag questions to SoVideogamesPODCAST (at) gmail (dot) com, or post them in the comments section below. Thanks!</strong></p>", "date": "2020-07-28", "url": "https://gamecritics.com/brad-gallaway/so-videogames-ep-191-scuttlebutt/"}, {"title": "So\u2026 Videogames! Ep. 190: Over 3000", "desc": "<p><a href=\"https://gamecritics.com/wp-content/uploads/2017/07/SVG-GC-Logo.jpg\"></a></p>\n<p>In this episode, Carlos & Brad welcome Corey back to the show after an extended absence, and the three of them serve up a heaping helping of games chat. The titles covered include:</p>\n<p style=\"text-align: center;\">SUPERHOT: Mind Control Delete<br />\nGhost of Tsushima<br />\nWarhammer 40,000: Mechanicus<br />\nRetrovamp<br />\nRainswept<br />\nSuperliminal</p>\n<p style=\"text-align: center;\"><strong>\u2026And more!</strong></p>\n<p align=\"center\"></p>\n<p style=\"text-align: center;\"><strong>Please send feedback and mailbag questions to SoVideogamesPODCAST (at) gmail (dot) com, or post them in the comments section below. Thanks!</strong></p>", "date": "2020-07-23", "url": "https://gamecritics.com/brad-gallaway/so-videogames-ep-190-over-3000/"}, {"title": "So\u2026 Videogames! Ep. 189", "desc": "<p><a href=\"https://gamecritics.com/wp-content/uploads/2017/07/SVG-GC-Logo.jpg\"></a></p>\n<p>Now that 2020 is half over, Carlos & Brad take time out from the regular episode track to recap some of their top picks from January to June. They also discuss listener picks and highlight a few titles they\u2019re looking forward to in the next six months.</p>\n<p align=\"center\"></p>\n<p style=\"text-align: center;\"><strong>Please send feedback and mailbag questions to SoVideogamesPODCAST (at) gmail (dot) com, or post them in the comments section below. Thanks!</strong></p>", "date": "2020-07-15", "url": "https://gamecritics.com/brad-gallaway/so-videogames-ep-189/"}, {"title": "So\u2026 Videogames! Ep. 188", "desc": "<p><a href=\"https://gamecritics.com/wp-content/uploads/2017/07/SVG-GC-Logo.jpg\"></a></p>\n<p>In this episode, Carlos & Brad discuss <span style=\"font-size: inherit;\">Sword of Ditto, </span>Bulletstorm, Tennis 1920s, Dune Sea, Swarmriders, Monster Prom XXL, Bound by Flame, Skelattack, Yes Your Grace and more!</p>\n<p align=\"center\"></p>\n<p style=\"text-align: center;\"><strong>Please send feedback and mailbag questions to SoVideogamesPODCAST (at) gmail (dot) com, or post them in the comments section below. Thanks!</strong></p>", "date": "2020-07-08", "url": "https://gamecritics.com/brad-gallaway/so-videogames-ep-188/"}, {"title": "So\u2026 Videogames! Ep. 187", "desc": "<p><a href=\"https://gamecritics.com/wp-content/uploads/2017/07/SVG-GC-Logo.jpg\"></a></p>\n<p>It\u2019s been a minute, but Carlos & Brad are back with a full plate! Sit back and listen to them discuss:</p>\n<p>Mad Max<br />\nTower of Time<br />\nPath of Exile<br />\nDisintegration<br />\n1971 Project Helios<br />\nThe Last of Us 2 (NO SPOILERS)<br />\nWest of Dead<br />\nGoosebumps: Dead of Night<br />\nArcade Spirits</p>\n<p>\u2026And more!</p>\n<p align=\"center\"></p>\n<p style=\"text-align: center;\"><strong>Please send feedback and mailbag questions to SoVideogamesPODCAST (at) gmail (dot) com, or post them in the comments section below. Thanks!</strong></p>", "date": "2020-07-02", "url": "https://gamecritics.com/brad-gallaway/so-videogames-ep-187/"}, {"title": "So\u2026 Videogames! Ep. 186", "desc": "<p><a href=\"https://gamecritics.com/wp-content/uploads/2017/07/SVG-GC-Logo.jpg\"></a></p>\n<p>Welcome back to the land of beefy episodes! We\u2019ve been doing shorter shows for a while, but we pile our plate full for 186.</p>\n<p>In this ep, Carlos & Brad talk about the recent PS5 announcement show and go through all the games that were announced. Then they cover Hakoniwa Explorer Plus, Moonlighter, The Last of Us 2 (NO SPOILERS!), Desperados III, Ys: Memories of Celceta and Waking.</p>\n<p>\u2026And more!</p>\n<p align=\"center\"></p>\n<p style=\"text-align: center;\"><strong>Please send feedback and mailbag questions to SoVideogamesPODCAST (at) gmail (dot) com, or post them in the comments section below. Thanks!</strong></p>", "date": "2020-06-21", "url": "https://gamecritics.com/brad-gallaway/so-videogames-ep-186/"}, {"title": "So\u2026 Videogames! Ep. 185", "desc": "<p><a href=\"https://gamecritics.com/wp-content/uploads/2017/07/SVG-GC-Logo.jpg\"></a></p>\n<p>It\u2019s an odd episode \u2013 Brad\u2019s deep in a game still under embargo, so he doesn\u2019t have much he\u2019s allowed to talk about this week, and Carlos brings us back to Fallout 76: Wastelanders in the continuing saga of his post-apocalyptic journeys.</p>\n<p>Titles discussed in this episode include:</p>\n<p>Skelattack<br />\nEvan\u2019s Remains<br />\nHelp Will Come Tomorrow<br />\nLiberated<br />\nDepth of Extinction<br />\nYs: memories of Celceta<br />\nNioh 2<br />\nFallout 76: Wastelanders</p>\n<p>ALSO, the guys talk about the incredible 1000+ games for $5 bundle at Itch.io in housekeeping at the top of the show. As promised, here\u2019s a few picks from each of them.</p>\n<p><strong>Carlos\u2019 picks:</strong><br />\nNight in the woods<br />\nA short hike<br />\nCeleste<br />\nMinit<br />\nCatlateral damage<br />\nWide ocean big jacket<br />\nPikuniku<br />\nGnog<br />\nSpeed dating for ghosts<br />\nVillage monsters</p>\n<p><strong>Brad\u2019s picks:</strong><br />\nArcade spirits<br />\nLoot Rascals<br />\nFar From Noise<br />\nGlittermitten Grove (aka Frog Fractions 2)*<br />\nGolf Peaks<br />\nOld Man\u2019s Journey<br />\nAstrologaster*<br />\nPlunge<br />\nOctodad: Dadliest Catch<br />\nNeversong<br />\nWampus*</p>\n<p>*Brad has not played these, but they are high on his \u201ctry this out\u201d list.</p>\n<p align=\"center\"></p>\n<p style=\"text-align: center;\"><strong>Please send feedback and mailbag questions to SoVideogamesPODCAST (at) gmail (dot) com, or post them in the comments section below. Thanks!</strong></p>", "date": "2020-06-12", "url": "https://gamecritics.com/brad-gallaway/so-videogames-ep-185/"}, {"title": "So\u2026 Videogames! Ep. 184", "desc": "<p><a href=\"https://gamecritics.com/wp-content/uploads/2017/07/SVG-GC-Logo.jpg\"></a></p>\n<p>We weren\u2019t going to record this week, but we got your tweets and emails.</p>\n<p>Thank you to everyone who contacted us and said that you listen to SVG for a few moments of zen when the world is feeling like too much. If doing this podcast can bring even a few moments of good into the world right now, we\u2019re glad to do it.</p>\n<p>So, in that context, this week\u2019s show covers:</p>\n<p>Trails of Cold Steel, PS4<br />\nNeo Cab, Switch (wrapup)<br />\nFallout 76: Wastelanders, PS4 (check-in)<br />\nNioh 2, PS4<br />\nThose Who Remain, PS4</p>\n<p>\u2026And More! Stay safe, stay healthy, and we hope this week\u2019s show brings a few moments of peace to you while we all fight the good fight.</p>\n<p align=\"center\"></p>\n<p style=\"text-align: center;\"><strong>Please send feedback and mailbag questions to SoVideogamesPODCAST (at) gmail (dot) com, or post them in the comments section below. Thanks!</strong></p>", "date": "2020-06-03", "url": "https://gamecritics.com/brad-gallaway/so-videogames-ep-184/"}, {"title": "So\u2026 Videogames! Ep. 183", "desc": "<p><a href=\"https://gamecritics.com/wp-content/uploads/2017/07/SVG-GC-Logo.jpg\"></a></p>\n<p>In this king-sized episode, Carlos and Brad discuss\u2026</p>\n<p>Curse of the Dead Gods, PC<br />\nDrake Hollow (beta), XBO<br />\nMortal Kombat 11: Aftermath, PS4<br />\nMinecraft Dungeons, PS4/XBO,<br />\nNeo Cab, Switch<br />\nAtomicrops, Switch<br />\nFallout 76: Wastelanders, PS4</p>\n<p style=\"text-align: left;\">Before they wrap the show, they also go off on some wild tangents after answering some listener Q&A. Ever wonder what childhood was like for these guys? You\u2019re about to find out!</p>\n<p style=\"text-align: center;\">Also, you can now watch animated clips from our podcast <a href=\"https://www.youtube.com/channel/UCyW8M3ozCxRLqntNXX13AmA\">here</a>!</p>\n<p align=\"center\"></p>\n<p style=\"text-align: center;\"><strong>Please send feedback and mailbag questions to SoVideogamesPODCAST (at) gmail (dot) com, or post them in the comments section below. Thanks!</strong></p>", "date": "2020-05-29", "url": "https://gamecritics.com/brad-gallaway/so-videogames-ep-183/"}, {"title": "So\u2026 Videogames! Ep. 182", "desc": "<p><a href=\"https://gamecritics.com/wp-content/uploads/2017/07/SVG-GC-Logo.jpg\"></a></p>\n<p>In this episode, Carlos goes retro and is NOT happy with the results.</p>\n<p style=\"text-align: center;\">Titles covered:<br />\n>The Mafia Trilogy: Remastered (PS4)<br />\n>Dungeon of the Endless (Switch)<br />\n>Saints Row III: Remastered (PS4)<br />\n>Turmoil: the Heat is On (Switch)</p>\n<p style=\"text-align: center;\">Plus, listener Q&A and more!</p>\n<p style=\"text-align: center;\">Also, you can now watch animated clips from our podcast <a href=\"https://www.youtube.com/channel/UCyW8M3ozCxRLqntNXX13AmA\">here</a>!</p>\n<p align=\"center\"></p>\n<p style=\"text-align: center;\"><strong>Please send feedback and mailbag questions to SoVideogamesPODCAST (at) gmail (dot) com, or post them in the comments section below. Thanks!</strong></p>", "date": "2020-05-25", "url": "https://gamecritics.com/brad-gallaway/so-videogames-ep-182/"}, {"title": "So\u2026 Videogames! Ep. 181", "desc": "<p><a href=\"https://gamecritics.com/wp-content/uploads/2017/07/SVG-GC-Logo.jpg\"></a></p>\n<p style=\"text-align: center;\">It\u2019s a microsode! In this episode, Carlos discusses Sakura Wars (PS4) and Brad offers high praise for The Eternal Castle Remastered (Switch).</p>\n<p style=\"text-align: center;\">Also, you can now watch animated clips from our podcast <a href=\"https://www.youtube.com/channel/UCyW8M3ozCxRLqntNXX13AmA\">here</a>!</p>\n<p align=\"center\"></p>\n<p style=\"text-align: center;\"><strong>Please send feedback and mailbag questions to SoVideogamesPODCAST (at) gmail (dot) com, or post them in the comments section below. Thanks!</strong></p>", "date": "2020-05-19", "url": "https://gamecritics.com/brad-gallaway/so-videogames-ep-181/"}, {"title": "So\u2026 Videogames! Ep. 180", "desc": "<p><a href=\"https://gamecritics.com/wp-content/uploads/2017/07/SVG-GC-Logo.jpg\"></a></p>\n<p>In this episode, Carlos & Brad do a bit of housekeeping and then follow up with a full slate of game chat.</p>\n<p style=\"text-align: left;\">Titles in this episode include:</p>\n<p style=\"text-align: center;\">\nGravity Rider Zero<br />\nKingdom: Two Crowns<br />\nObey Me<br />\nIdle Champions of the Forgotten Realms<br />\nJet Lancer<br />\nLuftrausers<br />\nHighrise Heroes</p>\n<p style=\"text-align: center;\">\u2026 And more!</p>\n<p style=\"text-align: center;\">Also, you can now watch animated clips from our podcast <a href=\"https://www.youtube.com/channel/UCyW8M3ozCxRLqntNXX13AmA\">here</a>!</p>\n<p align=\"center\"></p>\n<p style=\"text-align: center;\"><strong>Please send feedback and mailbag questions to SoVideogamesPODCAST (at) gmail (dot) com, or post them in the comments section below. Thanks!</strong></p>", "date": "2020-05-15", "url": "https://gamecritics.com/brad-gallaway/so-videogames-ep-180/"}, {"title": "So\u2026 Videogames! Ep. 179", "desc": "<p><a href=\"https://gamecritics.com/wp-content/uploads/2017/07/SVG-GC-Logo.jpg\"></a></p>\n<p>In this episode, Carlos & Brad discuss the Inside Xbox (May 2020) reveals before going into the usual games chat covering John Wick Hex, Wreckfest, and Spaceland. At the end of the show, the guys also discuss the May 6 story trailer for The Last of Us 2.</p>\n<p style=\"text-align: center;\">Also, you can now watch animated clips from our podcast <a href=\"https://www.youtube.com/channel/UCyW8M3ozCxRLqntNXX13AmA\">here</a>!</p>\n<p align=\"center\"></p>\n<p style=\"text-align: center;\"><strong>Please send feedback and mailbag questions to SoVideogamesPODCAST (at) gmail (dot) com, or post them in the comments section below. Thanks!</strong></p>", "date": "2020-05-15", "url": "https://gamecritics.com/brad-gallaway/so-videogames-ep-179/"}, {"title": "So\u2026 Videogames! Ep. 178", "desc": "<p><a href=\"https://gamecritics.com/wp-content/uploads/2017/07/SVG-GC-Logo.jpg\"></a></p>\n<p>In this episode, Carlos & Brad are bringing one of their old-fashioned, stuffed-to-the-gills extravaganzas. This is NOT a microsode, so buckle in!<br />\nTopics on deck include:</p>\n<p>Trials of Mana \u2013 update<br />\nNo Man\u2019s Sky \u2013 wrapup<br />\nFairy Knights, PC<br />\nWartile, PS4<br />\nTelling Lies, PC<br />\nDeliver Us the Moon, PS4<br />\nStranded Deep, PS4</p>\n<p>\u2026And more!</p>\n<p align=\"center\"></p>\n<p style=\"text-align: center;\"><strong>Please send feedback and mailbag questions to SoVideogamesPODCAST (at) gmail (dot) com, or post them in the comments section below. Thanks!</strong></p>", "date": "2020-05-04", "url": "https://gamecritics.com/brad-gallaway/so-videogames-ep-177/"}, {"title": "So\u2026 Videogames! Ep. 177", "desc": "<p><a href=\"https://gamecritics.com/wp-content/uploads/2017/07/SVG-GC-Logo.jpg\"></a></p>\n<p>In this episode, Carlos and Brad keep it nice and tight with four games and a listener question.</p>\n<p>Topics include:</p>\n<p>Corruption 2029 (PC)<br />\nProfane (Switch)<br />\nPong Quest (PC)<br />\nSunless Sea: Zubmariner Edition (Switch)</p>\n<p align=\"center\"></p>\n<p style=\"text-align: center;\"><strong>Please send feedback and mailbag questions to SoVideogamesPODCAST (at) gmail (dot) com, or post them in the comments section below. Thanks!</strong></p>", "date": "2020-04-27", "url": "https://gamecritics.com/brad-gallaway/so-videogames-ep-176-2/"}, {"title": "So\u2026 Videogames! Ep. 176", "desc": "<p><a href=\"https://gamecritics.com/wp-content/uploads/2017/07/SVG-GC-Logo.jpg\"></a></p>\n<p>In this episode, Carlos explains why cybermelding with futuristic racecar hotties in <em><strong>Nirvana Pilot Yume</strong></em> (Switch) is actually lame, Brad spotlights <em><strong>Surviving the Aftermath</strong> </em>(XBO) and <em><strong>Snakeybus</strong></em> (PS4), Carlos gives his wrapup of <em><strong>Final Fantasy 7 Remake</strong></em> (PS4) and both guys bag on <strong><em>No Man\u2019s Sky</em> </strong>(PS4)\u2026 sort of?</p>\n<p align=\"center\"></p>\n<p style=\"text-align: center;\"><strong>Please send feedback and mailbag questions to SoVideogamesPODCAST (at) gmail (dot) com, or post them in the comments section below. Thanks!</strong></p>", "date": "2020-04-20", "url": "https://gamecritics.com/brad-gallaway/so-videogames-ep-176/"}, {"title": "So\u2026 Videogames! Ep. 175", "desc": "<p class=\"wp-block-paragraph\"> In this episode, Carlos deep-dives into this first few hours with the<em><strong> Final Fantasy 7 Remake</strong></em>. Then, Brad gives an update on his fourth attempt to get into <strong><em>No Man\u2019s Sky</em></strong>, as well as quick rundowns of <em><strong>Convoy</strong></em> and <em><strong>Rush Rover</strong></em>, two roguelikes for the Switch. </p>\n\n\n\n<p class=\"wp-block-paragraph\">Also, as an added bonus, check out some pics Carlos took from the O.G. old-school version of <em>NMS </em>below! </p>\n\n\n\n\n\n\n\n<p class=\"wp-block-paragraph\"><strong>Please send feedback and mailbag questions to SoVideogamesPODCAST (at) gmail (dot) com, or post them in the comments section below. Thanks!</strong></p>", "date": "2020-04-14", "url": "https://gamecritics.com/brad-gallaway/so-videogames-ep-174-too-many-thumbs-up/"}, {"title": "So\u2026 Videogames! Ep. 174", "desc": "<p><a href=\"https://gamecritics.com/wp-content/uploads/2017/07/SVG-GC-Logo.jpg\"></a></p>\n<p>In this episode, prodigal co-host Corey Motley returns to discuss <strong>Resident Evil 3</strong> while Carlos takes a look at <strong>Immortal Legacy: the Jade Cipher</strong> and Brad surprises everyone by getting back into <strong>No Man\u2019s Sky</strong> after some recent content updates target his weak points with devastating critical hits.</p>\n<p align=\"center\"></p>\n<p style=\"text-align: center;\"><strong>Please send feedback and mailbag questions to SoVideogamesPODCAST (at) gmail (dot) com, or post them in the comments section below. Thanks!</strong></p>", "date": "2020-04-10", "url": "https://gamecritics.com/brad-gallaway/so-videogames-ep-174/"}, {"title": "So\u2026 Videogames! Ep. 173", "desc": "<p><a href=\"https://gamecritics.com/wp-content/uploads/2017/07/SVG-GC-Logo.jpg\"></a></p>\n<p>In this episode, Carlos & Brad cover:</p>\n<p style=\"text-align: center;\">Warhammer 40K Inquisitor: Martyr, PS4<br />\nDeep Sky Derelicts, Switch<br />\nShinsekai: Into the Depths, Switch<br />\nThe Complex, PS4</p>\n<p>AND they do a quick <strong>spoiler section</strong> on The Complex\u2019s endings after the closing music.</p>\n<p align=\"center\"></p>\n<p style=\"text-align: center;\"><strong>Please send feedback and mailbag questions to SoVideogamesPODCAST (at) gmail (dot) com, or post them in the comments section below. Thanks!</strong></p>", "date": "2020-04-06", "url": "https://gamecritics.com/brad-gallaway/so-videogames-ep-173/"}, {"title": "So\u2026 Videogames! Ep. 172 \u2014 Nah, Dawg", "desc": "<p><a href=\"https://gamecritics.com/wp-content/uploads/2017/07/SVG-GC-Logo.jpg\"></a></p>\n<p>In this episode, Carlos & Brad return to a semi-normal format and deliver a longer-than-minisode cut. Games discussed are:</p>\n<p>Shadow Warrior 2<br />\nControl: The Foundation (DLC)<br />\nBravely Default 2 (demo)<br />\nVampire: the Masquerade \u2013 Coteries of New York</p>\n<p>And then they FINALLY answer a listener question asking them to name the 5 games that made them who they are. It gets personal!</p>\n<p align=\"center\"></p>\n<p style=\"text-align: center;\"><strong>Please send feedback and mailbag questions to SoVideogamesPODCAST (at) gmail (dot) com, or post them in the comments section below. Thanks!</strong></p>", "date": "2020-03-31", "url": "https://gamecritics.com/brad-gallaway/so-videogames-ep-172-nah-dawg/"}, {"title": "So\u2026 Videogames! Ep. 171 \u2014 Just The Tip", "desc": "<p><a href=\"https://gamecritics.com/wp-content/uploads/2017/07/SVG-GC-Logo.jpg\"></a></p>\n<p>Welcome to micro-sode #3, also known as Episode 171!</p>\n<p>It\u2019s cause for celebration this time around as long-lost former co-host <strong>Corey Motley</strong> returns to the show to talk about <em>Doom Eternal</em>! We also give a shout-out to <em>Tangledeep</em> and <em>Control</em>.</p>\n<p align=\"center\"></p>\n<p style=\"text-align: center;\"><strong>Please send feedback and mailbag questions to SoVideogamesPODCAST (at) gmail (dot) com, or post them in the comments section below. Thanks!</strong></p>", "date": "2020-03-27", "url": "https://gamecritics.com/brad-gallaway/so-videogames-ep-171-just-the-tip/"}, {"title": "So\u2026 Videogames! Ep. 170 \u2013 Carlos Is Not making Sense", "desc": "<p><a href=\"https://gamecritics.com/wp-content/uploads/2017/07/SVG-GC-Logo.jpg\"></a></p>\n<p>In this micro-sode, Carlos & Brad cover the Trials of Mana demo currently available on PS4. They also ask readers what games are keeping them busy while self-isolating during the coronavirus pandemic and read the responses.</p>\n<p align=\"center\"></p>\n<p style=\"text-align: center;\"><strong>Please send feedback and mailbag questions to SoVideogamesPODCAST (at) gmail (dot) com, or post them in the comments section below. Thanks!</strong></p>", "date": "2020-03-23", "url": "https://gamecritics.com/brad-gallaway/so-videogames-ep-170-carlos-is-not-making-sense/"}, {"title": "So\u2026 Videogames! Ep. 169: Disaster Report 4 Demo MICRO-SODE", "desc": "<p><a href=\"https://gamecritics.com/wp-content/uploads/2017/07/SVG-GC-Logo.jpg\"></a></p>\n<p>In a So Videogames first, Carlos & Brad turn in a \u201cmicro-sode\u201d \u2013 it\u2019s a super short episode focusing on just one game \u2013 Disaster Report 4\u2019s demo.</p>\n<p>Look for more of these in the near future!</p>\n<p align=\"center\"></p>\n<p style=\"text-align: center;\"><strong>Please send feedback and mailbag questions to SoVideogamesPODCAST (at) gmail (dot) com, or post them in the comments section below. Thanks!</strong></p>", "date": "2020-03-21", "url": "https://gamecritics.com/brad-gallaway/so-videogames-ep-169-disaster-report-4-demo-micro-sode/"}, {"title": "So\u2026 Videogames! Ep. 168", "desc": "<p><a href=\"https://gamecritics.com/wp-content/uploads/2017/07/SVG-GC-Logo.jpg\"></a></p>\n<p>After an extended hiatus, Carlos & Brad are back with a slightly off-script show.</p>\n<p>The first 10 minutes (or so) reflect on the state of life in the coronavirus pandemic, but they quickly shift into games chat after a segment of odds & ends. Titles covered:</p>\n<p>The Longing<br />\nHair Mower 3D<br />\nVertical Drop Heroes<br />\nIron Crypticle<br />\nRuiner<br />\nRift Keeper<br />\nEgo Protocol<br />\nMousecraft<br />\nTouryst<br />\nBroken Lines<br />\nBloodroots<br />\n\u2026And more!</p>\n<p align=\"center\"></p>\n<p style=\"text-align: center;\"><strong>Please send feedback and mailbag questions to SoVideogamesPODCAST (at) gmail (dot) com, or post them in the comments section below. Thanks!</strong></p>", "date": "2020-03-19", "url": "https://gamecritics.com/brad-gallaway/so-videogames-ep-168/"}, {"title": "So\u2026 Videogames! Ep. 167 \u2013 Pirates Vs. Vampires", "desc": "<p><a href=\"https://gamecritics.com/wp-content/uploads/2017/07/SVG-GC-Logo.jpg\"></a></p>\n<p>In this episode, Carlos and Brad discuss:</p>\n<p style=\"text-align: center;\">Catlandia<br />\nTempest<br />\nAlder\u2019s Blood (demo)<br />\nCode Vein<br />\nOne Punch Man: AHNK<br />\nAmerican Fugitive<br />\nImmortal Realms: Vampire Wars<br />\nFF7 Remake Demo</p>\n<p style=\"text-align: center;\">\u2026And more!</p>\n<p align=\"center\"></p>\n<p style=\"text-align: center;\"><strong>Please send feedback and mailbag questions to SoVideogamesPODCAST (at) gmail (dot) com, or post them in the comments section below. Thanks!</strong></p>", "date": "2020-03-04", "url": "https://gamecritics.com/brad-gallaway/so-videogames-ep-167/"}, {"title": "So\u2026 Videogames! Ep. 166", "desc": "<p><a href=\"https://gamecritics.com/wp-content/uploads/2017/07/SVG-GC-Logo.jpg\"></a></p>\n<p>In this episode, Brad and Carlos discuss:</p>\n<p>Democratic Socialism Simulator<br />\nBio Inc. Nemesis<br />\nSimulacra 2<br />\nSmash Tennis<br />\nMosaic<br />\nAzur Lane: Crosswave<br />\nBook of Demons<br />\nDarksiders: Genesis<br />\nWarhammer 40K: Inquisitor \u2013 Martyr<br />\nXenoblade Chronicles 2<br />\nSnack World</p>\n<p>\u2026 And more!</p>\n<p align=\"center\"></p>\n<p style=\"text-align: center;\"><strong>Please send feedback and mailbag questions to SoVideogamesPODCAST (at) gmail (dot) com, or post them in the comments section below. Thanks!</strong></p>", "date": "2020-02-27", "url": "https://gamecritics.com/brad-gallaway/so-videogames-ep-166/"}, {"title": "So\u2026 Videogames! Ep. 165", "desc": "<p><a href=\"https://gamecritics.com/wp-content/uploads/2017/07/SVG-GC-Logo.jpg\"></a></p>\n<p>In this episode, Carlos & Brad discuss:</p>\n<p style=\"text-align: center;\">Little Misfortune (PC)<br />\nWest of Dead (XBO)<br />\nBleeding Edge (XBO)<br />\nNot Tonight (Switch)<br />\nMonster Boy (Switch)<br />\nSnack World (Switch)</p>\n<p style=\"text-align: center;\">Listener responses to the question of the week</p>\n<p style=\"text-align: center;\">\u2026And more!</p>\n<p align=\"center\"></p>\n<p style=\"text-align: center;\"><strong>Please send feedback and mailbag questions to SoVideogamesPODCAST (at) gmail (dot) com, or post them in the comments section below. Thanks!</strong></p>", "date": "2020-02-17", "url": "https://gamecritics.com/brad-gallaway/so-videogames-ep-165/"}, {"title": "So\u2026 Videogames! Ep. 164 \u2013 Spooky Pancakes", "desc": "<p><a href=\"https://gamecritics.com/wp-content/uploads/2017/07/SVG-GC-Logo.jpg\"></a></p>\n<p>In this episode, Brad and Carlos discuss:</p>\n<p style=\"text-align: center;\">Bookbound Brigade<br />\nConcrete Genie<br />\nSkater XL<br />\nCoffee Talk<br />\nKentucky Route Zero<br />\nArc of Alchemist<br />\nKnights & Bikes<br />\nSuper Tennis<br />\nLeximan<br />\nSentient<br />\nAlpha Beta Gamer<br />\nDimension 404<br />\nThe outsider</p>\n<p>And the question of the week is: If you could create any kind of game that doesn\u2019t already exist, what would it be?</p>\n<p align=\"center\"></p>\n<p style=\"text-align: center;\"><strong>Please send feedback and mailbag questions to SoVideogamesPODCAST (at) gmail (dot) com, or post them in the comments section below. Thanks!</strong></p>", "date": "2020-02-12", "url": "https://gamecritics.com/brad-gallaway/so-videogames-ep-164-spooky-pancakes/"}, {"title": "So\u2026 Videogames! Ep. 163", "desc": "<p><a href=\"https://gamecritics.com/wp-content/uploads/2017/07/SVG-GC-Logo.jpg\"></a></p>\n<p>In this episode, Carlos and Brad discuss:</p>\n<p style=\"text-align: center;\">Deity Driving<br />\nCoffee Talk<br />\nKentucky Route Zero<br />\nSea Salt<br />\nWarlocks 2<br />\nPeace, Death!<br />\n7th Sector<br />\nSuper Tennis<br />\nVermintide 2<br />\nJourney to the Savage Planet<br />\nBard\u2019s Tale 4<br />\n\u2026And more!</p>\n<p align=\"center\"></p>\n<p style=\"text-align: center;\"><strong>Please send feedback and mailbag questions to SoVideogamesPODCAST (at) gmail (dot) com, or post them in the comments section below. Thanks!</strong></p>", "date": "2020-02-04", "url": "https://gamecritics.com/brad-gallaway/so-videogames-ep-163/"}, {"title": "So\u2026 Videogames! Ep. 162", "desc": "<p><a href=\"https://gamecritics.com/wp-content/uploads/2017/07/SVG-GC-Logo.jpg\"></a></p>\n<p>Episode 162! This week, Caros and Brad discuss:</p>\n<p>Ghone is Gone<br />\nFrostpunk<br />\nBaba is You<br />\nMeteorfall: Krumit\u2019s Tale<br />\nJDM Racing<br />\nSuper Crush KO<br />\nEarthnight<br />\nHardcore Mecha<br />\nWarlocks 2: God Slayers<br />\nDrawngeon<br />\nCode Vein<br />\nTony Hawk 5<br />\nDraw Chilly</p>\n<p align=\"center\"></p>\n<p style=\"text-align: center;\"><strong>Please send feedback and mailbag questions to SoVideogamesPODCAST (at) gmail (dot) com, or post them in the comments section below. Thanks!</strong></p>", "date": "2020-01-27", "url": "https://gamecritics.com/brad-gallaway/so-videogames-ep-162/"}, {"title": "So\u2026 Videogames! Ep. 161", "desc": "<p><a href=\"https://gamecritics.com/wp-content/uploads/2017/07/SVG-GC-Logo.jpg\"></a></p>\n<p>In this episode, Carlos and Brad deliver the promised Games of the Decade show. They may not the \u201cMost Important\u201d or \u201cInfluential\u201d titles, but they each pick a ton of things released between 2010-2019 and discuss.</p>\n<p>Also, they read listener responses to the question What Games Got You Through The Holidays?</p>\n<p>And finally, a special guest appears in a clip at the end to discuss Kerbal Space Program: Breaking Ground.</p>\n<p align=\"center\"></p>\n<p style=\"text-align: center;\"><strong>Please send feedback and mailbag questions to SoVideogamesPODCAST (at) gmail (dot) com, or post them in the comments section below. Thanks!</strong></p>", "date": "2020-01-13", "url": "https://gamecritics.com/brad-gallaway/so-videogames-ep-161/"}, {"title": "So\u2026 Videogames! Ep. 160", "desc": "<p><a href=\"https://gamecritics.com/wp-content/uploads/2017/07/SVG-GC-Logo.jpg\"></a></p>\n<p>Brad and Carlos are back to the regular format after Episode 159\u2019s GOTY wrapup. In this episode they cover:</p>\n<p style=\"text-align: center;\">Ember<br />\nSpace Pioneer<br />\nSmashup<br />\nRage 2 (wrapup)<br />\nMetal Gear Solid V (wrapup)<br />\nNi no Kuni 2<br />\nFrostpunk</p>\n<p align=\"center\"></p>\n<p style=\"text-align: center;\"><strong>Please send feedback and mailbag questions to SoVideogamesPODCAST (at) gmail (dot) com, or post them in the comments section below. Thanks!</strong></p>", "date": "2020-01-06", "url": "https://gamecritics.com/brad-gallaway/so-videogames-ep-160/"}, {"title": "So\u2026 Videogames! Ep. 159: GOTY", "desc": "<p><a href=\"https://gamecritics.com/wp-content/uploads/2017/07/SVG-GC-Logo.jpg\"></a></p>\n<p>It\u2019s that time again! So Videogames does its annual Game of the Year show! Carlos and Brad count down their individual Top 10s along with Honorable Mentions, their 2019 Disappointments, and picks from YOU, our listeners!</p>\n\n<p style=\"text-align: center;\"><strong>Please send feedback and mailbag questions to SoVideogamesPODCAST (at) gmail (dot) com, or post them in the comments section below. Thanks!</strong></p>", "date": "2019-12-30", "url": "https://gamecritics.com/brad-gallaway/so-videogames-ep-159-goty/"}, {"title": "So\u2026 Videogames! Ep. 158", "desc": "<p><a href=\"https://gamecritics.com/wp-content/uploads/2017/07/SVG-GC-Logo.jpg\"></a></p>\n<p>In this episode, Carlos & Brad discuss\u2026 NOT THE USUAL STUFF! It\u2019s a bit of a catch-up episode since they got knocked off their recording schedule, so this is the breather week that gets them back on track. It\u2019s a short show but they do go into the Videogame Awards and spend some time getting to know Carlos a little better!</p>\n<p align=\"center\"></p>\n<p style=\"text-align: center;\"><strong>Please send feedback and mailbag questions to SoVideogamesPODCAST (at) gmail (dot) com, or post them in the comments section below. Thanks!</strong></p>", "date": "2019-12-17", "url": "https://gamecritics.com/brad-gallaway/so-videogames-ep-158/"}, {"title": "So\u2026 Videogames! Ep. 157", "desc": "<p><a href=\"https://gamecritics.com/wp-content/uploads/2017/07/SVG-GC-Logo.jpg\"></a></p>\n<p>In Episode 157, Brad and Carlos discuss\u2026</p>\n<p>Idle World: Endless RPG<br />\nBleak Sword<br />\nArise: A Simple Story<br />\nRitual: Crown of Horns<br />\nMetal Gear Solid V: the Phantom Pain<br />\nWarp Through</p>\n<p>\u2026And they want YOUR picks for best of 2019, worst of 2019, best of the decade, and most-wanteds for 2020!! Email us or tweet us and we\u2019ll read your nominations and give you a shout-out on the show!</p>\n<p align=\"center\"></p>\n<p style=\"text-align: center;\"><strong>Please send feedback and mailbag questions to SoVideogamesPODCAST (at) gmail (dot) com, or post them in the comments section below. Thanks!</strong></p>", "date": "2019-12-12", "url": "https://gamecritics.com/brad-gallaway/so-videogames-ep-157/"}, {"title": "So\u2026 Videogames! Ep. 156", "desc": "<p><a href=\"https://gamecritics.com/wp-content/uploads/2017/07/SVG-GC-Logo.jpg\"></a></p>\n<p>In this episode, Carlos and Brad discuss:</p>\n<p style=\"text-align: center;\">Village Monsters<br />\nChildren of Morta<br />\nBlack Future \u201988<br />\nStar Wars Jedi: Fallen Order<br />\nDeath Stranding<br />\nStill There<br />\nLost Ember<br />\nThe Stillness of the Wind<br />\nWargroove<br />\nand a little housekeeping/Q&A!</p>\n<p align=\"center\"></p>\n<p style=\"text-align: center;\"><strong>Please send feedback and mailbag questions to SoVideogamesPODCAST (at) gmail (dot) com, or post them in the comments section below. Thanks!</strong></p>", "date": "2019-12-04", "url": "https://gamecritics.com/brad-gallaway/so-videogames-ep-156/"}, {"title": "So\u2026 Videogames! Ep. 155", "desc": "<p><a href=\"https://gamecritics.com/wp-content/uploads/2017/07/SVG-GC-Logo.jpg\"></a></p>\n<p>In Episode 155, Carlos and Brad cover:</p>\n<p style=\"text-align: center;\">Legend of Keepers<br />\nDeath Stranding (check-in)<br />\nStar Wars Jedi: Fallen Order<br />\nMars Power Industries<br />\nToast Time: Smash Up<br />\nThief of Thieves<br />\nThis is My Land<br />\nThe Guise</p>\n<p align=\"center\"></p>\n<p style=\"text-align: center;\"><strong>Please send feedback and mailbag questions to SoVideogamesPODCAST (at) gmail (dot) com, or post them in the comments section below. Thanks!</strong></p>", "date": "2019-11-25", "url": "https://gamecritics.com/brad-gallaway/so-videogames-ep-155/"}, {"title": "So\u2026 Videogames! Ep. 154", "desc": "<p><a href=\"https://gamecritics.com/wp-content/uploads/2017/07/SVG-GC-Logo.jpg\"></a></p>\n<p style=\"text-align: center;\">In this episode Carlos and Brad discuss:</p>\n<p style=\"text-align: center;\">\nDeath Stranding (in-depth, no spoilers)<br />\nGarden Story<br />\nDoor Kickers: Action Squad<br />\nReventure (a check-in)<br />\nand Carlos closes with Games Coming Up!</p>\n<p align=\"center\"></p>\n<p style=\"text-align: center;\"><strong>Please send feedback and mailbag questions to SoVideogamesPODCAST (at) gmail (dot) com, or post them in the comments section below. Thanks!</strong></p>", "date": "2019-11-19", "url": "https://gamecritics.com/brad-gallaway/gamecritics-radio-so-videogames-ep-154/"}, {"title": "GameCritics Radio: So\u2026 Videogames! Ep. 153", "desc": "<p><a href=\"https://gamecritics.com/wp-content/uploads/2017/07/SVG-GC-Logo.jpg\"></a></p>\n<p>In this episode, Brad and Carlos announce the return of weekly episodes and banter before tackling a mountain of games. Topics include:</p>\n<p style=\"text-align: center;\">-NGU Idle<br />\n-Raging Loop<br />\n-Afterparty<br />\n-Reventure<br />\n-Cat Interstellar<br />\n-Mistover<br />\n-Cat Quest 2<br />\n-Beholder 2<br />\n-Sea Salt<br />\n-The Outer Worlds<br />\n-Citadel: Forged With Fire</p>\n<p align=\"center\"></p>\n<p style=\"text-align: center;\"><strong>Please send feedback and mailbag questions to SoVideogamesPODCAST (at) gmail (dot) com, or post them in the comments section below. Thanks!</strong></p>", "date": "2019-11-11", "url": "https://gamecritics.com/brad-gallaway/gamecritics-radio-so-videogames-ep-153/"}, {"title": "GameCritics Radio: So\u2026 Videogames! Ep. 152", "desc": "<p><a href=\"https://gamecritics.com/wp-content/uploads/2017/07/SVG-GC-Logo.jpg\"></a></p>\n<p>In Episode 152 Carlos and Brad discuss Session (Early Access), Helldivers (new content), Dark Devotion, Trover Saves the Universe (DLC), What the Golf?, Lonely Mountains Downhill, Fortnite Chapter 2, Felix the Reaper, Outer Worlds, Into the Dead 2, and Valfaris.</p>\n<p>If you\u2019d like to see the fails reel that Carlos mentions during the Lonely Mountains Downhill segment, you can find it <a href=\"https://imgur.com/t/gaming/AKpd9Gg\">here</a>.</p>\n<p align=\"center\"></p>\n<p style=\"text-align: center;\"><strong>Please send feedback and mailbag questions to SoVideogamesPODCAST (at) gmail (dot) com, or post them in the comments section below. Thanks!</strong></p>", "date": "2019-10-27", "url": "https://gamecritics.com/brad-gallaway/gamecritics-radio-so-videogames-ep-152/"}, {"title": "GameCritics Radio: So\u2026 Videogames! Ep. 151", "desc": "<p><a href=\"https://gamecritics.com/wp-content/uploads/2017/07/SVG-GC-Logo.jpg\"></a></p>\n<p>Welcome to episode 151, the first episode starring new So Videogames co-host Carlos Rodela.</p>\n<p>This is where we usually have show notes and info, but things are a little fast and loose this week, so please bear with us while Brad learns the podcast uploading ropes.</p>\n<p>The guys cover about six different games so there\u2019s <em>plenty</em> of content here, but specific show notes and timestamps will come next episode! Thanks for your patience!</p>\n<p>In the meantime, heeeeeeeeeere\u2019s Carlos! (And Brad!) Enjoy the show and we\u2019ll be back on track with Episode 152!</p>\n<p style=\"text-align: center;\"><strong>ALSO! Peace, love and hugs to Corey, who is dearly missed (don\u2019t worry, he\u2019s fine, he\u2019s just not on the show.) </strong><strong>This episode is dedicated to him! </strong></p>\n<p align=\"center\"></p>\n<p style=\"text-align: center;\"><strong>Please send feedback and mailbag questions to SoVideogamesPODCAST (at) gmail (dot) com, or post them in the comments section below. Thanks!</strong></p>", "date": "2019-10-15", "url": "https://gamecritics.com/brad-gallaway/gamecritics-radio-so-videogames-ep-151/"}, {"title": "GameCritics Radio: So\u2026 Videogames! Ep. 150", "desc": "<p><a href=\"https://gamecritics.com/wp-content/uploads/2017/07/SVG-GC-Logo.jpg\"></a></p>\n<p>To celebrate 150 episodes in the books, Brad and Corey take some time to reflect on how the show was born and discuss some major new changes for the show going forward.</p>\n<p>This episode is all housekeeping with no games or banter chat. We know that\u2019s kind of a bummer but if you want to keep up with future plans for the show, this is not one to miss!</p>\n<p style=\"text-align: center;\"><3 Brad and Corey</p>\n<p align=\"center\"></p>\n<p style=\"text-align: center;\"><strong>Please send feedback and mailbag questions to SoVideogamesPODCAST (at) gmail (dot) com, or post them in the comments section below. Thanks!</strong></p>", "date": "2019-10-07", "url": "https://gamecritics.com/brad-gallaway/gamecritics-radio-so-videogames-ep-150/"}, {"title": "GameCritics Radio: So\u2026 Videogames! Ep. 149", "desc": "<p><a href=\"https://gamecritics.com/wp-content/uploads/2017/07/SVG-GC-Logo.jpg\"></a></p>\n<p style=\"text-align: center;\"><strong>SPOILER ALERT! </strong></p>\n<p>Brad and Corey deep-dive on <em>Hitman 2</em>\u2018s newest DLC level from 00:45:08 \u2013 01:32:25 and discuss all the ins and outs of how they finish it. If you don\u2019t want to be spoiled on the new Haven level, please skip that segment.</p>\n<p style=\"text-align: center;\"><strong>SPOILER ALERT!</strong></p>\n<p>Episode 149 is a Brad-heavy one. He\u2019s picking up the slack for Corey, but Corey does a deep-dive on <em>Hitman 2</em>\u2018s newest DLC level. Brad has a load of quick-hits and some not-so-quick hits in the show this week.</p>\n<p>The boys also discuss the new movie <em>Hustlers</em>, Brad\u2019s inability to hang with roller coasters, getting caught up with dumb tasks at work and more.</p>\n<p style=\"text-align: center;\"><strong>Timestamps:</strong><br />\nSayonara Wild Hearts: 00:02:24<br />\nOverland: 00:08:13<br />\nScheming Through the Zombie Apocalypse: 00:13:19<br />\nMutazione: 00:22:33<br />\nGreedfall: 00:34:47<br />\nHitman 2: Haven DLC: 00:45:08 \u2013 01:32:25<br />\nClosing: 01:34:30<br />\nBanter: 01:36:30</p>\n<p align=\"center\"></p>\n<p style=\"text-align: center;\"><strong>Please send feedback and mailbag questions to SoVideogamesPODCAST (at) gmail (dot) com, or post them in the comments section below. Thanks!</strong></p>", "date": "2019-09-30", "url": "https://gamecritics.com/brad-gallaway/gamecritics-radio-so-videogames-ep-149/"}, {"title": "GameCritics Radio: So\u2026 Videogames! Ep. 148", "desc": "<p><a href=\"https://gamecritics.com/wp-content/uploads/2017/07/SVG-GC-Logo.jpg\"></a></p>\n<p style=\"text-align: center;\"><strong>SPOILER WARNING!!!</strong></p>\n<p>The entire games portion of Episode 148 is a spoilercast for all things <em>Control</em>. Brad and Corey dish on the story, the guns, the gameplay, the ending, their hopes for the DLC and more!</p>\n<p>If you don\u2019t want to be spoiled about <em>Control</em>, please stay far far away from this episode.</p>\n<p style=\"text-align: center;\"><strong>SPOILER WARNING!!!</strong></p>\n<p>However, if you want to hear some good \u2018ol banter, the second half of the show is chock-full of Brad and Corey shooting the shit about movies, parkour, spiders (!?!), Corey giving more marijuana experiences and much more.</p>\n<p style=\"text-align: center;\"><strong>Timestamps:</strong><br />\nCONTROL: 00:00:00<br />\nBanter: 01:26:00</p>\n<p align=\"center\"></p>\n<p style=\"text-align: center;\"><strong>Please send feedback and mailbag questions to SoVideogamesPODCAST (at) gmail (dot) com, or post them in the comments section below. Thanks!</strong></p>", "date": "2019-09-24", "url": "https://gamecritics.com/brad-gallaway/gamecritics-radio-so-videogames-ep-148/"}, {"title": "GameCritics Radio: So\u2026 Videogames! Ep. 147", "desc": "<p><a href=\"https://gamecritics.com/wp-content/uploads/2017/07/SVG-GC-Logo.jpg\"></a></p>\n<p>Brad and Corey are back with another regular show \u2014 games chat in the front and banter in the back.</p>\n<p>In this episode, the boys cover some Nintendo Direct news then move onto games. Also, Corey breaks the number one rule of banter by discussing a games during that segment, and Brad injured himself with a \u2026 tortilla chip?</p>\n<p style=\"text-align: center;\"><strong>Timestamps:</strong><br />\nNintendo Direct: 00:02:22<br />\nELEA: 00:22:00<br />\nRisk of Rain 2: 00:34:36<br />\nRage 2: 00:44:04<br />\nControl Update: 00:58:48<br />\nThe Dark Pictures: Man of Medan: 01:00:23<br />\nClosing: 01:13:30<br />\nBanter: 01:15:30</p>\n<p align=\"center\"></p>\n<p style=\"text-align: center;\"><strong>Please send feedback and mailbag questions to SoVideogamesPODCAST (at) gmail (dot) com, or post them in the comments section below. Thanks!</strong></p>", "date": "2019-09-14", "url": "https://gamecritics.com/brad-gallaway/gamecritics-radio-so-videogames-ep-147/"}, {"title": "GameCritics Radio: So\u2026 Videogames! Ep. 146", "desc": "<p><a href=\"https://gamecritics.com/wp-content/uploads/2017/07/SVG-GC-Logo.jpg\"></a></p>\n<p>Brad and Corey are back with another regular format show. That\u2019s right! Banter is back at the end!!</p>\n<p>Even better? Corey and Brad have both played Remedy\u2019s newest, hottest game \u2014 CONTROL. Is it Remedy\u2019s best? Is it their worst?</p>\n<p>We have a lot to say, so listen in and find out.</p>\n<p style=\"text-align: center;\"><strong>Timestamps:</strong><br />\nBird Game+: 00:04:49<br />\nAstral Chain: 00:08:09<br />\nTorchlight 2 (Switch): 00:13:08<br />\nELEX: 00:18:50<br />\nELEA: 00:23:01<br />\nSkelly Selest: 00:34:53<br />\nControl: 00:45:35<br />\nClosing: 01:28:05<br />\nBanter: 01:30:10</p>\n<p align=\"center\"></p>\n<p style=\"text-align: center;\"><strong>Please send feedback and mailbag questions to SoVideogamesPODCAST (at) gmail (dot) com, or post them in the comments section below. Thanks!</strong></p>", "date": "2019-09-05", "url": "https://gamecritics.com/brad-gallaway/gamecritics-radio-so-videogames-ep-146/"}, {"title": "GameCritics Radio: So\u2026 Videogames! Ep. 145", "desc": "<p><a href=\"https://gamecritics.com/wp-content/uploads/2017/07/SVG-GC-Logo.jpg\"></a></p>\n<p>Full Disclosure: Brad and Corey tried a new chat program this week for recording, so the audio levels are a little unstable. We apologize in advance if you have to fiddle with your volume. We\u2019ll do better next time.</p>\n<p>This week we discuss a gamut of titles and have a special guest on for a deep-dive discussion. Not only do we chat about games, but one game (<em>The Game: The Game</em>, in fact) transcends our usual chat and examines what it\u2019s like to be a woman in American society \u2014 specifically about being preyed upon by pick-up artists and how to prepare for daily life in the patriarchy.</p>\n<p>We also forgo banter for a short Q&A segment at the end of the show.</p>\n<p style=\"text-align: center;\"><strong>Timestamps:</strong><br />\nCreature in the Well Preview: 00:05:38<br />\nPlunge: 00:15:05<br />\nDevil May Cry V: 00:24:00<br />\nForager: 00:43:00<br />\nThe Game: The Game: 00:58:34<br />\nQ&A: 01:49:49<br />\nClosing: 02:06:43</p>\n<p align=\"center\"></p>\n<p style=\"text-align: center;\"><strong>Please send feedback and mailbag questions to SoVideogamesPODCAST (at) gmail (dot) com, or post them in the comments section below. Thanks!</strong></p>", "date": "2019-09-02", "url": "https://gamecritics.com/brad-gallaway/gamecritics-radio-so-videogames-ep-145/"}, {"title": "GameCritics Radio: So\u2026 Videogames! Ep. 144", "desc": "<p><a href=\"https://gamecritics.com/wp-content/uploads/2017/07/SVG-GC-Logo.jpg\"></a></p>\n<p>Brad and Corey are back in the swing of things with a regular format show this week \u2014 plenty of games chat up front with a lot of banter on the backend.</p>\n<p>Also, here\u2019s a fun fact: We had the most audio issues we\u2019ve ever encountered while recording this episode. Can you tell? (If it sounds like trash, let us know.)</p>\n<p style=\"text-align: center;\"><strong>Timestamps:</strong><br />\nBlack Paradox: 00:02:18<br />\nApe Out Demo 00:10:56<br />\nElex: 00:21:48<br />\nRefunct: 00:41:19<br />\nClosing: 00:54:13<br />\nBanter: 00:56:20</p>\n<p align=\"center\"></p>\n<p style=\"text-align: center;\"><strong>Please send feedback and mailbag questions to SoVideogamesPODCAST (at) gmail (dot) com, or post them in the comments section below. Thanks!</strong></p>", "date": "2019-08-22", "url": "https://gamecritics.com/brad-gallaway/gamecritics-radio-so-videogames-ep-144/"}, {"title": "GameCritics Radio: So\u2026 Videogames! Ep. 143", "desc": "<p><a href=\"https://gamecritics.com/wp-content/uploads/2017/07/SVG-GC-Logo.jpg\"></a></p>\n<p>Brad and Corey are back with a show packed full of so much games discussion, they didn\u2019t have time for banter at the end.</p>\n<p>An unplanned trend has us chatting about old PC games being revived on current consoles, VR makes its return to the show, and much more.</p>\n<p style=\"text-align: center;\"><strong>Timestamps:</strong></p>\n<p style=\"text-align: center;\">Shattered Lights: 00:06:45</p>\n<p style=\"text-align: center;\">Refunct: 00:23:30</p>\n<p style=\"text-align: center;\">Prey: TranStar VR: 00:37:44</p>\n<p style=\"text-align: center;\">Solo: Islands of the Heart: 00:50:52</p>\n<p style=\"text-align: center;\">Gravity Ghost: 01:00:18</p>\n<p style=\"text-align: center;\">Sagebrush: 01:09:44</p>\n<p style=\"text-align: center;\">Metal Wolf Chaos XD: 01:29:52</p>\n<p style=\"text-align: center;\">Closing: 01:43:00</p>\n<p align=\"center\"></p>\n<p style=\"text-align: center;\"><strong>Please send feedback and mailbag questions to SoVideogamesPODCAST (at) gmail (dot) com, or post them in the comments section below. Thanks!</strong></p>", "date": "2019-08-15", "url": "https://gamecritics.com/brad-gallaway/gamecritics-radio-so-videogames-ep-143/"}, {"title": "GameCritics Radio: So\u2026 Videogames! Ep. 142", "desc": "<p><a href=\"https://gamecritics.com/wp-content/uploads/2017/07/SVG-GC-Logo.jpg\"></a></p>\n<p>Brad and Corey are back with a vengeance this week, bringing six games (plus some extras) and plenty of banter.</p>\n<p>Corey might or might not be playing <strong><em>Prey</em></strong> again and Brad has some contractually-obligated games to chat about, too.</p>\n<p>Beyond that, Corey gives a final update on his car flooding saga, Brad\u2019s been watching plenty of horror movies, Corey witnessed genuine <em>Spider-Man</em> trauma and Brad is diving headfirst into\u2026 farming?</p>\n<p style=\"text-align: center;\"><strong>Timestamps:</strong><br />\n39 Days to Mars: 00:03:08<br />\nMarvel Ultimate Alliance 3: 00:12:12<br />\nDOOM 3 (Switch): 00:19:19<br />\nWorld War Z: 00:33:34<br />\nHitman: Siberia Sniper DLC: 00:45:26<br />\nFission Superstar X: 00:53:20<br />\nClosing: 01:02:40<br />\nBanter: 01:04:55</p>\n<p align=\"center\"></p>\n<p style=\"text-align: center;\"><strong>Please send feedback and mailbag questions to SoVideogamesPODCAST (at) gmail (dot) com, or post them in the comments section below. Thanks!</strong></p>", "date": "2019-08-06", "url": "https://gamecritics.com/brad-gallaway/gamecritics-radio-so-videogames-ep-142/"}, {"title": "GameCritics Radio: So\u2026 Videogames! Ep. 141", "desc": "<p><a href=\"https://gamecritics.com/wp-content/uploads/2017/07/SVG-GC-Logo.jpg\"></a></p>\n<p><strong>SPOILER ALERT:</strong> Brad and Corey deep dive on <strong>SOMA</strong> and slightly dive on <strong>The Talos Principle</strong> during this episode. We give an audio warning before this segment and it starts at 00:42:00 to 01:00:01. Please avoid this section if you\u2019re sensitive to spoilers about these games.</p>\n<p>Otherwise, Brad and Corey are unfortunately short on time this week, so it\u2019s truly all-killer-no-filler with a banterless show. Despite the one-hour time limit, they still discuss five games and even have a deep-dive spoiler section.</p>\n<p>Sorry in advance for the short show, but we don\u2019t think you\u2019ll be disappointed. <3</p>\n<p style=\"text-align: center;\"><strong>Timestamps:</strong><br />\nMy Friend Pedro: 00:03:57<br />\n198X: 00:14:32<br />\nMetro: Exodus: 00:29:04<br />\nSOMA: 00:40:00<br />\n<strong>SOMA SPOILERS</strong>: 00:42:00<br />\nThe Talos Principle: 00:56:01<br />\nClosing: 01:00:01</p>\n<p align=\"center\"></p>\n<p style=\"text-align: center;\"><strong>Please send feedback and mailbag questions to SoVideogamesPODCAST (at) gmail (dot) com, or post them in the comments section below. Thanks!</strong></p>", "date": "2019-08-02", "url": "https://gamecritics.com/brad-gallaway/gamecritics-radio-so-videogames-ep-141/"}, {"title": "GameCritics Radio: So\u2026 Videogames! Ep. 140", "desc": "<p><a href=\"https://gamecritics.com/wp-content/uploads/2017/07/SVG-GC-Logo.jpg\"></a></p>\n<p>SPOILER ALERT: Corey talks in-depth about System Shock 2 in this episode and might include some spoilers to those who haven\u2019t played it. We give two warnings on the show and discuss it from 00:41:45 \u2013 00:59:55. Please avoid this section if you don\u2019t want to be spoiled.</p>\n<p>Otherwise, Brad and Corey are back and are keeping part of their slogan alive by discussing mostly old games this week. They also have a mini-Q&A before signing off for banter. Corey gives updates on his flooded car situation, Brad eats Japanese potatoes and we both discuss jackfruit and vegetarianism.</p>\n<p style=\"text-align: center;\"><strong>Timestamps:</strong><br />\nEtherborn 00:02:51<br />\nWatch Dogs: 00:16:52<br />\nThe World Next Door: 00:30:20<br />\nSystem Shock 2 SPOILERS: 00:41:45 \u2013 00:59:55<br />\nHousekeeping and Q&A: 01:00:08<br />\nClosing: 01:20:29<br />\nBanter: 01:23:00</p>\n<p align=\"center\"></p>\n<p style=\"text-align: center;\"><strong>Please send feedback and mailbag questions to SoVideogamesPODCAST (at) gmail (dot) com, or post them in the comments section below. Thanks!</strong></p>", "date": "2019-07-24", "url": "https://gamecritics.com/brad-gallaway/gamecritics-radio-so-videogames-ep-140/"}, {"title": "GameCritics Radio: So\u2026 Videogames! Ep. 138", "desc": "<p><a href=\"https://gamecritics.com/wp-content/uploads/2017/07/SVG-GC-Logo.jpg\"></a></p>\n<p><strong>SPOILER ALERT:</strong> Brad and Corey discuss all aspects of Hitman 2\u2019s new DLC Bank level (The Golden Handshake) in this episode, including the ins and outs of the stage and how they both completed it. If you don\u2019t want to be spoiled on the level, please avoid 00:43:22 \u2013 01:06:50.</p>\n<p>Otherwise\u2026</p>\n<p>Brad brings a game preview and one title he expects to be playing the rest of the year while Corey has some silly side-scrolling shooting on his hands before they both deep dive on Hitman\u2019s new DLC. They also discuss Corey\u2019s vacation to San Francisco, Brad going to Pride in Seattle, Luc Besson\u2019s new movie Anna and Spider-Man: Far From Home.</p>\n<p style=\"text-align: center;\"><strong>Timestamps:</strong><br />\nScavengers (Preview): 00:03:45<br />\nMy Friend Pedro: 00:18:36<br />\nGraveyard Keeper: 00:29:29<br />\nHitman 2 DLC (SPOILERS): 00:43:22<br />\nClosing:01:06:50<br />\nBanter: 01:08:50</p>\n<p align=\"center\"></p>\n<p style=\"text-align: center;\"><strong>Please send feedback and mailbag questions to SoVideogamesPODCAST (at) gmail (dot) com, or post them in the comments section below. Thanks!</strong></p>", "date": "2019-07-08", "url": "https://gamecritics.com/brad-gallaway/gamecritics-radio-so-videogames-ep-138/"}, {"title": "GameCritics Radio: So\u2026 Videogames! Ep. 137", "desc": "<p><a href=\"https://gamecritics.com/wp-content/uploads/2017/07/SVG-GC-Logo.jpg\"></a></p>\n<p>Despite a handful of wonky audio issues during recording, Brad and Corey are back in the groove with a normal games-first, banter-last format show.</p>\n<p>Brad has been testing the waters of Xbox\u2019s Game Pass and Corey\u2019s spending some time in open-world Oregon with zombies, among other things.</p>\n<p>Brad also chats about scary movies he\u2019s watched with his son and Microsoft\u2019s tasty catered food while Corey gives updates on his business trip from a few weeks ago and his upcoming trip to San Francisco.</p>\n<p style=\"text-align: center;\"><strong>Timestamps:</strong><br />\nHousekeeping: 00:03:35<br />\nHitman 2\u2019s New Mission: 00:05:13<br />\nResident Evil 4 (Switch): 00:10:32<br />\nXbox Game Pass: 00:29:22<br />\nVoid Bastards: 00:33:14<br />\nOuter Wilds: 00:35:28<br />\nWesterado: Double Barreled 00:39:21<br />\nOperencia: The Stolen Sun: 00:42:17<br />\nClustertruck: 00:43:58<br />\nDays Gone: 00:46:39<br />\nObservation: 01:01:34<br />\nThe Sinking City: 01:07:13<br />\nClosing: 01:14:50<br />\nBanter: 01:17:00</p>\n<p align=\"center\"></p>\n<p style=\"text-align: center;\"><strong>Please send feedback and mailbag questions to SoVideogamesPODCAST (at) gmail (dot) com, or post them in the comments section below. Thanks!</strong></p>", "date": "2019-06-27", "url": "https://gamecritics.com/brad-gallaway/gamecritics-radio-so-videogames-ep-137/"}, {"title": "GameCritics Radio: So\u2026 Videogames! Ep. 136 \u2013 The E3 Roundup", "desc": "<p><a href=\"https://gamecritics.com/wp-content/uploads/2017/07/SVG-GC-Logo.jpg\"></a></p>\n<p>It\u2019s that time of the year again, or at least it was! The annual Electronic Entertainment Expo came and went, and Brad and Corey are here to deliver their thoughts on games shown at the conferences! We\u2019re a couple weeks late on coverage due to Corey\u2019s recent business trip, but it\u2019s coverage nonetheless.</p>\n<p>Due to the sheer number of games we discuss, we\u2019re not posting timestamps this week. Please forgive us! Also there\u2019s no banter this week \u2014 it\u2019s all E3 chat. <strong>Enjoy!</strong></p>\n<p align=\"center\"></p>\n<p style=\"text-align: center;\"><strong>Please send feedback and mailbag questions to SoVideogamesPODCAST (at) gmail (dot) com, or post them in the comments section below. Thanks!</strong></p>", "date": "2019-06-25", "url": "https://gamecritics.com/brad-gallaway/gamecritics-radio-so-videogames-ep-135-the-e3-roundup/"}, {"title": "GameCritics Radio: So\u2026 Videogames! Ep. 135", "desc": "<p><a href=\"https://gamecritics.com/wp-content/uploads/2017/07/SVG-GC-Logo.jpg\"></a></p>\n<p>Episode 135 is up, and it\u2019s an odd one \u2013 we recorded this ep last week because Corey\u2019s on vacay and we didn\u2019t want to leave our listeners hanging without a show!</p>\n<p>Instead of the usual format, this is a banter-heavy chat, although there is some games discussion.</p>\n<p>Also, please accept our apologies but there are no timestamps this week. We\u2019ll be back to our normal schedule next time! Thanks for listening!</p>\n<p align=\"center\"></p>\n<p style=\"text-align: center;\"><strong>Please send feedback and mailbag questions to SoVideogamesPODCAST (at) gmail (dot) com, or post them in the comments section below. Thanks!</strong></p>", "date": "2019-06-14", "url": "https://gamecritics.com/brad-gallaway/gamecritics-radio-so-videogames-ep-135/"}, {"title": "GameCritics Radio: So\u2026 Videogames! Ep. 132", "desc": "<p><a href=\"https://gamecritics.com/wp-content/uploads/2017/07/SVG-GC-Logo.jpg\"></a></p>\n<p><strong>SPOILER ALERT:</strong> In this episode Corey talks about <strong><em>Far Cry: New Dawn</em></strong> and spoils some story elements of the game. We give a long audio spoiler warning on the show, but if you don\u2019t want some of<em> New Dawn</em> spoiled for you, please do not listen to the segment running from 00:33:04 \u2013 00:58:39.</p>\n<p>Otherwise, Brad and Corey are back to being each other\u2019s 50 percent of the show for a regular dose of games chat and banter this week. They\u2019ve got two titles apiece, then some banter including Corey talking about garbage disposals, Brad catching us up on TV shows, complimenting your idols on Twitter and much more.</p>\n<p style=\"text-align: center;\"><strong>Timestamps:</strong><br />\nHousekeeping: 00:01:00<br />\nCastle of Heart: 00:10:44<br />\nOvercooked: 00:21:25<br />\nFar Cry: New Dawn SPOILERS: 00:33:04 \u2013 00:58:39<br />\nA Plague Tale: Innocence: 00:58:39<br />\nClosing: 01:22:16<br />\nBanter: 01:24:10</p>\n<p align=\"center\"></p>\n<p style=\"text-align: center;\"><strong>Please send feedback and mailbag questions to SoVideogamesPODCAST (at) gmail (dot) com, or post them in the comments section below. Thanks!</strong></p>", "date": "2019-05-24", "url": "https://gamecritics.com/brad-gallaway/gamecritics-radio-so-videogames-ep-132/"}, {"title": "GameCritics Radio: So\u2026 Videogames! Ep. 131", "desc": "<p><a href=\"https://gamecritics.com/wp-content/uploads/2017/07/SVG-GC-Logo.jpg\"></a></p>\n<p>Episode 131 is a 3-hour extravaganza packed with plenty of games and banter, but also a rarity for Brad and Corey \u2014 an interview!</p>\n<p>Author Doug Walsh chats about his new book \u201c<a href=\"https://smile.amazon.com/Walkthrough-Insider-Tales-Strategy-Guides/dp/1732746761/ref=sr_1_fkmrnull_1?keywords=the+walkthrough+doug+walsh&qid=1558468408&s=gateway&sr=8-1-fkmrnull\">The Walkthrough: Insider Tales from a Life in Strategy Guides</a>\u201c. Doug has been a prolific strategy guide writer for decades, and he shares anecdotes about his life, how he got into the industry and some reflections on it during this episode.</p>\n<p>Brad and Corey also discuss <em>all</em> the latest games they\u2019ve been playing, Brad talks about recent movies he\u2019s seen, and his son\u2019s fascination with cassette tapes. Corey talks about his recent trip to Houston for ComicPalooza and lets loose a <strong>truly epic rant</strong> about a makeup line aimed at men.</p>\n<p style=\"text-align: center;\"><strong>Timestamps:</strong><br />\nDoug Walsh Interview: 00:03:56<br />\nSekiro: Shadows Die Twice: 00:50:10<br />\nPhotographs: 01:00:26<br />\n39 Days to Mars: 01:10:05<br />\nCrimson Keep: 01:15:10<br />\nThe Division 2: 01:19:03<br />\nDark Quest 2: 01:32:25<br />\nClosing: 01:42:41<br />\nBanter: 01:47:08</p>\n<p align=\"center\"></p>\n<p style=\"text-align: center;\"><strong>Please send feedback and mailbag questions to SoVideogamesPODCAST (at) gmail (dot) com, or post them in the comments section below. Thanks!</strong></p>", "date": "2019-05-21", "url": "https://gamecritics.com/brad-gallaway/gamecritics-radio-so-videogames-ep-131/"}, {"title": "GameCritics Radio: So\u2026 Videogames! Ep. 130", "desc": "<p><a href=\"https://gamecritics.com/wp-content/uploads/2017/07/SVG-GC-Logo.jpg\"></a></p>\n<p>Between SVG Studios Northwest and SVG Studios Southwest, things are all kinds of mixed up this week. Brad and Corey are both busy as heck and squeezed in a shorter-than-usual 1.5-hour show that\u2019s out of normal format.</p>\n<p>Longtime listeners might appreciate a return-to-form of freestyle banter first then games chat at the end, but if you just want to get to the games, check the timestamps and fast-forward to them.</p>\n<p>Brad talks about a trans-focused film fest he attended and his son getting swim lessons, Corey gives a swim lesson horror story and discusses plans for his first cosplay. They also chat about Netflix shows and Netflix cancelling shows before games chat.</p>\n<p style=\"text-align: center;\"><strong>Timestamps:</strong></p>\n<p style=\"text-align: center;\"><strong>Banter</strong><br />\nHousekeeping: 00:01:20<br />\nCorey\u2019s Cosplay Plans: 00:06:50<br />\nTranslations Film Festival: 00:16:34<br />\nThe Dark Crystal: 00:29:20<br />\nNetflix: 00:33:40<br />\nSwimming Lessons: 00:39:39</p>\n<p style=\"text-align: center;\"><strong>Games</strong><br />\nToby: The Secret Mine: 00:46:45<br />\nFortnite: 00:58:43<br />\nDeus Ex: Human Revolution: 01:06:34<br />\nSekiro: Shadows Die Twice: 01:16:12<br />\nClosing 01:26:04</p>\n<p align=\"center\"></p>\n<p style=\"text-align: center;\"><strong>Please send feedback and mailbag questions to SoVideogamesPODCAST (at) gmail (dot) com, or post them in the comments section below. Thanks!</strong></p>", "date": "2019-05-09", "url": "https://gamecritics.com/brad-gallaway/gamecritics-radio-so-videogames-ep-130/"}, {"title": "GameCritics Radio: So\u2026 Videogames! Ep. 128", "desc": "<p><a href=\"https://gamecritics.com/wp-content/uploads/2017/07/SVG-GC-Logo.jpg\"></a></p>\n<p>Brad and Corey really live up to the show\u2019s \u201cnew stuff, old stuff and anything in between\u201d motto this week. Corey spent his three-day weekend dabbling in some old games for short bursts, they give an update on The Division 2, and Brad holds down the \u201cnew stuff\u201d promise with an\u2026 elevator operator zombie sim? They also discuss Netflix\u2019s The Silence, robot arms, Star Trek: Discovery, 3D printers and more.</p>\n<p style=\"text-align: center;\"><strong>Timestamps:</strong><br />\nThe Division 2: 00:07:13<br />\nLeft Alive: 00:29:59<br />\nSekiro: Shadows Die Twice: 00:38:46<br />\nNinja Gaiden 2: 00:46:04<br />\nResident Evil 7: 00:53:59<br />\nUndead\u2019s Building: 00:59:42<br />\nClosing: 01:05:11<br />\nBanter: 01:08:35</p>\n<p align=\"center\"></p>\n<p style=\"text-align: center;\"><strong>Please send feedback and mailbag questions to SoVideogamesPODCAST (at) gmail (dot) com, or post them in the comments section below. Thanks!</strong></p>", "date": "2019-04-25", "url": "https://gamecritics.com/brad-gallaway/gamecritics-radio-so-videogames-ep-128/"}, {"title": "GameCritics Radio: So\u2026 Videogames! Ep. 127", "desc": "<p><a href=\"https://gamecritics.com/wp-content/uploads/2017/07/SVG-GC-Logo.jpg\"></a></p>\n<p>Episode 127 is all-killer, no-filler as Brad and Corey were short on time to record this week. It\u2019s just pure games chat with no post-show banter, but that doesn\u2019t stop us from covering four games <em>plus</em> give an update on a game giveaway.</p>\n<p style=\"text-align: center;\"><strong>Timestamps:</strong><br />\nHeaven\u2019s Vault: 00:03:15<br />\nHitman 2 Upcoming DLC + Hantu Port: 00:14:40<br />\nSekiro: Shadows Die Twice: 00:31:18<br />\nLeft Alive: 00:57:19<br />\nGame Giveaway Update: 01:20:14<br />\nClosing: 01:22:51</p>\n<p align=\"center\"></p>\n<p style=\"text-align: center;\"><strong>Please send feedback and mailbag questions to SoVideogamesPODCAST (at) gmail (dot) com, or post them in the comments section below. Thanks!</strong></p>", "date": "2019-04-19", "url": "https://gamecritics.com/brad-gallaway/gamecritics-radio-so-videogames-ep-127/"}, {"title": "GameCritics Radio: So\u2026 Videogames! Ep. 126", "desc": "<p><a href=\"https://gamecritics.com/wp-content/uploads/2017/07/SVG-GC-Logo.jpg\"></a></p>\n<p><strong>SPOILER ALERT:</strong> Brad and Corey discuss <strong><em>Far: Lone Sails</em></strong> inside and out for the last segment of the show. They give two spoiler warnings. The spoiler section starts at 00:55:47 and ends at 01:34:11. Please avoid this section if you don\u2019t want to be spoiled.</p>\n<p>Otherwise, Brad and Corey are back on track and they stumble through some housekeeping before talking a mighty handful of games and spoiling the heck out of <em>Far: Lone Sails</em>. They also talk about a TV show about botched plastic surgery, a PSA to back up your computer files, breakfast cereal recipes and much more.</p>\n<p><strong>ALSO, we\u2019re giving three games away! Listen in for more details\u2026 </strong></p>\n<p style=\"text-align: center;\"><strong>Timestamps:</strong><br />\nSingularity 5 Soundtrack: 00:03:10<br />\nRE2 DLC: 00:09:23<br />\nGame Giveaway: 00:20:20<br />\nDetention Demo: 00:25:16<br />\nNeon Caves: 00:35:41<br />\nAssault Android Cactus: 00:39:50<br />\nOverwhelm: 00:44:24<br />\nSafety First: 00:52:03
