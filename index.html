ds/2022/04/SVG-Twitter.jpg\"></a>\n\n\n\n<p class=\"wp-block-paragraph\">In this episode, Brad covers Soverign Syndicate, Death Howl, Showgunners and Vampire Therapist, along with a few odds and ends happening in the industry.</p>\n\n\n\n<div style=\"font-size: 10px; color: #cccccc;line-break: anywhere;word-break: normal;overflow: hidden;white-space: nowrap;text-overflow: ellipsis; font-family: Interstate,Lucida Grande,Lucida Sans Unicode,Lucida Sans,Garuda,Verdana,Tahoma,sans-serif;font-weight: 100;\"><a href=\"https://soundcloud.com/user-200756560\" title=\"The So... Videogames! Podcast\" target=\"_blank\" style=\"color: #cccccc; text-decoration: none;\">The So\u2026 Videogames! Podcast</a> \u00b7 <a href=\"https://soundcloud.com/user-200756560/so-videogames-episode-476\" title=\"So Videogames Episode 476 - Sovereign Syndicate, Death Howl, Showgunners, Vampire Therapist\" target=\"_blank\" style=\"color: #cccccc; text-decoration: none;\">So Videogames Episode 476 \u2013 Sovereign Syndicate, Death Howl, Showgunners, Vampire Therapist</a></div>\n\n\n\n<p class=\"wp-block-paragraph\">You can also hear the show on <a href=\"https://podcasts.apple.com/us/podcast/the-so-videogames-podcast/id1168917623\">iTunes</a> </p>\n\n\n\n<p class=\"has-text-align-center wp-block-paragraph\"><strong>Please send feedback and mailbag questions to SoVideogamesPODCAST (at) gmail (dot) com, or post them in the comments section below. Thanks!</strong></p>", "date": "2026-02-22", "url": "https://gamecritics.com/brad-gallaway/so-videogames-episode-476-sovereign-syndicate-death-howl-showgunners-vampire-therapist/"}, {"title": "So Videogames Episode 475: Mewgenics, Reanimal, God of War: Sons of Sparta, Centipede Gun, Nioh 3, Lovish, Starless Abyss, High on Life 2", "desc": "<a href=\"https://gamecritics.com/wp-content/uploads/2022/04/SVG-Twitter.jpg\"></a>\n\n\n\n<p class=\"wp-block-paragraph\">In this episode Carlos joins Brad, and the two hosts start with a huge load of housekeeping followe -i-hate-this-place-drop-duchy-oregon-trail/"}, {"title": "So Videogames Episode 473: Interview with Emeric Thoa of The Game Bakers + Cairn", "desc": "<a href=\"https://gamecritics.com/wp-content/uploads/2022/04/SVG-Twitter.jpg\"></a>\n\n\n\n<p class=\"wp-block-paragraph\">In this special episode, Brad talks with Emeric Thoa, Creative Director of The Game Bakers about their recent mountain climbing title, Cairn. Following the interview is the full, scored So Videogames review. </p>\n\n\n\n<div class=\"wp-block-embed__wrapper\">\n\n</div>\n\n\n\n<p class=\"wp-block-paragraph\">You can also hear the show on <a href=\"https://podcasts.apple.com/us/podcast/the-so-videogames-podcast/id1168917623\">iTunes</a> </p>\n\n\n\n<p class=\"has-text-align-center wp-block-paragraph\"><strong>Please send feedback and mailbag questions to SoVideogamesPODCAST (at) gmail (dot) com, or post them in the comments section below. Thanks!</strong></p>", "date": "2026-01-27", "url": "https://gamecritics.com/brad-gallaway/so-videogames-episode-473-interview-with-emeric-thoa-of-the-game-bakers-cairn/"}, {"title": "So Videogames Episode 472: The Carlos Show", "desc": "<a href=\"https://gamecritics.com/wp-content/uploads/2022/04/SVG-Twitter.jpg\"></a>\n\n\n\n<p class=\"wp-block-paragraph\">In this episode Brad is bound by embargo to hold his tongue and has nothing to share, so Carlos saves the day with a whole slew of titles including:</p>\n\n\n\n<p class=\"wp-block-paragraph\"><br>Dragon Traveler<br>Fallout: New Vegas<br>Arknights Endfied<br>Crystal of Atlan\u2026 And more!</p>\n\n\n\n<div class=\"wp-block-embed__wrapper\">\n\n</div>\n\n\n\n<p class=\"wp-block-paragraph\">You can also hear the show on <a href=\"https://podcasts.apple.com/us/podcast/the-so-videogames-podcast/id1168917623\">iTunes</a> </p>\n\n\n\n<p class=\"has-text-align-center wp-block-paragraph\"><strong>Please send feedback and mailbag questions to SoVideogamesPODCAST (at) gmail (dot) com, or post them in the comments section b es-episode-462/"}, {"title": "So Videogames Episode 461", "desc": "<a href=\"https://gamecritics.com/wp-content/uploads/2022/04/SVG-Twitter.jpg\"></a>\n\n\n\n<p class=\"wp-block-paragraph\">In this episode, Brad answers a question on accessibility, includes last\u2019s week\u2019s clip that was cut due to embargo reasons, takes a look ahead at the next few shows and then covers:</p>\n\n\n\n<p class=\"wp-block-paragraph\">Battle Suit Aces<br>Dark Quest 4<br>A Pizza Delivery<br>Kentum<br>Arc Raiders<br>Dying Light: The Beast<br>Windswept</p>\n\n\n\n<p class=\"wp-block-paragraph\">\u2026And more!</p>\n\n\n\n<div class=\"wp-block-embed__wrapper\">\n\n</div>\n\n\n\n<p class=\"wp-block-paragraph\">You can also hear the show on <a href=\"https://podcasts.apple.com/us/podcast/the-so-videogames-podcast/id1168917623\">iTunes</a> </p>\n\n\n\n<p class=\"has-text-align-center wp-block-paragraph\"><strong>Please send feedback and mailbag questions to SoVideogamesPODCAST (at) gmail (dot) com, or post them in the comments section below. Thanks!</strong></p>", "date": "2025-11-09", "url": "https://gamecritics.com/brad-gallaway/so-videogames-episode-461/"}, {"title": "So Videogames Episode 460", "desc": "<a href=\"https://gamecritics.com/wp-content/uploads/2022/04/SVG-Twitter.jpg\"></a>\n\n\n\n<p class=\"wp-block-paragraph\">In this episode, Jeremiah Bratton (formerly of GaymeBar) returns. We discuss:</p>\n\n\n\n<p class=\"wp-block-paragraph\">Escape From Duckov<br>Pokemon Z-A<br>Space Chef<br>Final Fantasy Tactics<br>Halls of Torment\u2026 And more!</p>\n\n\n\n<div class=\"wp-block-embed__wrapper\">\n\n</div>\n\n\n\n<p class=\"wp-block-paragraph\">You can also hear the show on <a href=\"https://podcasts.apple.com/us/podcast/the-so-videogames-podcast/id1168917623\">iTunes</a> </p>\n\n\n\n<p class=\"has-text-align-center wp-block-paragraph\"><strong>Please send feedback and mailbag questions to SoVideogamesPODCAST (at) gmail (dot) com, or post them in the comments section below. Thanks!</strong></p>", "date": "2025-11-03", "url": "https://gamecritics.com/brad-gallaway/so-videogames-episode-460/"}, {"title": "So Videogames Episode 459", "desc": "<a href=\"https://gamecritics.com/wp-content/uploads/2022/04/SVG-Twitter.jpg\"></a>\n\n\n\n<p class=\"wp-block-paragraph\">In this episode, Brad covers:</p>\n\n\n\n<p class=\"wp-block-paragraph\">Yet Another Zombie Survivors<br>Ball x Pit<br>Spindle<br>Bye, Sweet Carole<br>Ila: Frosty Glide<br>Detective Dotson<br>Bounty Star</p>\n\n\n\n<p class=\"wp-block-paragraph\">\u2026And more!</p>\n\n\n\n<div class=\"wp-block-embed__wrapper\">\n\n</div>\n\n\n\n<p class=\"wp-block-paragraph\">You can also hear the show on <a href=\"https://podcasts.apple.com/us/podcast/the-so-videogames-podcast/id1168917623\">iTunes</a> </p>\n\n\n\n<p class=\"has-text-align-center wp-block-paragraph\"><strong>Please send feedback and mailbag questions to SoVideogamesPODCAST (at) gmail (dot) com, or post them in the comments section below. Thanks!</strong></p>", "date": "2025-10-27", "url": "https://gamecritics.com/brad-gallaway/so-videogames-episode-459/"}, {"title": "So Videogames Episode 458: Halloweeners", "desc": "<a href=\"https://gamecritics.com/wp-content/uploads/2022/04/SVG-Twitter.jpg\"></a>\n\n\n\n<p class=\"wp-block-paragraph\">We\u2019re nearing the end of October, so you know what that means! Yep, it\u2019s time for a quick divergence into spooky movie recommendations to celebrate the spookiest season! There\u2019s no major games discussion here, but Carlos Rodela comes aboard to share our (sort-of) top 10s and related tangents! Enjoy!</p>\n\n\n\n<div class=\"wp-block-embed__wrapper\">\n\n</div>\n\n\n\n<p class=\"wp-block-paragraph\">You can also hear the show on <a href=\"https://podcasts.apple.com/us/podcast/the-so-videogames-podcast/id1168917623\">iTunes</a> </p>\n\n\n\n<p class=\"has-text-align-center wp-block-paragraph\"><strong>Please send feedback and mailbag questions to SoVideogamesPODCAST (at) gmail (dot) com, or post them in the comments section below. Thanks!</strong></p>", "date": "2025-10-23", "url": "https://gamecritics.com/brad-gallaway/so-videogames-episode-458-halloweeners/"}, {"title": "So Videogames Episode 457", "desc": "<a href=\"https://gamecritics.com/wp-content/uploads/2022/04/SVG-Twitter.jpg\"></a>\n\n\n\n<p class=\"wp-block-paragraph\">This week\u2019s episode covers:</p>\n\n\n\n<p class=\"wp-block-paragraph\">Endoparasitic<br>Strange antiquities<br>Super Mining Mechs<br>Castle of Heart Retold<br>Hades II<br>Yet Another Zombie Survivors<br>Creepy Redneck Dinosaur Mansion 3</p>\n\n\n\n<p class=\"wp-block-paragraph\">\u2026And more!</p>\n\n\n\n<p class=\"wp-block-paragraph\">You can also hear the show on <a href=\"https://podcasts.apple.com/us/podcast/the-so-videogames-podcast/id1168917623\">iTunes</a></p>\n\n\n\n<div class=\"wp-block-embed__wrapper\">\n\n</div>\n\n\n\n<p class=\"has-text-align-center wp-block-paragraph\"><strong>Please send feedback and mailbag questions to SoVideogamesPODCAST (at) gmail (dot) com, or post them in the comments section below. Thanks!</strong></p>", "date": "2025-10-12", "url": "https://gamecritics.com/brad-gallaway/so-videogames-episode-457/"}, {"title": "So Videogames Episode 456", "desc": "<a href=\"https://gamecritics.com/wp-content/uploads/2022/04/SVG-Twitter.jpg\"></a>\n\n\n\n<p class=\"wp-block-paragraph\">In this shorter-than-usual episode, Brad covers:</p>\n\n\n\n<p class=\"wp-block-paragraph\">Strange Antiquities<br>Endoparasitic<br>Xenotilt<br>Femboy Futa House \u2013 HEADS UP, this is an adults-only title. The podcast discussion is not graphic, but since we don\u2019t cover adult titles often, please be aware it\u2019s here and listen responsibly. = )</p>\n\n\n\n<div class=\"wp-block-embed__wrapper\">\n\n</div>\n\n\n\n<p class=\"wp-block-paragraph\">You can also hear the show on <a href=\"https://podcasts.apple.com/us/podcast/the-so-videogames-podcast/id1168917623\">iTunes</a></p>\n\n\n\n<p class=\"has-text-align-center wp-block-paragraph\"><strong>Please send feedback and mailbag questions to SoVideogamesPODCAST (at) gmail (dot) com, or post them in the comments section below. Thanks!</strong></p>\n\n\n\n<p class=\"wp-block-paragraph\"></p>", "date": "2025-10-04", "url": "https://gamecritics.com/brad-gallaway/so-videogames-episode-456/"}, {"title": "So Videogames Episode 455", "desc": "<a href=\"https://gamecritics.com/wp-content/uploads/2022/04/SVG-Twitter.jpg\"></a>\n\n\n\n<p class=\"wp-block-paragraph\">In this episode, Brad has a very special guest \u2014 <strong>Jeremiah Bratton</strong>, formerly of the GaymeBar Podcast!</p>\n\n\n\n<p class=\"wp-block-paragraph\">In this mammoth ep the guys reminisce and go off on a dizzying number of tangents before covering titles including, but not limited to:</p>\n\n\n\n<p class=\"wp-block-paragraph\">Ratatan<br>Strange Antiquities<br>Fire Emblem (NES)<br>Hotel Barcelona<br>Borderlands 4<br>Wander Stars</p>\n\n\n\n<p class=\"wp-block-paragraph\">\u2026And more! And if you enjoyed Jeremiah\u2019s time on SVG, drop us a line and let us know!</p>\n\n\n\n<div class=\"wp-block-embed__wrapper\">\n\n</div>\n\n\n\n<p class=\"wp-block-paragraph\">You can also hear the show on <a href=\"https://podcasts.apple.com/us/podcast/the-so-videogames-podcast/id1168917623\">iTunes</a></p>\n\n\n\n<p class=\"has-text-align-center wp-block-paragraph\"><strong>Please send feedback and mailbag questions to SoVideogamesPODCAST (at) gmail (dot) com, or post them in the comments section below. Thanks!</strong></p>", "date": "2025-09-28", "url": "https://gamecritics.com/brad-gallaway/so-videogames-episode-455/"}, {"title": "So Videogames Episode 454", "desc": "<a href=\"https://gamecritics.com/wp-content/uploads/2022/04/SVG-Twitter.jpg\"></a>\n\n\n\n<p class=\"wp-block-paragraph\">In this episode, Brad covers:</p>\n\n\n\n<p class=\"wp-block-paragraph\">Ritual of Raven<br>Frostpunk 2<br>Metal Eden<br>TMNT Tactical Takedown</p>\n\n\n\n<p class=\"wp-block-paragraph\">\u2026And more!</p>\n\n\n\n<div class=\"wp-block-embed__wrapper\">\n\n</div>\n\n\n\n<p class=\"wp-block-paragraph\">You can also hear the show on <a href=\"https://podcasts.apple.com/us/podcast/the-so-videogames-podcast/id1168917623\">iTunes</a></p>\n\n\n\n<p class=\"has-text-align-center wp-block-paragraph\"><strong>Please send feedback and mailbag questions to SoVideogamesPODCAST (at) gmail (dot) com, or post them in the comments section below. Thanks!</strong></p>", "date": "2025-09-26", "url": "https://gamecritics.com/brad-gallaway/so-videogames-episode-454/"}, {"title": "So Videogames Episode 453", "desc": "<a href=\"https://gamecritics.com/wp-content/uploads/2022/04/SVG-Twitter.jpg\"></a>\n\n\n\n<p class=\"wp-block-paragraph\">In this episode, Carlos Rodela makes a return to chat with Brad about all the things! </p>\n\n\n\n<p class=\"wp-block-paragraph\">Between the two of them, they cover:</p>\n\n\n\n<p class=\"wp-block-paragraph\">Diablo 4</p>\n\n\n\n<p class=\"wp-block-paragraph\">Hollow Knight: Silksong</p>\n\n\n\n<p class=\"wp-block-paragraph\">Discounty -Final Score</p>\n\n\n\n<p class=\"wp-block-paragraph\">Chip \u2018n Clawz vs. the Brainioids</p>\n\n\n\n<p class=\"wp-block-paragraph\">Sword of the Sea</p>\n\n\n\n<p class=\"wp-block-paragraph\">Hell is Us</p>\n\n\n\n<p class=\"wp-block-paragraph\">Daemon x Machina: Titanic Scion</p>\n\n\n\n<p class=\"wp-block-paragraph\">Borderlands 4     \u2026..And more! </p>\n\n\n\n<div class=\"wp-block-embed__wrapper\">\n\n</div>\n\n\n\n<p class=\"wp-block-paragraph\">You can also hear the show on <a href=\"https://podcasts.apple.com/us/podcast/the-so-videogames-podcast/id1168917623\">iTunes</a>!</p>\n\n\n\n<p class=\"has-text-align-center wp-block-paragraph\"><strong>Please send feedback and mailbag questions to SoVideogamesPODCAST (at) gmail (dot) com, or post them in the comments section below. Thanks!</strong></p>\n\n\n\n<p class=\"wp-block-paragraph\"></p>", "date": "2025-09-21", "url": "https://gamecritics.com/brad-gallaway/so-videogames-episode-453/"}, {"title": "So Videogames Episode 452", "desc": "<a href=\"https://gamecritics.com/wp-content/uploads/2022/04/SVG-Twitter.jpg\"></a>\n\n\n\n<p class=\"wp-block-paragraph\">In this episode, Brad covers:</p>\n\n\n\n<p class=\"wp-block-paragraph\">Discounty<br>Is This Seat Taken?<br>Grit & Valor<br>Lords of the Fallen 2.0<br>Otherwar<br>Cronos: the New Dawn<br>Hollow Knight: Silksong</p>\n\n\n\n<p class=\"wp-block-paragraph\">\u2026And more!</p>\n\n\n\n<p class=\"wp-block-paragraph\"></p>\n\n\n\n<p class=\"wp-block-paragraph\">You can also hear the show on <a href=\"https://podcasts.apple.com/us/podcast/the-so-videogames-podcast/id1168917623\">iTunes</a> and <a href=\"https://open.spotify.com/show/3PNLEo7I1ap7GeeNxOA4Kq\">Spotify</a>! </p>\n\n\n\n<p class=\"has-text-align-center wp-block-paragraph\"><strong>Please send feedback and mailbag questions to SoVideogamesPODCAST (at) gmail (dot) com, or post them in the comments section below. Thanks!</strong></p>\n\n\n\n<p class=\"wp-block-paragraph\"></p>", "date": "2025-09-14", "url": "https://gamecritics.com/brad-gallaway/so-videogames-episode-452/"}, {"title": "So Videogames Episode 451", "desc": "<a href=\"https://gamecritics.com/wp-content/uploads/2022/04/SVG-Twitter.jpg\"></a>\n\n\n\n<p class=\"wp-block-paragraph\">In this rapid-fire episode, Brad covers:</p>\n\n\n\n<p class=\"wp-block-paragraph\">Discounty<br>Curse Rounds<br>Grit & Valor<br>Is This Seat Taken?<br>Herdling</p>\n\n\n\n<p class=\"wp-block-paragraph\">\u2026And more!</p>\n\n\n\n<p class=\"wp-block-paragraph\">Also, heads up that there will be a longer-than-usual period between podcasts. Expect the next one in about a week and a half as Brad puts things on pause for a minute to take care of some non-game stuff.</p>\n\n\n\n<p class=\"wp-block-paragraph\">Thanks!!</p>\n\n\n\n<p class=\"wp-block-paragraph\"></p>\n\n\n\n<p class=\"wp-block-paragraph\">You can also hear the show on <a href=\"https://podcasts.apple.com/us/podcast/the-so-videogames-podcast/id1168917623\">iTunes</a> and <a href=\"https://open.spotify.com/show/3PNLEo7I1ap7GeeNxOA4Kq\">Spotify</a>! </p>\n\n\n\n<p class=\"has-text-align-center wp-block-paragraph\"><strong>Please send feedback and mailbag questions to SoVideogamesPODCAST (at) gmail (dot) com, or post them in the comments section below. Thanks!</strong></p>\n\n\n\n<p class=\"wp-block-paragraph\"></p>", "date": "2025-08-26", "url": "https://gamecritics.com/brad-gallaway/so-videogames-episode-451/"}, {"title": "So Videogames Episodes 449 & 450", "desc": "<a href=\"https://gamecritics.com/wp-content/uploads/2022/04/SVG-Twitter.jpg\"></a>\n\n\n\n<p class=\"wp-block-paragraph\">Brad\u2019s been playing catch-up, so we have TWO episodes this week!</p>\n\n\n\n<p class=\"wp-block-paragraph\">First, Episode 449 where Brad covers Mina the Hollower (demo), Discounty, Hell is Us (demo) and <br>Lords of the Fallen 2.0</p>\n\n\n\n<p class=\"wp-block-paragraph\"></p>\n\n\n\n<p class=\"has-text-align-center wp-block-paragraph\">*</p>\n\n\n\n<p class=\"wp-block-paragraph\">Then, we also have Episode 450 where Carlos arrives halfway through, delivered by angels from on high. Games covered include: </p>\n\n\n\n<p class=\"wp-block-paragraph\">Lords of the Fallen 2.0<br>One-Eyed Likho (demo)<br>Tiny Bookshop<br>Echoes of the End<br>Mafia: the Old Country<br>Discounty<br>Path of Exile 2</p>\n\n\n\n<p class=\"wp-block-paragraph\">\u2026And more!</p>\n\n\n\n<p class=\"wp-block-paragraph\"></p>\n\n\n\n<p class=\"wp-block-paragraph\">You can also hear the show on <a href=\"https://podcasts.apple.com/us/podcast/the-so-videogames-podcast/id1168917623\">iTunes</a> and <a href=\"https://open.spotify.com/show/3PNLEo7I1ap7GeeNxOA4Kq\">Spotify</a>! </p>\n\n\n\n<p class=\"has-text-align-center wp-block-paragraph\"><strong>Please send feedback and mailbag questions to SoVideogamesPODCAST (at) gmail (dot) com, or post them in the comments section below. Thanks!</strong></p>\n\n\n\n<p class=\"wp-block-paragraph\"></p>", "date": "2025-08-16", "url": "https://gamecritics.com/brad-gallaway/so-videogames-episodes-449-450/"}, {"title": "So Videogames Episode 448", "desc": "<a href=\"https://gamecritics.com/wp-content/uploads/2022/04/SVG-Twitter.jpg\"></a>\n\n\n\n<p class=\"wp-block-paragraph\">In this episode, Brad Covers:</p>\n\n\n\n<p class=\"wp-block-paragraph\"><br>Ludocene Launches!<br>Death Stranding<br>Curious Expediton 2<br>Turbo Kid<br>Discounty (demo)<br>Time Flies<br>Achilles: Survivor \u2014 REVIEW<br>Lords of the Fallen 2.0</p>\n\n\n\n<p class=\"wp-block-paragraph\"></p>\n\n\n\n<p class=\"wp-block-paragraph\">You can also hear the show on <a href=\"https://podcasts.apple.com/us/podcast/the-so-videogames-podcast/id1168917623\">iTunes</a> and <a href=\"https://open.spotify.com/show/3PNLEo7I1ap7GeeNxOA4Kq\">Spotify</a>! </p>\n\n\n\n<p class=\"has-text-align-center wp-block-paragraph\"><strong>Please send feedback and mailbag questions to SoVideogamesPODCAST (at) gmail (dot) com, or post them in the comments section below. Thanks!</strong></p>", "date": "2025-08-04", "url": "https://gamecritics.com/brad-gallaway/so-videogames-episode-448/"}, {"title": "So Videogames Episode 447: The Death Stranding 2 SPOILERCAST", "desc": "<a href=\"https://gamecritics.com/wp-content/uploads/2022/04/SVG-Twitter.jpg\"></a>\n\n\n\n<p class=\"wp-block-paragraph\">Today\u2019s episode is something a little different! Carlos Rodela is back to chat about every secret, twist and turn in <em>Death Stranding 2</em> \u2014 it\u2019s the spoilercast! </p>\n\n\n\n<p class=\"wp-block-paragraph\">Be warned that once past the opening, the entire game is up for discussion, so please don\u2019t listen to the show if you\u2019re concerned about being spoiled on the story aspects of the game. </p>\n\n\n\n<p class=\"wp-block-paragraph\">The guys also give <em>DS2</em> their final review scores as well \u2014 and they\u2019re probably not what you expect!</p>\n\n\n\n<p class t-align-center wp-block-paragraph\"><strong>Please send feedback and mailbag questions to SoVideogamesPODCAST (at) gmail (dot) com, or post them in the comments section below. Thanks!</strong></p>", "date": "2025-01-04", "url": "https://gamecritics.com/brad-gallaway/so-videogames-episode-422/"}, {"title": "So Videogames Episode 421", "desc": "<a href=\"https://gamecritics.com/wp-content/uploads/2022/04/SVG-Twitter.jpg\"></a>\n\n\n\n<p class=\"wp-block-paragraph\">In this post-GOTY episode, Brad covers an insane amount of titles, including:</p>\n\n\n\n<p class=\"wp-block-paragraph\">Helldivers 2<br>Venture to the Vile<br>Pine: a Story of Loss<br>Flint: Treasure of Oblivion<br>Universe for Sale<br>Songs of Silence<br>Unicorn Overlord<br>Beyond Galaxyland<br>Beyond Horizons<br>Shadow Tactics: Aiko\u2019s Choice</p>\n\n\n\n<p class=\"wp-block-paragraph\">\u2026And more!</p>\n\n\n\n<p class=\"wp-block-paragraph\"></p>\n\n\n\n<p class=\"wp-block-paragraph\">You can also hear the show on <a href=\"https://podcasts.apple.com/us/podcast/the-so-videogames-podcast/id1168917623\">iTunes</a> and <a href=\"https://open.spotify.com/show/3PNLEo7I1ap7GeeNxOA4Kq\">Spotify</a>! </p>\n\n\n\n<p class=\"has-text-align-center wp-block-paragraph\"><strong>Please send feedback and mailbag questions to SoVideogamesPODCAST (at) gmail (dot) com, or post them in the comments section below. Thanks!</strong></p>", "date": "2024-12-30", "url": "https://gamecritics.com/brad-gallaway/so-videogames-episode-421/"}, {"title": "So Videogames Episode 420: GOTY", "desc": "<a href=\"https://gamecritics.com/wp-content/uploads/2022/04/SVG-Twitter.jpg\"></a>\n\n\n\n<p class=\"wp-block-paragraph\">In this gargantuan year-end episode, Brad closes out 2024 with returning co-host Carlos Rodela!</p>\n\n\n\n<p class=\"wp-block-paragraph\">The two discuss their biggest disappointments, the games that got away and their honorable mentions before listing their individual top 10s.</p>\n\n\n\n<p class=\"wp-block-paragraph\">As a special treat, they close out the show with a slew of listener picks!</p>\n\n\n\n<p class=\"wp-block-paragraph\"></p>\n\n\n\n<p class=\"wp-block-paragraph\">You can also hear the show on <a href=\"https://podcasts.apple.com/us/podcast/the-so-videogames-podcast/id1168917623\">iTunes</a> and <a href=\"https://open.spotify.com/show/3PNLEo7I1ap7GeeNxOA4Kq\">Spotify</a>! </p>\n\n\n\n<p class=\"has-text-align-center wp-block-paragraph\"><strong>Please send feedback and mailbag questions to SoVideogamesPODCAST (at) gmail (dot) com, or post them in the comments section below. Thanks!</strong></p>", "date": "2024-12-21", "url": "https://gamecritics.com/brad-gallaway/so-videogames-episode-420-goty/"}, {"title": "So Videogames Episode 419", "desc": "<a href=\"https://gamecritics.com/wp-content/uploads/2022/04/SVG-Twitter.jpg\"></a>\n\n\n\n<p class=\"wp-block-paragraph\">In this episode, I cover:</p>\n\n\n\n<p class=\"wp-block-paragraph\">Miniatures<br>Keeper\u2019s Toll<br>Indiana Jones & the Great Circle<br>Hades<br>Mythwrecked<br>The Thaumaturge</p>\n\n\n\n<p class=\"wp-block-paragraph\">\u2026And more!</p>\n\n\n\n<p class=\"wp-block-paragraph\"></p>\n\n\n\n<p class=\"wp-block-paragraph\">You can also hear the show on <a href=\"https://podcasts.apple.com/us/podcast/the-so-videogames-podcast/id1168917623\">iTunes</a> and <a href=\"https://open.spotify.com/show/3PNLEo7I1ap7GeeNxOA4Kq\">Spotify</a>! </p>\n\n\n\n<p class=\"has-text-align-center wp-block-paragraph\"><strong>Please send feedback and mailbag questions to SoVideogamesPODCAST (at) gmail (dot) com, or post them in the comments section below. Thanks!</strong></p>", "date": "2024-12-16", "url": "https://gamecritics.com/brad-gallaway/so-videogames-episode-419/"}, {"title": "So Videogames Episode 418", "desc": "<a href=\"https://gamecritics.com/wp-content/uploads/2022/04/SVG-Twitter.jpg\"></a>\n\n\n\n<p class=\"wp-block-paragraph\">In this episode, Brad covers:</p>\n\n\n\n<p class=\"wp-block-paragraph\">Keeper\u2019s Toll<br>Miniatures<br>Albatroz<br>Mindcop<br>Infinity Nikki<br>Happy Birthday with Sergio Spellbound<br>Indiana Jones & the Great Circle</p>\n\n\n\n<p class=\"wp-block-paragraph\">\u2026And more!</p>\n\n\n\n<p class=\"wp-block-paragraph\"></p>\n\n\n\n<p class=\"wp-block-paragraph\">You can also hear the show on <a href=\"https://podcasts.apple.com/us/podcast/the-so-videogames-podcast/id1168917623\">iTunes</a> and <a href=\"https://open.spotify.com/show/3PNLEo7I1ap7GeeNxOA4Kq\">Spotify</a>! </p>\n\n\n\n<p class=\"has-text-align-center wp-block-paragraph\"><strong>Please send feedback and mailbag questions to SoVideogamesPODCAST (at) gmail (dot) com, or post them in the comments section below. Thanks!</strong></p>", "date": "2024-12-09", "url": "https://gamecritics.com/brad-gallaway/so-videogames-episode-418/"}, {"title": "SVG REVIEW Europa", "desc": "<a href=\"https://gamecritics.com/wp-content/uploads/2024/12/SVG-Twitter.jpg\"></a>\n\n\n\n<p class=\"wp-block-paragraph\"><strong>This is a transcript excerpt covering the score awarded to Europa on the So Videogames podcast, <a href=\"https://gamecritics.com/brad-gallaway/so-videogames-episode-411/\">Episode 411</a>. </strong> </p>\n\n\n\n<hr>\n\n\n\n<p class=\"wp-block-paragraph\">All right, the last game of the show here is a very special one, which I really enjoyed a great deal. And I haven\u2019t done this for a while, but I\u2019m going to go on the record and say this is the official sovideogames review.</p>\n\n\n\n<p class=\"wp-block-paragraph\">So, Europa, uh, wow, what an interesting little gem. Kind of come out of nowhere. And I really, really had a great time with this one. Uh, this is a third person. Uh, I don\u2019t want to call it an action game. It\u2019s not really an action game.</p>\n\n\n\n<p class=\"wp-block-paragraph\">It\u2019s kind of like an experience game. A vibes game, I believe when I was talking to people in the discord about it, I called it a cozy, chill core game. And I think that\u2019s a pretty accurate description.</p>\n\n\n\n<p class=\"wp-block-paragraph\">so, what is what is Europa? The story is that you are an android, I believe, and you are on the moon, Europa, which is out in space. people have humans specifically have gone there to terraform it because they fucked up things on earth, just like we\u2019re doing now in real time. And so, they have gone to Europa to, uh, terraform it, to make it a new home away from home where they were supposed to start fresh and create a new civilization. Et cetera. Et cetera. Just like all these jerkoffs are talking about going to Mars, which is obviously doomed for failure, but kind of that same premise here.</p>\n\n\n\n<p class=\"wp-block-paragraph\">So basically, uh, you start the game at the grave of the person who created you. And this is not a spoiler. This is literally like the opening scene of the game. I\u2019m not going to spoil anything. And honestly, there\u2019s not like a whole lot to spoil, frankly. But, um, but that\u2019s not a bad thing. But you start at the grave of the person who created you, and then you are you\u2019re faced with a task. You need to get to an island. There\u2019s an island floating in the sky.</p>\n\n\n\n<p class=\"wp-block-paragraph\">You can see it off in the horizon. It\u2019s not super far away, but it\u2019s, you know, it\u2019s a little a little far. You are on the ground on the surface of Europa and it looks like Earth. It\u2019s green, it\u2019s got some water flowing. There\u2019s a little cozy, little like cabin and a house, uh, off in the distance. But you, you look around and it looks very earth like and idyllic. But within just a few moments of looking around, you realize it\u2019s not quite the same. While at first glance it may look very earth like, you can see that the gravity is kind of messed up in some places. There are some things that are floating that shouldn\u2019t be floating, and things look a little bit off. Uh, like, for example, this giant island that\u2019s floating in the sky. Uh, also, you look at the animals and you\u2019ll see lizards and rabbits and deer, but then you\u2019re also like, wait, what is that? There\u2019s like these other kinds of animals walking around that are clearly not earth animals. And it is soon revealed that they are the remnants of the terraforming robots people brought to Europa. So those are still around and they have become kind of naturalized to the environment. I\u2019m going to be careful [00:50:00] and not say too much. Like I said, there isn\u2019t too much to spoil, but there are a couple of things to spoil. So I\u2019m going to be very judicious in what I say here.</p>\n\n\n\n<p class=\"wp-block-paragraph\">I\u2019m trying not to spoil anything at all because I think this is a great experience. It\u2019s also a short experience. I think I finished the entire game in three, 3.5 hours. So if I say even one thing, I mean that really like cuts into what the game can deliver. And I don\u2019t want to do that. That would be a grave injustice. I will say also that three, 3.5 hours is the perfect length for this game. It does what it wants to do. It gets in, it gets out. There\u2019s no fat, it just makes its point and gives you a great experience and then you\u2019re done. So I think three, 3.5 hours is the perfect length. But anyway, you quickly realize, okay, this is not quite Earth. It\u2019s like Earth Plus and things are slightly different. And so quickly you realize that your creator has left you some notes behind. Um, this is probably one of the only, like, really like, gamey, gamey aspects of this game. And ordinarily I would take issue with this, but in this particular case I did not. In fact, I know earlier in the podcast I said that I hate reading notes, and I do. I hate it with a passion, but this is one of the extremely rare instances where I actually did not mind reading the notes. And in fact, I looked forward to it because they were very well paced.</p>\n\n\n\n<p class=\"wp-block-paragraph\">They were set pretty far apart. You didn\u2019t read too many of them. Each one was pretty brief, and they told you exactly what they needed to tell you without getting too verbose, without getting lost in too many details, it just served to paint the picture in an appropriate way. And it also was thematically sensible because your creator, who is no longer around, needed to leave you information. And so he is writing these notes to you, knowing that you would find them, and he is telling you exactly what he wants you to know and what you should be thinking about as you journey your way to this island that\u2019s floating in the sky. I\u2019m not going to reveal much about that. And the gaming part about that is these notes are glowing yellow and they are like always in your direct path. And if if someone wanted to leave you a note, you wouldn\u2019t just like leave it on the ground like that. So you just have to let go of that. And I let go of it pretty quickly. I try to not let it bother me because it was kind of obviously very video gamey. But you know what? The the notes were great. They were often accompanied with drawings. So there\u2019s some visual there. It took you like two seconds to read the notes. And they just they really did serve to paint the picture of what was going on in Europa, which I really appreciated.</p>\n\n\n\n<p class=\"wp-block-paragraph\">This is, again, extremely rare that I like a note in a game, but these ones I did like a lot and I thought they worked really, really well. So you have this task you just have to get from where you are, which is on the ground in this little village to that island floating in the sky. And you just have to just get there, just, you know, point A to point B as as as the crow flies, basically. Which is ironic because at first you\u2019re walking, but you will soon notice you have this object on your back and it looks like an urn or a vase or something. Um, it\u2019s kind of a weird little object. And to be frank, I kind of wished it had like a rocket on it. Or maybe wings or something. It doesn\u2019t look like a flight device at all, but that\u2019s what it is. Your Android character. His name is Z, by the way. Uh, Z has this this thing on his back, this device, this backpack, and it is a flight device. It helps him hover when he is falling from high heights, and when it is properly charged with a lot of the ambient energy laying around in Europa\u2019s environment, it will help him fly. And that\u2019s kind of the main jam of this game. There\u2019s no combat at all in this game. Uh, there are enemies and I\u2019m not going to.</p>\n\n\n\n<p class=\"wp-block-paragraph\">I can\u2019t say that. I\u2019m not going to say that, but, um, there\u2019s a thing. There\u2019s a reason, there\u2019s a thing that happens. But basically, when you see enemies, you can turn them off. And that\u2019s not exactly correct. But I\u2019m not going to say anything else. You can do something to them to make them stop attacking you, so you can turn them off and get them to stop aggro, or you can just avoid them. But if you do get attacked by an enemy, the worst thing that happens is you just get knocked down and you get a little dizzy for a few seconds, and then you get back up. So there\u2019s no death, there\u2019s no damage, no health bar, nothing like that. No stamina, nothing like that. I will say, just as a brief criticism, there were a few times when there were a couple enemies on the screen and it was possible to not fully stun locked because I could always get out of it. But there were a few times when I\u2019m like, okay, I need you guys to stop hitting me. Really, really, like right now because I\u2019m getting kind of frustrated. But it was only just like a brief moment here or there. And most of the time, once I knew what to do, I could easily avoid it. But every once in a while I would slip up and the enemies would catch me, and then you would get kind of knocked around, but like, again, you didn\u2019t lose.</p>\n\n\n\n<p class=\"wp-block-paragraph\">You didn\u2019t get sent back to the start. There was no damage. You just had to wait until you had a moment to collect your wits about you and then pick yourself back up. So that\u2019s there\u2019s no combat, no fall damage, nothing like that. The only thing you really ever have to worry about is how much energy is left in your backpack. And as you play the game, you will get these little upgrades to the capacity of your backpack. There\u2019s the notes that you find. There is the backpack [00:55:00] upgrade, things that you find, and then there are these emeralds that you find. Those are really the only three things to worry about in this game. It\u2019s just like a vibes game and a travel game and an experience game. So they they smartly do not burden it with too much gamey shit. Like you don\u2019t have to collect a bunch of stuff. There\u2019s no golden rings, there\u2019s no points breakdown, there\u2019s no time trial crap or anything like that. It\u2019s just like play the game and experience it. And in a way, it really reminds me a lot of journey, honestly. And I say that in the best possible sense, I like journey. Not my favorite game in the world, but I think it\u2019s really a landmark title that a lot of people really respect and enjoy. And I did enjoy it for sure. And this really reminds me kind of of journey where you are going to a place the whole game is getting from point A to point B, and it\u2019s just kind of like what you do along the way.</p>\n\n\n\n<p class=\"wp-block-paragraph\">That kind of sets the tone for the whole experience. But you do get these upgrades, the backpack capacity, those are really the only ones that I ever spent time going after, because it was just so great to fly. When your backpack is full, you hit a button and then you just like, shoot up and get some vert and you just like kind of glide and then you just kind of peacefully fly around this environment and it\u2019s really, really well done. I think the two button control system for the flying works great. I think just being in the air feels great. Jumping feels great. When you\u2019re in the air, you can pick up more energy if you find some ambient energy laying around. Basically, just like kind of flying through a cloud of it, it recharges your backpack and you keep flying. And it\u2019s kind of like leapfrogging between energy points was really fun. Um, I\u2019m often just like getting to a high point and jumping off and gliding down was really fun. I mean, it\u2019s the central mechanic of Europa and I think it works really well. And it has to because it is a central mechanic. And they did. It\u2019s great. I thought it was just so peaceful and fun, and I really valued getting another backpack upgrade because I\u2019m like, oh great, that means I can fly longer because flying is awesome and I really want to do it some more.</p>\n\n\n\n<p class=\"wp-block-paragraph\">So that was really great. I like that a lot. The emeralds I didn\u2019t care about, I think there\u2019s 40in the game. I don\u2019t know if they do anything. I don\u2019t know if it\u2019s a different ending or what, but like I was just really vibing on this game. I just really had a great time and I didn\u2019t want to spend my time looking for upgrades or kind of poking around. I mean, they\u2019re just there to be found. If you really explore the environments thoroughly, you\u2019ll find them. I just didn\u2019t care about it, and I appreciate they they threw those in for people who just need to get a little bit more gameplay out of their game, but for me, they were unnecessary. So anyway, that\u2019s kind of the thing, like is you\u2019re just going from point A to point B, you go through these chapters, each chapter is like a big chunk of the land, and it\u2019s not just travel, right. So you\u2019re avoiding some of the things that are agro to you. But again, not a big threat. You\u2019re never going to die. And there\u2019s also like these little small scale puzzles along the way. And I, I say that they\u2019re puzzles and they are puzzles, but they are not meant to like, be, you know, real like stumpers.</p>\n\n\n\n<p class=\"wp-block-paragraph\">You know, they\u2019re not supposed to, like, break your brain. They never want you to go to YouTube to, like, look up a solution or anything like that. If you just get to a high point and look around, you will usually find all the pieces you need. Like sometimes you\u2019re activating three switches, or sometimes you\u2019re collecting three items, or sometimes you just need to get to a certain place and push a button or something like that. They\u2019re all very straightforward, but there are enough of the different types of puzzle that they never got too boring, and they were all simple enough to where it felt like you were doing something, because I think this game would suffer if you were just flying from point A to point B, I don\u2019t think that would be enough. So they smartly realized you needed just a little bit more content to keep you busy. But they were really, really smart and did not put combat in. That would have been a mistake. So you do these puzzles and sometimes you\u2019re in an area where they take away your flight power. Sometimes they do want you to fly. Sometimes you\u2019re just doing kind of like a look around your environment and spot something. Sometimes it\u2019s just pretty straightforward. I really appreciated the puzzles because they did make me feel like I was doing something worthwhile. But they were never, never too tough.</p>\n\n\n\n<p class=\"wp-block-paragraph\">They never got me stuck for any length of time. It was never anything that I felt like really was a barrier, or like the developers were really challenging me and I didn\u2019t want to be challenged. That\u2019s not really what this game is about. It\u2019s about just getting from point A to point B and doing something along the way. So I thought that worked really well. I think, um, overall, I just I really liked how you were just in this world learning the story, which I\u2019m not going to spoil, which I really liked a lot. I think the message and story of this game is good, and I don\u2019t want to say any more, but I thought it was very worthwhile. And when you get to the the final island, like when you get to where you\u2019re going, I thought that was really well done. Also, um, I don\u2019t know if I want to say that I shed a tear, but I definitely did feel some feelings at the end and I\u2019m like, okay, that was like like it meant something to me, right? Like it meant something that I got there and that I did this thing and that I, you know, I went on this journey with this little android and I just really enjoyed that time. It really it really kind of touched me in a way that very few games have touched me this year. So I like that quite a bit.</p>\n\n\n\n<p class=\"wp-block-paragraph\">Um, in terms of criticisms, not many, but I will say that I played this on the switch and I think, like many people are feeling these days, I think the switch is getting a little bit long in the tooth now. It ran fine. I don\u2019t I didn\u2019t have any major problems with it at all, but as I was playing this game, I just kept thinking to myself, man, the only thing I really want from this game is that it looked a little bit better. Now it looks fine, it played fine, I finished it, [01:00:00] it was fine. It was all good. But it was just like a little bit like a little bit washed out, a little bit fuzzy on some of the textures. And as I\u2019m playing this, I\u2019m like, oh, you know, I bet this would be gorgeous if I played it on like the PS5 or, you know, if I was a PC person, I would play this on PC because it\u2019s also on PC, PC and switch. And I\u2019m like, I bet this looks hella lot better on PC. And I went to YouTube and checked it out. And yep, it looks way better on PC. And just to be clear, this is not a triple A powerhouse or anything. I mean, it\u2019s like, you know, definitely like a smaller game, lower budget, smaller team, I\u2019m sure. But it just looked crisper and cleaner. And I just think that in an experience game like this, you know, part of the experience is the visuals.</p>\n\n\n\n<p class=\"wp-block-paragraph\">So it ran fine on switch. I\u2019m glad I played it. If that\u2019s the only way you can play it, absolutely play it like don\u2019t don\u2019t miss it if you\u2019re looking for a cozy, chill core game. But I just wanted it to be sharper and I really think that\u2019s the issue with the switch, not really with the game itself, because it did look much better on PC. But overall I really, really liked it a lot.</p>\n\n\n\n<p class=\"wp-block-paragraph\"><strong>Not only is it a heartfelt journey with something to say, but the mechanics were extremely well done and it\u2019s a treat to have an experience where there is no fail state, no damage and no guns.</strong> \u00a0</p>\n\n\n\n<p class=\"wp-block-paragraph\">I really appreciate, especially here in the year of our Lord 2024, that we can have several games. And in fact, I\u2019ve had several experiences this year where there is no combat where there is no fail state, where there\u2019s no damage, no guns. I think that\u2019s fine. I mean, I like guns just fine. I like shooting things just fine. And we\u2019ve done that a billion times. But like, I think it\u2019s okay to do something else. And it was extremely appropriate for this particular game because of the story, because of the themes that there was no violence. It was just about this android and about getting where he needed to go and what was waiting for him there. I thought it was just fantastic.</p>\n\n\n\n<p class=\"wp-block-paragraph\">I enjoyed this game from start to finish. I played it, I think, in maybe two sessions and I thought that was a great bite size little sit down. I wouldn\u2019t have wanted it to be longer, and I think it\u2019s exactly the right length that needs to be. And overall I just was really, really, really pleased with this game.</p>\n\n\n\n<p class=\"wp-block-paragraph\"><strong><em>Europa </em>will be a great experience for anyone who likes <em>Journey</em>, or for anybody who wants a non-violent experience that comes with a nicely told, heartfelt narrative.</strong></p>\n\n\n\n<p class=\"wp-block-paragraph\">And it\u2019s such a short play. It\u2019s an easy recommend. It\u2019s not a big time commitment. I think most people could probably finish it in a day if they wished. And it\u2019s not too often that I get little delicious little morsels like that or that are so easy to recommend. So overall, I love Europa. It\u2019s definitely one of my favorites this year.</p>\n\n\n\n<p class=\"wp-block-paragraph\"><strong><em>Europa </em>was a nice surprise out of nowhere, and I would absolutely recommend it.</strong></p>\n\n\n\n<p class=\"wp-block-paragraph\">Score: 8 out of 10</p>\n\n\n\n<hr>\n\n\n\n<p class=\"wp-block-paragraph\"><strong>Disclosures</strong>: The game was developed and published by <strong>Helder Pinto, Novadust Entertainment, </strong>and<strong> Chozabu (Alex PB)</strong>. It is currently available on <strong>PC </strong>and <strong>Switch</strong>. This copy of the game was obtained via <strong>publisher </strong>and reviewed on <strong>Switch</strong>. Approximately <strong>6 hours</strong> were devoted to the game, and the game <strong>was completed</strong>. There are <strong>no multiplayer modes</strong>.</p>\n\n\n\n<p class=\"wp-block-paragraph\"><strong>Parents: </strong>This game has an <a href=\"http://esrb.org/\">ESRB</a> rating of <strong>E</strong> for <strong>Mild Fantasy Violence</strong>. There is no combat in the game, but the main character does have to dodge energy blasts from hostile turrets and mechanical birds that try to knock him out of the sky.</p>\n\n\n\n<p class=\"wp-block-paragraph\"><strong>Colorblind Modes</strong>: There are\u00a0<strong>no colorblind options</strong>.</p>\n\n\n\n<p class=\"wp-block-paragraph\"><strong>Deaf and Hard of Hearing Gamers</strong>: There are subtitles in the game, and no audio cues are required for gameplay. The subtitles <strong>can be resized</strong>. The game is <strong>fully accessible</strong>.</p>\n\n\n\n<a href=\"https://gamecritics.com/wp-content/uploads/2024/12/Sequence-01.00_00_00_00.Still001.jpg\"></a>\n\n\n\n<p class=\"wp-block-paragraph\"><strong>Remappable controls</strong>: Controls are <strong>not remappable</strong>. There is no controller map available. The left stick moves, the right stick can manipulate the camera. The main actions are Jump and Glide, and they\u2019re performed with a combination of the face buttons and shoulder/bumper buttons.  </p>", "date": "2024-12-08", "url": "https://gamecritics.com/brad-gallaway/svg-review-europa/"}, {"title": "So Videogames Episode 417", "desc": "<a href=\"https://gamecritics.com/wp-content/uploads/2022/04/SVG-Twitter.jpg\"></a>\n\n\n\n<p class=\"wp-block-paragraph\">In this Very Special Episode, Brad is joined for the entire episode by his wife Gina!</p>\n\n\n\n<p class=\"wp-block-paragraph\">Heads up, they had to share a mic in this impromptu recording, so the audio levels are a bit of a mess.<br>Apologies!</p>\n\n\n\n<p class=\"wp-block-paragraph\">But hopefully you\u2019ll still be able to enjoy.</p>\n\n\n\n<p class=\"wp-block-paragraph\">Games covered:<br>Wild Bastards<br>Kunitsu-Gami: Path of the Goddess<br>Nikoderiko<br>Keeper\u2019s Toll<br>God of War<br>Flintlock: the Siege of Dawn</p>\n\n\n\n<p class=\"wp-block-paragraph\">\u2026And more!!</p>\n\n\n\n<p class=\"wp-block-paragraph\"></p>\n\n\n\n<p class=\"wp-block-paragraph\">You can also hear the show on <a href=\"https://podcasts.apple.com/us/podcast/the-so-videogames-podcast/id1168917623\">iTunes</a> and <a href=\"https://open.spot 1", "desc": "<a href=\"https://gamecritics.com/wp-content/uploads/2023/09/SVG-Twitter.jpg\"></a>\n\n\n\n<p class=\"wp-block-paragraph\"><strong>This is a transcript excerpt covering the score awarded to\u00a0<em>Mortal Kombat 1</em>\u00a0on the So Videogames podcast,\u00a0</strong><a href=\"https://gamecritics.com/brad-gallaway/svg-375-chicken-wang-ftw/\">episode 375: Chicken Wang FTW</a></p>\n\n\n\n<hr>\n\n\n\n<p class=\"wp-block-paragraph\"><strong>BRAD:</strong> The last thing before we get out of housekeeping is I want to circle back to Mortal Kombat one. We talked about it a while ago, uh, last year. I feel like it was like <strong>[00:20:00]</strong> October or something like that, and I started it. I got a pretty good chunk into the story mode, and then I got distracted. You know, Q4 happened, it was like a million games a minute. We had lots of stuff prepping for game of the year and everything and everything, and it fell through the cracks. And I first, I want to apologize to everybody at the Mortal Kombat team and to Mortal Kombat PR. I meant to cover it in full a while ago, and I just I just lost it, man. I just, I, you know, I just lost track of it and I, I realized a couple days ago and I felt super bad about that. So I do want to apologize to everybody first.</p>\n\n\n\n<p class=\"wp-block-paragraph\">So, let me just now circle back to Mortal Kombat with our official So video Games review. So I talked about it before, I, I like the Mortal Kombat series a lot. I think that ever since Mortal Kombat nine, um, they have just been better and better and better and better. The graphics keep getting better, the controls keep getting better. And the story, the story itself is amazing. Um, you know what the Mortal Kombat Story team did with nine, like, really basically revolutionized what we expect from fighting games they crafted. Like, I think one of the best story campaigns that\u2019s ever been in a fighting game, and they just keep iterating on it time after time in Mortal Kombat one, just for people who don\u2019t remember, uh, this is one where they kind of like reboot the whole thing. Um, in the last Mortal Kombat, they kind of brought everything to a head. It was like this continuing storyline over a couple games. They had, like this cosmic battle with somebody who controlled time and space, and it was just like this giant apocalyptic fight. And I was thinking to my head, where are you going to go from this? Because it\u2019s already you\u2019re like on a universe scale, like there\u2019s nothing left to do, you know? But they pulled it off again. They kind of did like a a timeline, multiverse revamp. Uh, I guess multiverses are very popular in media right now. And so they kind of, uh, did this multiverse thing where they opened it up to different dimensions and there\u2019s like lots of possibilities.</p>\n\n\n\n<p class=\"wp-block-paragraph\">I don\u2019t want to spoil any of the funny moments, but there are lots of crossovers and lots of mash ups with characters where you see like an alternate timeline Liu Kang, or like an alternate timeline Molina and you\u2019re like, oh my God, what\u2019s going on with that person? Um, and it\u2019s just it\u2019s just really funny and interesting. I think that was great. In terms of the combat, I think it\u2019s super tight. I think it feels good to play. I think the moves have been revamped in a great way. There\u2019s also a new system called the Cameo System, where these characters are not in the game officially, but you can still see them. They\u2019ll show up as like a helper character. So like in the middle of a battle, you hit a button and like somebody who you cannot choose to use as a fighter but will show up in like, you know, like Kano will show up and like, shoot somebody\u2019s laser eye or, or Sonya will show up and kick somebody. So you\u2019ll still see her in the game and she\u2019ll still be around. But I mean, the roster is already pretty big. They can\u2019t carry forward like 150 characters every single game, right? There\u2019s no way to do that. So I think that\u2019s totally a fun system and I enjoyed that. After you beat the campaign, there\u2019s also a new system called the Invasion System, where they\u2019re rolling out these chunks of story on a seasonal basis.</p>\n\n\n\n<p class=\"wp-block-paragraph\">The first one is like your inside Johnny Cage\u2019s mansion. You kind of go through the rooms and each room is a different challenge. Now I\u2019m in the second chunk where I\u2019m in like Barakas area. It\u2019s like a desert area, so you get more challenges, unlock some stuff. I think that\u2019s a really interesting mode. I think that\u2019s fun. Looking forward to that. And I think it\u2019s fine that they got rid of some of the other stuff like the, the towers and some of the older the crypt and everything. I was like, okay, that was they\u2019ve done that all like multiple times. And I think it\u2019s fine to like let go of that and just try something new. So that\u2019s all good. I think overall it\u2019s great. I do also want to call out the character design. Um, they did something kind of different here where it\u2019s like more realistic. It\u2019s like a good blend between a realistic looking character model and slightly fantastical for video gaming. But they haven\u2019t leaned into the fantastic very much. And I know some people are mad about that because honestly, uh, the boobs and the butts are not as big as they used to be. They\u2019re not, as you know, they\u2019re not as revealing as they used to be. And I think that\u2019s fine. Like, I mean, you\u2019ve got a whole internet full of porn if you need to get that stuff, that\u2019s cool. This game doesn\u2019t need to be all about just like a meat market, you know, Teddy show.</p>\n\n\n\n<p class=\"wp-block-paragraph\">So I think it\u2019s fine that they\u2019ve scaled things back. Um, I do like the character design overall, and I think they\u2019ve got some neat characters there that are that are fun to use. So enjoying that. Uh, it\u2019s all it\u2019s all good. What is the downside of this game? I think the downside is, number one, I don\u2019t like the online store. Um, I feel like there\u2019s like stuff to get to customize your character, a lot of cosmetic stuff, but I feel like it\u2019s all kind of like wrapped up in the store and it\u2019s not apparent, like what\u2019s in there. It seems to rotate on a basis and like, I don\u2019t really have anything to look forward to unlocking. I kind of just like check in in the store and see what they\u2019ve got and kind of bounce when there\u2019s nothing good. And I, I would much rather have something to work towards, or maybe the ability to choose what reward I want, or something that would give me something to keep playing the game after I finished the story mode. And if I don\u2019t want to play online or something like that. Um, so I don\u2019t like the online aspect of it. I don\u2019t like the the lack of rewards that are obvious. I\u2019m not a fan of that. Also, when you\u2019re in the invasions mode, they kind of. I overcomplicated a bit. Like you can take your character through this and they\u2019ve got like elemental affinities.</p>\n\n\n\n<p class=\"wp-block-paragraph\">Like I was playing with reptile this morning who was a really cool, um, you know, human ninja, but he turns into a giant lizard and like, he\u2019s like an ice character. And I\u2019m like, why is he ice like he does? That doesn\u2019t make sense. It seems like they randomly assigned affinities, <strong>[00:25:00]</strong> like someone\u2019s fire and someone\u2019s, you know, acid and someone\u2019s steel or whatever. I don\u2019t want to mess with that. I don\u2019t I don\u2019t want to worry about who\u2019s strong. You know, fire beats wood, wood beats water. Water beats fire. Yeah. Like I don\u2019t want to worry about that stuff. And there\u2019s also like, medallions where you, like, have extra powers. You can, like, upgrade them. And I\u2019m like, this all feels like just nonsense then. And trifle that I don\u2019t want to mess with. So I don\u2019t, don\u2019t care for that too much. Um, but overall, I mean, it\u2019s hard to fault Mortal Kombat because they\u2019ve raised the bar, they have raised the bar, they continue to raise the bar, and even even an okay, Mortal Kombat game in modern times is way better than most other, uh, fighting games. And this one is pretty good. I had a great time with the story mode, had a great time, um, just playing, uh, in the practice mode and the versus mode and stuff. So I think it\u2019s a really, really solid game. I really enjoy it a lot. And I\u2019m going to give it an official SVG score of a solid eight out of ten.</p>\n\n\n\n<p class=\"wp-block-paragraph\"><strong>CARLOS: </strong>There you go.</p>\n\n\n\n<p class=\"wp-block-paragraph\"><strong>BRAD: </strong>You cannot go wrong with Mortal Kombat.</p>\n\n\n\n<p class=\"wp-block-paragraph\"><strong>CARLOS: </strong>Pretty solid score.</p>\n\n\n\n<p class=\"wp-block-paragraph\"><strong>BRAD: </strong>Yeah, it definitely is. So good times. And again, for me the high point is the story mode. Lots of laughs, lots of funny moments, lots of cool fights. I just I love their story modes. I live for the Mortal Kombat story mode, so good stuff. Congratulations, Mortal Kombat eight out of ten and once again, please accept my apologies for not getting to it sooner. I am sorry about that.</p>\n\n\n\n<p class=\"wp-block-paragraph\"><strong>CARLOS: </strong>Check it out.</p>\n\n\n\n<p class=\"wp-block-paragraph\"><strong>Score: 8 out of 10</strong></p>\n\n\n\n<hr>\n\n\n\n<p class=\"wp-block-paragraph\"><strong>Disclosures:</strong> This game is developed by <strong>NetherRealm Studios </strong>and published by <strong>WB Interactive. </strong>It is currently available on <strong>PC, PS5, XBX/S </strong>and<strong> Switch.</strong> This copy of the game was obtained via <strong>publisher</strong> and reviewed on the <strong>PS5</strong>. Approximately <strong>12 hours of play</strong> were devoted to the single-player mode, and <strong>the game was completed</strong>. <strong>1 hour of play</strong> was spent in multiplayer modes.</p>\n\n\n\n<p class=\"wp-block-paragraph\"><strong>Parents:</strong> According to the <a href=\"http://www.esrb.org/\" target=\"_blank\" rel=\"noreferrer noopener\"><strong>ESRB</strong></a>, this game is rated <strong>M</strong> and contains <strong>Blood and Gore, Intense Violence, Strong Language</strong>. The official descriptions states: <em>This is a fighting game in which players engage in one-on-one battles against characters from the Mortal Kombat universe. Players punch, kick, throw, and use special attacks (e.g., guns; blasts of fire, ice, or lightning; bladed weapons) to drain opponents\u2019 life meters. Battles are highlighted by screams of pain, realistic gunfire, and exaggerated impact sounds; large blood-splatter effects occur frequently. Some attacks are depicted with slow-motion x-ray views of characters\u2019 bones shattering. Each character can perform various finishing moves (Fatalities, Brutalities) after an opponent is defeated; these over-the-top moves can result in characters being dismembered and graphically mutilated. Some of these moves expose organs (e.g., a character cut in half with visible entrails, a character\u2019s chest torn open with heart visible). The words \u201cf**k,\u201d \u201csh*t,\u201d and \u201ca*shole\u201d appear in the game.</em></p>\n\n\n\n<p class=\"wp-block-paragraph\"><strong>Colorblind Modes: </strong>There <strong>are</strong> <strong>colorblind modes</strong> available in the options.</p>\n\n\n\n<p class=\"wp-block-paragraph\"><strong>Deaf & Hard of Hearing Gamers:</strong> Subtitles are available for all spoken lines, but the text is not able to be resized or altered. There are several settings relating to the audio including options to make the game accessible to visually impaired players. Overall, I found that the game was quite playable without audio cues, as every special move is accompanied by a visual cue. In my view, this game is <strong>fully accessible</strong>. </p>\n\n\n\n<a href=\"https://gamecritics.com/wp-content/uploads/2024/02/SHARE_20240216_1049232.jpeg\"></a>\n\n\n\n<a href=\"https://gamecritics.com/wp-content/uploads/2024/02/SHARE_20240216_1049221.jpeg\"></a>\n\n\n\n<a href=\"https://gamecritics.com/wp-content/uploads/2024/02/SHARE_20240216_1049210.jpeg\"></a>\n\n\n\n<p class=\"wp-block-paragraph\"><strong>Remappable Controls: </strong>Yes, this game offers <strong>fully remappable</strong> controls.</p>\n\n\n\n<a href=\"https://gamecritics.com/wp-content/uploads/2024/02/SHARE_20240216_1049253.jpeg\"></a>", "date": "2024-02-15", "url": "https://gamecritics.com/brad-gallaway/svg-review-mortal-kombat-1/"}, {"title": "SVG 375: Chicken Wang FTW", "desc": "<a href=\"https://gamecritics.com/wp-content/uploads/2022/04/SVG-Twitter.jpg\"></a>\n\n\n\n<p class=\"wp-block-paragraph\">In this episode, Carlos & Brad cover:</p>\n\n\n\n<p class=\"wp-block-paragraph\">Hauntii<br>Airhead<br>Skull and Bones (beta)<br>Helldivers 2<br>Suicide Squad<br>Roadwarden</p>\n\n\n\n<p class=\"wp-block-paragraph\">\u2026And more!</p>\n\n\n\n<p class=\"wp-block-paragraph\"></p>\n\n\n\n<p class=\"wp-block-paragraph\">You can also hear the show on <a href=\"https://podcasts.apple.com/us/podcast/the-so-videogames-podcast/id1168917623\">iTunes</a> and <a href=\"https://open.spotify.com/show/3PNLEo7I1ap7GeeNxOA4Kq\">Spotify</a>! </p>\n\n\n\n<p class=\"has-text-align-center wp-block-paragraph\"><strong>Please send feedback and mailbag questions to SoVideogamesPODCAST (at) gmail (dot) com, or post them in the comments section below. Thanks!</strong></p>", "date": "2024-02-12", "url": "https://gamecritics.com/brad-gallaway/svg-375-chicken-wang-ftw/"}, {"title": "SVG Special Episode: Xbox Rumors!", "de gn-center wp-block-paragraph\"><strong>Please send feedback and mailbag questions to SoVideogamesPODCAST (at) gmail (dot) com, or post them in the comments section below. Thanks!</strong></p>", "date": "2024-01-21", "url": "https://gamecritics.com/brad-gallaway/svg-372/"}, {"title": "SVG 371: Ancient Men", "desc": "<a href=\"https://gamecritics.com/wp-content/uploads/2022/04/SVG-Twitter.jpg\"></a>\n\n\n\n<p class=\"wp-block-paragraph\">In this emotionally-charged episode (caution: ranting ahead!!!) Carlos and Brad cover:</p>\n\n\n\n<p class=\"wp-block-paragraph\">Prince of Persia: The Lost Crown (demo)<br>Granblue Fantasy Relink<br>War Hospital<br>Sleeping Dogs<br>Frostpunk: The Last Autumn<br>Path of Exile<br>The Division 2</p>\n\n\n\n<p class=\"wp-block-paragraph\">\u2026And more!</p>\n\n\n\n<p class=\"wp-block-paragraph\"></p>\n\n\n\n<p class=\"wp-block-paragraph\">You can also hear the show on <a href=\"https://podcasts.apple.com/us/podcast/the-so-videogames-podcast/id1168917623\">iTunes</a> and <a href=\"https://open.spotify.com/show/3PNLEo7I1ap7GeeNxOA4Kq\">Spotify</a>! </p>\n\n\n\n<p class=\"has-text-align-center wp-block-paragraph\"><strong>Please send feedback and mailbag questions to SoVideogamesPODCAST (at) gmail (dot) com, or post them in the comments section below. Thanks!</strong></p>", "date": "2024-01-14", "url": "https://gamecritics.com/brad-gallaway/svg-371-ancient-men/"}, {"title": "SVG 370: Hard Talk", "desc": "<a href=\"https://gamecritics.com/wp-content/uploads/2022/04/SVG-Twitter.jpg\"></a>\n\n\n\n<p class=\"wp-block-paragraph\">In the first episode of 2024, Carlos & Brad cover:</p>\n\n\n\n<p class=\"wp-block-paragraph\">Skull Island: Rise of Kong<br>There Is No Light<br>Laika: Aged Through Blood<br>Rough Justice: \u201884<br>AO Tennis 2<br>Vampire Survivors: Among Us DLC<br>Cat Quest 2<br>The Division 2</p>\n\n\n\n<p class=\"wp-block-paragraph\">\u2026And more!</p>\n\n\n\n<p class=\"wp-block-paragraph\"></p>\n\n\n\n<p class=\"wp-block-paragraph\">You can also hear the show on <a href=\"https://podcasts.apple.com/us/podcast/the-so-videogames-podcast/id1168917623\">iTunes</a> and <a href=\"https://open.spotify.com/show/3PNLEo7I1ap7GeeNxOA4Kq\">Spotify</a>! </p>\n\n\n\n<p class=\"has-text-align-center wp-block-paragraph\"><strong>Please send feedback and mailbag questions to SoVideogamesPODCAST (at) gmail (dot) com, or post them in the comments section below. Thanks!</strong></p>", "date": "2024-01-07", "url": "https://gamecritics.com/brad-gallaway/svg-370-hard-talk/"}, {"title": "SVG 369: GOTY! Top 10 of 2023!", "desc": "<a href=\"https://gamecritics.com/wp-content/uploads/2022/04/SVG-Twitter.jpg\"></a>\n\n\n\n<p class=\"wp-block-paragraph\">This is it, folks!</p>\n\n\n\n<p class=\"wp-block-paragraph\">The So Videogames 2023 look-back, retrospective and wrapup!</p>\n\n\n\n<p class=\"wp-block-paragraph\">Carlos and Brad take the next two and a half hours to talk about the year\u2019s disappointments, honorable mentions, games they didn\u2019t get to, and of course, their top ten titles of 2023!</p>\n\n\n\n<p class=\"wp-block-paragraph\">After they run through the lists, they close out the show with an avalanche of listener picks and pans!</p>\n\n\n\n<p class=\"wp-block-paragraph\">Come join us as we close out the year past and welcome the year to come!!</p>\n\n\n\n<p class=\"wp-block-paragraph\"></p>\n\n\n\n<p class=\"wp-block-paragraph\">You can also hear the show on <a href=\"https://podcasts.apple.com/us/podcast/the-so-videogames-podcast/id1168917623\">iTunes</a> and <a href=\"https://open.spotify.com/show/3PNLEo7I1ap7GeeNxOA4Kq\">Spotify</a>! </p>\n\n\n\n<p class=\"has-text-align-center wp-block-paragraph\"><strong>Please send feedback and mailbag questions to SoVideogamesPODCAST (at) gmail (dot) com, or post them in the comments section below. Thanks!</strong></p>", "date": "2023-12-30", "url": "https://gamecritics.com/brad-gallaway/svg-369-goty-top-10-of-2023/"}, {"title": "SVG 368: The Pod B4 XMAS", "desc": "<a href=\"https://gamecritics.com/wp-content/uploads/2022/04/SVG-Twitter.jpg\"></a>\n\n\n\n<p class=\"wp-block-paragraph\">In this special pre-holiday episode, Carlos is away on assignment so Brad\u2019s holding it down on his own with some terrible poetry and an abbreviated assortment of games, featuring:</p>\n\n\n\n<p class=\"wp-block-paragraph\"></p>\n\n\n\n<p class=\"wp-block-paragraph\">Terra Nil</p>\n\n\n\n<p class=\"wp-block-paragraph\">Long Gone Days</p>\n\n\n\n<p class=\"wp-block-paragraph\">Warhammer 40,000: Rogue Trader</p>\n\n\n\n<p class=\"wp-block-paragraph\">And more! (But not much more!)</p>\n\n\n\n<p class=\"wp-block-paragraph\"></p>\n\n\n\n<p class=\"wp-block-paragraph\">And remember, join us next week for the 2023 GOTY extravaganza in episode 369! NICE!!</p>\n\n\n\n<p class=\"wp-block-paragraph\"></p>\n\n\n\n<p class=\"wp-block-paragraph\">You can also hear the show on <a href=\"https://podcasts.apple.com/us/podcast/the-so-videogames-podcast/id1168917623\">iTunes</a> and <a href=\"https://open.spotify.com/show/3PNLEo7I1ap7GeeNxOA4Kq\">Spotify</a>! </p>\n\n\n\n<p class=\"has-text-align-center wp-block-paragraph\"><strong>Please send feedback and mailbag questions to SoVideogamesPODCAST (at) gmail (dot) com, or post them in the comments section below. Thanks!</strong></p>", "date": "2023-12-24", "url": "https://gamecritics.com/brad-gallaway/svg-368-the-pod-b4-xmas/"}, {"title": "SVG 367: Grandma\u2019s Black Arts", "desc": "<a href=\"https://gamecritics.com/wp-content/uploads/2022/04/SVG-Twitter.jpg\"></a>\n\n\n\n<p class=\"wp-block-paragraph\">In this episode, Carlos & Brad cover:</p>\n\n\n\n<p class=\"wp-block-paragraph\">Tekken 8 (demo)<br>GranBlue Versus (demo)<br>While the Iron\u2019s Hot<br>Cookie Cutter<br>Wall World<br>Stray Souls<br>Custom Mech Wars <br>Lies of P<br>Goat Simulator 3<br>Ebenezer and the Invisible World</p>\n\n\n\n<p class=\"wp-block-paragraph\">\u2026And more!</p>\n\n\n\n<p class=\"wp-block-paragraph\"></p>\n\n\n\n paragraph\"></p>\n\n\n\n<p class=\"wp-block-paragraph\">You can also hear the show on <a href=\"https://podcasts.apple.com/us/podcast/the-so-videogames-podcast/id1168917623\">iTunes</a> and <a href=\"https://open.spotify.com/show/3PNLEo7I1ap7GeeNxOA4Kq\">Spotify</a>! </p>\n\n\n\n<p class=\"has-text-align-center wp-block-paragraph\"><strong>Please send feedback and mailbag questions to SoVideogamesPODCAST (at) gmail (dot) com, or post them in the comments section below. Thanks!</strong></p>", "date": "2023-10-07", "url": "https://gamecritics.com/brad-gallaway/svg-357-the-crashcast/"}, {"title": "SVG 356: Solo Nova", "desc": "<a href=\"https://gamecritics.com/wp-content/uploads/2022/04/SVG-Twitter.jpg\"></a>\n\n\n\n<p class=\"wp-block-paragraph\">In this solo episode, Brad covers:</p>\n\n\n\n<p class=\"wp-block-paragraph\">Shuyan Saga<br>Silent Hope<br>The Many pieces of Mr. Coo<br>Super Adventure Hand<br>Cyberpunk 2077: 2.0</p>\n\n\n\n<p class=\"wp-block-paragraph\">\u2026And more!</p>\n\n\n\n<p class=\"wp-block-paragraph\"></p>\n\n\n\n<p class=\"wp-block-paragraph\">You can also hear the show on <a href=\"https://podcasts.apple.com/us/podcast/the-so-videogames-podcast/id1168917623\">iTunes</a> and <a href=\"https://open.spotify.com/show/3PNLEo7I1ap7GeeNxOA4Kq\">Spotify</a>! </p>\n\n\n\n<p class=\"has-text-align-center wp-block-paragraph\"><strong>Please send feedback and mailbag questions to SoVideogamesPODCAST (at) gmail (dot) com, or post them in the comments section below. Thanks!</strong></p>", "date": "2023-10-01", "url": "https://gamecritics.com/brad-gallaway/svg-356-solo-nova/"}, {"title": "SVG 355: Chia Seeds", "desc": "<a href=\"https://gamecritics.com/wp-content/uploads/2022/04/SVG-Twitter.jpg\"></a>\n\n\n\n<p class=\"wp-block-paragraph\">In this episode, Carlos & Brad cover:</p>\n\n\n\n<p class=\"wp-block-paragraph\">Days of Doom<br>Mineko\u2019s Night Market<br>Gloomhaven<br>Star Ocean: First & Second Departure<br>Lies of P SEPT 14<br>CYBERPUNK 2077: 2.0
