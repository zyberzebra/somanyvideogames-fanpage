lass=\"wp-block-paragraph\">-Goodbye, Volcano High (review score)<br>-Little Kitty, Big City<br>-Night at the Gates of Hell<br>-Virgo vs the Zodiac<br>-Sea of Stars<br>-Chants of Sennaar<br>-Oceanhorn 2<br>-Red Dead Redemption (PS4)<br>-Last Epoch</p>\n\n\n\n<p class=\"wp-block-paragraph\">\u2026And more!</p>\n\n\n\n<p class=\"wp-block-paragraph\">Please leave us a review, give us a RT or tell a friend!</p>\n\n\n\n<p class=\"wp-block-paragraph\"></p>\n\n\n\n<p class=\"wp-block-paragraph\">You can also hear the show on <a href=\"https://podcasts.apple.com/us/podcast/the-so-videogames-podcast/id1168917623\">iTunes</a> and <a href=\"https://open.spotify.com/show/3PNLEo7I1ap7GeeNxOA4Kq\">Spotify</a>! </p>\n\n\n\n<p class=\"has-text-align-center wp-block-paragraph\"><strong>Please send feedback and mailbag questions to SoVideogamesPODCAST (at) gmail (dot) com, or post them in the comments section below. Thanks!</strong></p>", "date": "2023-09-11", "url": "https://gamecritics.com/brad-gallaway/svg-353-wendys-chicken-sandwich-8-5-10/"}, {"title": "SVG 352: Support SAG-AFTRA", "desc": "<a href=\"https://gamecritics.com/wp-content/uploads/2022/04/SVG-Twitter.jpg\"></a>\n\n\n\n<p class=\"wp-block-paragraph\">In this episode Brad holds it down while Carlos is away, and he covers:</p>\n\n\n\n<p class=\"wp-block-paragraph\">Black Skylands (official review)<br>Heretic\u2019s Fork (demo)<br>The Cosmic Wheel Sisterhood<br>Punch Club 2: Fast Forward<br>Goodbye, Volcano High</p>\n\n\n\n<p class=\"wp-block-paragraph\">\u2026And more!</p>\n\n\n\n<p class=\"wp-block-paragraph\"></p>\n\n\n\n<p class=\"wp-block-paragraph\">You can also hear the show on <a href=\"https://podcasts.apple.com/us/podcast/the-so-videogames-podcast/id1168917623\">iTunes</a> and <a href=\"https://open.spotify.com/show/3PNLEo7I1ap7GeeNxOA4Kq\">Spotify</a>! </p>\n\n\n\n<p class=\"has-text-align-center wp-block-paragraph\"><strong>Please send feedback and mailbag questions to SoVideogamesPODCAST (at) gmail (dot) com, or post them in the comments section below. Thanks!</strong></p>", "date": "2023-09-02", "url": "https://gamecritics.com/brad-gallaway/svg-352-support-sag-aftra/"}, {"title": "SVG Special: Starfield At 5 & 30 Hours", "desc": "<a href=\"https://gamecritics.com/wp-content/uploads/2022/04/SVG-Twitter.jpg\"></a>\n\n\n\n<p class=\"wp-block-paragraph\">This special unstructured, casual episode is broken up into two parts! </p>\n\n\n\n<p class=\"wp-block-paragraph\"><strong>PART 1: </strong>Carlos & Brad spend share their <em>first impressions</em> after spending five hours with the game on the day code was available, two weeks before embargo. </p>\n\n\n\n<p class=\"wp-block-paragraph\"><strong>PART 2:</strong> Recorded two weeks after Part 1. Brad\u2019s bored AF with <em>Starfield</em>, but Carlos kept plowing ahead and rolled credits after around 30-ish hours. They share more thoughts and impressions, and the episode ends with Carlos awarding his official score. </p>\n\n\n\n<p class=\"wp-block-paragraph\"></p>\n\n\n\n<p class=\"wp-block-paragraph\"></p>\n\n\n\n<p class=\"wp-block-paragraph\">You can also hear the show on <a href=\"https://podcasts.apple.com/us/podcast/the-so-videogames-podcast/id1168917623\">iTunes</a> and <a href=\"https://open.spotify.com/show/3PNLEo7I1ap7GeeNxOA4Kq\">Spotify</a>! </p>\n\n\n\n<p class=\"has-text-align-center wp-block-paragraph\"><strong>Please send feedback and mailbag questions to SoVideogamesPODCAST (at) gmail (dot) com, or post them in the comments section below. Thanks!</strong></p>\n\n\n\n<hr>\n\n\n\n<p class=\"wp-block-paragraph\"><strong>Below is the transcript covering the full Starfield episode and score awarded</strong>.</p>\n\n\n\n<p class=\"has-text-align-center wp-block-paragraph\">*</p>\n\n\n\n<p class=\"wp-block-paragraph\"><strong>Brad: </strong>Carlos and I both got Starfield today. I downloaded it this morning. He downloaded it like five minutes after I did. I\u2019ve put about five hours into it. But this is like day one. This is the first day anybody had code. Yeah, so we\u2019re just talking about it now. And the embargo is not for another little bit more than two weeks away.</p>\n\n\n\n<p class=\"wp-block-paragraph\"><strong>Carlos: </strong>It\u2019s kind of cool, this kind of audio where it\u2019s like behind the scenes and also like as soon as we play something, this.</p>\n\n\n\n<p class=\"wp-block-paragraph\"><strong>Brad: </strong>Is the freshest. Like it\u2019s almost as if we are recording in real time. That\u2019s how close we are. Yeah. To playing this brand new code that so few people have access to right now.</p>\n\n\n\n<p class=\"wp-block-paragraph\"><strong>Carlos: </strong>It\u2019s so funny. So we both played about 4 to 5 hours probably.</p>\n\n\n\n<p class=\"wp-block-paragraph\"><strong>Brad: </strong>I was pretty close to five hours if not a little bit longer than that.</p>\n\n\n\n<p class=\"wp-block-paragraph\"><strong>Carlos: </strong>Okay. Yeah, I\u2019m going to talk first because I.</p>\n\n\n\n<p class=\"wp-block-paragraph\"><strong>Brad: </strong>Know you must you must talk first.</p>\n\n\n\n<p class=\"wp-block-paragraph\"><strong>Carlos: </strong>I have a feeling it\u2019s negative. You already know.</p>\n\n\n\n<p class=\"wp-block-paragraph\"><strong>Brad: </strong>What I\u2019m going to say. Go ahead. Go ahead.</p>\n\n\n\n<p class=\"wp-block-paragraph\"><strong>Carlos: </strong>It\u2019s going [00:01:00] to be. I can\u2019t believe I mean, I can believe, but yeah. So in general, I think, okay, what do I think? The first thing I think is, is a Bethesda game. It\u2019s Skyrim in space. You pick up a bunch of shit, you hit people, they die, and then you get experience points and stuff like that. Like, that\u2019s at a core. That\u2019s what it is. Yes. Okay.</p>\n\n\n\n<p class=\"wp-block-paragraph\"><strong>Brad: </strong>Well, interestingly, you said hit people, though. This is going to be a really scattered casual conversation because we\u2019re not doing an actual podcast section. But just out of curiosity, are you playing a melee character? You must be right. Of course. Of course you are. Of course you are. Okay.</p>\n\n\n\n<p class=\"wp-block-paragraph\"><strong>Carlos: </strong>So and here\u2019s the funny thing. Well, it gets to that comment in a second. Let me just do my overview. And because I just want to tell you, Brad, because we\u2019re not telling anybody else, this might never go. You might not.</p>\n\n\n\n<p class=\"wp-block-paragraph\"><strong>Brad: </strong>Maybe it will. But if we do. Yeah, interesting.</p>\n\n\n\n<p class=\"wp-block-paragraph\"><strong>Carlos: </strong>But what I want to say is that I expected it to be that, right? Like, whatever it is, I kind of expected it to be that the things that were unexpected, good and bad. One is the frame [00:02:00] rate is great. Like for me, maybe you\u2019re going to say like it\u2019s garbage.</p>\n\n\n\n<p class=\"wp-block-paragraph\"><strong>Brad: </strong>And you\u2019re on Xbox X, I\u2019m on Xbox X, right?</p>\n\n\n\n<p class=\"wp-block-paragraph\"><strong>Carlos: </strong>I\u2019m on Xbox. And I was giving it so much shit about it. Was it going to be in 60 and yet it\u2019s going to be 60 on a PC? Yes. And I think that\u2019s crazy. But I move around a lot with the style of combat. I do.</p>\n\n\n\n<p class=\"wp-block-paragraph\"><strong>Brad: </strong>So do I. I am also melee. Okay.</p>\n\n\n\n<p class=\"wp-block-paragraph\"><strong>Carlos: </strong>Okay, cool.</p>\n\n\n\n<p class=\"wp-block-paragraph\"><strong>Brad: </strong>Which is wild. Dude, for a sci fi game like this.</p>\n\n\n\n<p class=\"wp-block-paragraph\"><strong>Carlos: </strong>Yeah. But I always knew I was going to be.</p>\n\n\n\n<p class=\"wp-block-paragraph\"><strong>Brad: </strong>I did not know that I was going to be.</p>\n\n\n\n<p class=\"wp-block-paragraph\"><strong>Carlos: </strong>Oh, yeah, you converted.</p>\n\n\n\n<p class=\"wp-block-paragraph\"><strong>Brad: </strong>I converted it for this game. I did.</p>\n\n\n\n<p class=\"wp-block-paragraph\"><strong>Carlos: </strong>But what I\u2019m saying is the frame rate didn\u2019t bother me, like. Right. It didn\u2019t bother you, did it?</p>\n\n\n\n<p class=\"wp-block-paragraph\"><strong>Brad: </strong>No, no, No complaints about that.</p>\n\n\n\n<p class=\"wp-block-paragraph\"><strong>Carlos: </strong>Which is crazy though, because I really thought that was going to be a sticking point for me, like because I\u2019ve seen 30. But they did some magic wizardry, I think, to make it look really snappy. When Todd Hollywood said that in an interview, I thought that was just bullshit, but he wasn\u2019t saying bullshit. It is snappy when you move.</p>\n\n\n\n<p class=\"wp-block-paragraph\"><strong>Brad: </strong>I think I figured out his magic, but go ahead.</p>\n\n\n\n<p class=\"wp-block-paragraph\"><strong>Carlos: </strong>Okay. Oh, well, one of them [00:03:00] is film grain, isn\u2019t it?</p>\n\n\n\n<p class=\"wp-block-paragraph\"><strong>Brad: </strong>I turned it off.</p>\n\n\n\n<p class=\"wp-block-paragraph\"><strong>Carlos: </strong>Oh. Because the film grain is on. I feel like they were hiding stuff with that.</p>\n\n\n\n<p class=\"wp-block-paragraph\"><strong>Brad: </strong>No, my. Mine has been off since the start. I turned it off. I turned off motion smoothing. I just hate that stuff in general. In all games. I just don\u2019t like the way it looks. So that\u2019s been off from the start and there\u2019s been no problem. No problems.</p>\n\n\n\n<p class=\"wp-block-paragraph\"><strong>Carlos: </strong>Okay. I thought that was what they were doing to hide it, but you can tell me that later. Okay, so then that\u2019s the thing that surprised me for good. And again, I knew I was going to pick up the first melee weapon I could find. You just hit people and they don\u2019t do like it\u2019s not a huge skill tree for Melee, but they do enough things within the kind of beef up your physical stuff that allows you to play as a melee character.</p>\n\n\n\n<p class=\"wp-block-paragraph\"><strong>Brad: </strong>Oh, I think that\u2019s absolutely viable, dude, for sure.</p>\n\n\n\n<p class=\"wp-block-paragraph\"><strong>Carlos: </strong>Yeah. Oh yeah. Well, especially with this type of game, you know, and what we\u2019ll talk about it. But. And here come the rumbling cars. It\u2019s like evening time and people just want to show off their engines.</p>\n\n\n\n<p class=\"wp-block-paragraph\"><strong>Brad: </strong>Verisimilitude. It\u2019s all.</p>\n\n\n\n<p class=\"wp-block-paragraph\"><strong>Carlos: </strong>Good. Yes, that\u2019s good. So basically, I\u2019m all over the place. But I\u2019m saying the other thing that surprised me in a negative way is [00:04:00] the spaceship stuff.</p>\n\n\n\n<p class=\"wp-block-paragraph\"><strong>Brad: </strong>Oh, dude. Yes, I.</p>\n\n\n\n<p class=\"wp-block-paragraph\"><strong>Carlos: </strong>Know. Like a line on this and your phone\u2019s going.</p>\n\n\n\n<p class=\"wp-block-paragraph\"><strong>Brad: </strong>All sorts of messages right now.</p>\n\n\n\n<p class=\"wp-block-paragraph\"><strong>Carlos: </strong>Does she know you\u2019re recording? Yeah, but.</p>\n\n\n\n<p class=\"wp-block-paragraph\"><strong>Brad: </strong>She\u2019s like, It\u2019s Carlos. Whatever.</p>\n\n\n\n<p class=\"wp-block-paragraph\"><strong>Carlos: </strong>Oh, damn. That\u2019s the real disc.</p>\n\n\n\n<p class=\"wp-block-paragraph\"><strong>Brad: </strong>Holy shit. She\u2019s like, It\u2019s your silly podcast. No, actually, I don\u2019t know what she\u2019s saying. It\u2019s work. Stuff is going on right now. She\u2019s handling a situation.</p>\n\n\n\n<p class=\"wp-block-paragraph\"><strong>Carlos: </strong>Okay, I\u2019m not cutting this out. No, no, it\u2019s fine.</p>\n\n\n\n<p class=\"wp-block-paragraph\"><strong>Brad: </strong>It\u2019s totally fine. Yeah.</p>\n\n\n\n<p class=\"wp-block-paragraph\"><strong>Carlos: </strong>So the spaceship stuff I don\u2019t like at all. Like, not even a little bit. I hate.</p>\n\n\n\n<p class=\"wp-block-paragraph\"><strong>Brad: </strong>It. I actively hate it. Yes.</p>\n\n\n\n<p class=\"wp-block-paragraph\"><strong>Carlos: </strong>And what\u2019s weird, and I\u2019m jumping all over your negatives, but what\u2019s weird is that, like, you have to do it right away because they want to, like, you know, get you used to it or whatever. And I think that what they were thinking is this is going to be really cool. We\u2019re going to show them they can do all these things like No Man\u2019s Sky, but I don\u2019t want no man\u2019s sky. I really don\u2019t. And I know that it\u2019s going to come up later because you have that little drill, which I hate and you got to like, get resources [00:05:00] and stuff. Anyways, my point is, and I\u2019ll turn it over to you, I really don\u2019t like that spaceship stuff. I like being in my spaceship.</p>\n\n\n\n<p class=\"wp-block-paragraph\"><strong>Brad: </strong>Do we dislike the same thing? I don\u2019t know that we dislike the same. Okay, so what do you dislike?</p>\n\n\n\n<p class=\"wp-block-paragraph\"><strong>Carlos: </strong>About the spaceship. I don\u2019t like it at all. I don\u2019t want to drive it. I don\u2019t want to do anything with it. I\u2019d rather just say, go to the place which you can do.</p>\n\n\n\n<p class=\"wp-block-paragraph\"><strong>Brad: </strong>That\u2019s exactly what you do. You don\u2019t fly your fucking ship at all, dude. That\u2019s the part that. That\u2019s what.</p>\n\n\n\n<p class=\"wp-block-paragraph\"><strong>Carlos: </strong>You don\u2019t like about.</p>\n\n\n\n<p class=\"wp-block-paragraph\"><strong>Brad: </strong>It? Yes. I fucking hate it. I want to fly the ship. I want to fly around. And it\u2019s like a menus. I feel like they pulled the biggest lie on people by talking all that shit about flying and the universe and spaceships and galaxy and flying around and stuff. You don\u2019t fly shit, dude. Like, what are you talking about?</p>\n\n\n\n<p class=\"wp-block-paragraph\"><strong>Carlos: </strong>Well, okay, so I think my expectation was totally like, checked for that because there was literally an interview. They were like, You don\u2019t fly around.</p>\n\n\n\n<p class=\"wp-block-paragraph\"><strong>Brad: </strong>Oh man, I missed that interview because you don\u2019t fly around. I\u2019m like, What is going on here? Oh, see, that\u2019s.</p>\n\n\n\n<p class=\"wp-block-paragraph\"><strong>Carlos: </strong>Expectation, though. Like, I knew right away that that wasn\u2019t going to be a thing. And so here\u2019s my problem with it then. So that\u2019s your problem. My problem [00:06:00] is that when you\u2019re actually doing it, I don\u2019t think it\u2019s fun. It\u2019s like a version of No Man\u2019s Sky where you\u2019re like, you know, you did the combat because they make you do combat. And I just felt lost and I\u2019m just spinning around and all those menus, like you said, menus. I don\u2019t like I don\u2019t like a lot of the menus, but the menus in the ship, like, put up your shields down, put your shields up and down, put your, you know, go faster. I was confused.</p>\n\n\n\n<p class=\"wp-block-paragraph\"><strong>Brad: </strong>Were you\u2019re managing the energy thing or whatever. Yeah.</p>\n\n\n\n<p class=\"wp-block-paragraph\"><strong>Carlos: </strong>You\u2019re managing up and down. Like speed isn\u2019t just speed. It\u2019s like pushing up and down on a little meter. I hated all of the experience of it, like I really didn\u2019t like it. And so then when we got to combat, I just felt like I was flailing and I was lucky I won. But like, they probably, you know, made it easy for you. Sure. And then when they did the fast show for me, I was like, Cool, let\u2019s give me to the planet so I can hit things again.</p>\n\n\n\n<p class=\"wp-block-paragraph\"><strong>Brad: </strong>Oh, God, yeah, dude. Oh, I just like. Oh, boy, I. I don\u2019t even know where to even start with this one. I mean, I equally dislike it. I think that we dislike it for the different reasons, but I think we both equally dislike it, which is amazing. They are like they are serving everyone\u2019s [00:07:00] needs by making it equally awful for all people. I just like. I guess so. Oh my God. Okay, so like, so five hours in and we\u2019ll talk to you. I don\u2019t want to play this game anymore. I\u2019m ready to bounce like I had a miserable time. I did not think this was fun. Even a little bit. Not even a little bit.</p>\n\n\n\n<p class=\"wp-block-paragraph\"><strong>Carlos: </strong>Could I could I offer just an asterisk there for both of us? I just got to the city. Right. Did you have you explored the city at all, like the first major city? Yeah.</p>\n\n\n\n<p class=\"wp-block-paragraph\"><strong>Brad: </strong>Number one, I hate the city. I hate the way you\u2019ve been in it. I\u2019ve been in the city. I\u2019ve done one major quest like storyline quest. I did one, 1 or 2 minor side quests, and I fucked around in the stupid ship. Yeah. So like, I\u2019ve. I\u2019m not saying I\u2019ve seen everything there is to see, but what I\u2019ve seen in the five hours is telling me I, I don\u2019t want to see anymore. I\u2019m good where I\u2019m at right now.</p>\n\n\n\n<p class=\"wp-block-paragraph\"><strong>Carlos: </strong>Well then we\u2019re flipped because I don\u2019t like a lot of parts of it. And by the way, this is again, a negative Nelly to join your negative. I definitely don\u2019t think this is a system [00:08:00] seller.</p>\n\n\n\n<p class=\"wp-block-paragraph\"><strong>Brad: </strong>They thought. No, I do not think I agree.</p>\n\n\n\n<p class=\"wp-block-paragraph\"><strong>Carlos: </strong>Even if we get deep into like, you know, huge campaign stuff that\u2019s fun and really good story or whatever, it feels like outer worlds, right?</p>\n\n\n\n<p class=\"wp-block-paragraph\"> and making games. And that\u2019s all it\u2019s about. And either you make a good game or you don\u2019t. And sometimes it\u2019s beyond your control. You know, pandemic messed up a lot of people. There was also developer stuff where people leave and come back. I understand I\u2019ve been in development houses and seen the mayhem, you know, in there, just like trying to make a movie. It\u2019s really hard. I\u2019m not saying why, but I\u2019m just saying like, don\u2019t make it Xbox versus PlayStation. This is. Sure, sure. This is definitely [01:49:00] Microsoft management. You know, that could be called into question. But when it comes to like this specific game, it\u2019s just Bethesda didn\u2019t hit their goal. You know? Exactly. And Microsoft did say that also about Redfall. They were like, hey, it wasn\u2019t us. But at the same time, they you know, they should have responsibility.</p>\n\n\n\n<p class=\"wp-block-paragraph\"><strong>Brad: </strong>For their manager. They had some responsibility for sure. Okay. So all that aside. Yes. All that aside, Carlos, you played the game. You rolled. Credits. You spent a heck of a lot of time with it here at the launch, the inaugural event of starfield hitting the public. What do you give in terms of a score? What do you rate? Starfield, my friend.</p>\n\n\n\n<p class=\"wp-block-paragraph\"><strong>Carlos: </strong>Do you want to guess or do you want me to just tell you?</p>\n\n\n\n<p class=\"wp-block-paragraph\"><strong>Brad: </strong>Just tell. You better just tell me.</p>\n\n\n\n<p class=\"wp-block-paragraph\"><strong>Carlos: </strong>Yeah. I feel like you would guess low.</p>\n\n\n\n<p class=\"wp-block-paragraph\"><strong>Brad: </strong>I was going to guess really low, but go ahead.</p>\n\n\n\n<p class=\"wp-block-paragraph\"><strong>Carlos: I think my TL;DR take is that Starfield is a pretty good time. It\u2019s basically Fallout 4  in space with some sci-fi and some procedural generation.</strong></p>\n\n\n\n<p class=\"wp-block-paragraph\"><strong>Brad: </strong>And.</p>\n\n\n\n<p class=\"wp-block-paragraph\"><strong>Carlos: </strong>And it gets a seven out of ten.</p>\n\n\n\n<p class=\"wp-block-paragraph\"><strong>Brad: </strong>What? Oh, my God. That\u2019s way too high, dude. Really? Yeah. What? I mean, you. You can get whatever score you want. Well, you\u2019ve got to go before way lower than that, dude.</p>\n\n\n\n<p class=\"wp-block-paragraph\"><strong>Carlos: </strong>Because I think, I think okay here\u2019s the thing. I think I could maybe go down to 6 or 6.5, but like, and you have talked me down before, but the reason I say seven is because that final act is really fucking special. I\u2019m really serious about that. Like, I got a little chills. Okay, sure. Sure. That does. I mean, that\u2019s a lot to be said. I could watch an independent film. Sure. And if it was only an hour long and it gave me those chills, I could rate it eight. You know what I mean? Sure.</p>\n\n\n\n<p class=\"wp-block-paragraph\"><strong>Brad: </strong>But you put in like 25 or 30 hours and you only had a good time at the very, very end of it.</p>\n\n\n\n<p class=\"wp-block-paragraph\"><strong>Carlos: </strong>And no, that\u2019s not true. I told you I had a good time killing people, getting experience points and picking up all the loot. So. So that.</p>\n\n\n\n<p class=\"wp-block-paragraph\"><strong>Brad: </strong>Too. Okay, so. So [01:51:00] that\u2019s an average activity in an average game. Picking up, loot a jillion games.</p>\n\n\n\n<p class=\"wp-block-paragraph\"><strong>Carlos: </strong>That\u2019s why this feels like a seven out of ten is an average game. It feels like 6 or 7 out of ten. Yeah.</p>\n\n\n\n<p class=\"wp-block-paragraph\"><strong>Brad: </strong>Oh, that\u2019s totally fine. I respect your I respect.</p>\n\n\n\n<p class=\"wp-block-paragraph\"><strong>Carlos: </strong>Your calling it an average game.</p>\n\n\n\n<p class=\"wp-block-paragraph\"><strong>Brad: </strong>That is totally fine. I think the disconnect for me is having been at Gamecritics.com for so long, for us, an average is five. Five is exactly the middle of the road. And so a seven to me is like is better than average.</p>\n\n\n\n<p class=\"wp-block-paragraph\"><strong>Carlos: </strong>Like, okay, you know what? You\u2019re right. I\u2019m just again, it\u2019s me just trying to figure out.</p>\n\n\n\n<p class=\"wp-block-paragraph\"><strong>Brad: </strong>I mean, I\u2019m not trying to sway you. I\u2019m just saying where I\u2019m coming.</p>\n\n\n\n<p class=\"wp-block-paragraph\"><strong>Carlos: </strong>From is like, I\u2019m telling you what I want to do. But I haven\u2019t scored numbers in a long time, so I\u2019m saying it is average to me. Like, which is actually hurtful. Really? Yeah. So but it\u2019s a little bit above average because the ending is so cool and I probably will still play it, which means it has to be something to me.</p>\n\n\n\n<p class=\"wp-block-paragraph\"><strong>Brad: </strong>And that to me seems like like a six.</p>\n\n\n\n<p class=\"wp-block-paragraph\"><strong>Carlos: </strong>That\u2019s like six. Okay, let\u2019s do this. We\u2019re gonna split the difference. It\u2019s a six split. The difference.</p>\n\n\n\n<p class=\"wp-block-paragraph\"><strong>Brad: </strong>6.5, 6.5. There you go. Official SVG game score. I [01:52:00] twisted his arm, talked him down.</p>\n\n\n\n<p class=\"wp-block-paragraph\"><strong>Carlos: </strong>6.5, though. That\u2019s. I feel confident with that.</p>\n\n\n\n<p class=\"wp-block-paragraph\"><strong>Brad: </strong>That\u2019s a small twist. It wasn\u2019t much of a twist. I\u2019m weak. All right. There it is. It was a small twist of the arm. 6.5. So video games, official score and the end of our starfield journey. I know, Carlos, you\u2019re still going to play it again. I\u2019ve already deleted it from my hard drive. I\u2019m never coming back to this game unless they do like a huge overhaul. This game is just not for me. But I am very curious to see what people make of this game. The embargo drops in about 48 hours. I am very curious to hear perceptions and and thoughts. And it\u2019s very curious too, because a lot of people did not get code. So I am very fortunate that we got code. I\u2019m glad that we were on the list of people to play this game. Unfortunately, it wasn\u2019t better, but in 48 hours we will see what the world thinks of starfield. Well.</p>\n\n\n\n<p class=\"wp-block-paragraph\"><strong>Carlos: </strong>I\u2019m going to say two things before we close. One, remember, this is dropping and it is out.</p>\n\n\n\n<p class=\"wp-block-paragraph\"><strong>Brad: </strong>Yeah, it will be out by the. Oh, that\u2019s true. Yeah. For the people who in the loop in the time loop.</p>\n\n\n\n<p class=\"wp-block-paragraph\"><strong>Carlos: </strong>And then two, [01:53:00] I am actually super grateful to have gotten to play the game early because it felt very special. Yes. Like I think I remember texting you going like we are the one of the only people on the planet playing this. Yes, that is super exciting to me and I will keep wanting to do that. So anybody who ever wants to send me slash US codes, it just feels really special to be able to do it. So even if I hate or love your game, I still love trying things, you know, early. So that\u2019s fun to me.</p>\n\n\n\n<p class=\"wp-block-paragraph\"><strong>Brad: </strong>Yeah. All right. There we go, folks. That\u2019s it. Thanks for joining us on this special two parter. Although it\u2019s really just kind of a single part launch day episode. And we will be back this weekend for our normal episode with other games. I\u2019m not going to talk about Starfield. I don\u2019t think you probably will either, but we. Are you coming back? No, you\u2019re not here this weekend. I\u2019m just.</p>\n\n\n\n<p class=\"wp-block-paragraph\"><strong>Carlos: </strong>I\u2019m soloing. No, no. I think I\u2019m coming back because I might talk about Starfield again.</p>\n\n\n\n<p class=\"wp-block-paragraph\"><strong>Brad: </strong>Oh, my God. Okay, well, whatever it is, we\u2019re having another episode, regular episode this weekend. Not a chit chatty episode like this one. And we will see you then.</p>\n\n\n\n<p class=\"wp-block-paragraph\"><strong>Carlos: </strong>See [01:54:00] you then. That seems weird.</p>\n\n\n\n<p class=\"wp-block-paragraph\"><strong>Brad: </strong>It is weird.</p>\n\n\n\n<hr>\n\n\n\n<p class=\"wp-block-paragraph\"><strong>So Videogames Official Score:</strong>\u00a06.5/10</p>\n\n\n\n<p class=\"wp-block-paragraph\"><strong>Developer:</strong>\u00a0Bethesda</p>\n\n\n\n<p class=\"wp-block-paragraph\"><strong>Publisher:</strong>\u00a0Bethesda</p>\n\n\n\n<p class=\"wp-block-paragraph\"><strong>Code Source:\u00a0</strong>Publisher</p>\n\n\n\n<p class=\"wp-block-paragraph\"><strong>Platform Reviewed:</strong>\u00a0Xbox X</p>\n\n\n\n<p class=\"wp-block-paragraph\"><strong>ESRB Rating:</strong>\u00a0M \u2013 Blood, Strong Language, Suggestive Themes, Use of Drugs, Violence</p>\n\n\n\n<p class=\"wp-block-paragraph\"><strong>Colorblind Modes:\u00a0</strong>There are no colorblind modes.</p>\n\n\n\n<p class=\"wp-block-paragraph\"><strong>Subtitles:</strong>\u00a0All dialogue is subtitled. Menus can have font sizes adjusted. </p>", "date": "2023-08-30", "url": "https://gamecritics.com/brad-gallaway/svg-special-episode-starfield-a-chat-review/"}, {"title": "SVG 351: Pacing!!!", "desc": "<a href=\"https://gamecritics.com/wp-content/uploads/2022/04/SVG-Twitter.jpg\"></a>\n\n\n\n<p class=\"wp-block-paragraph\">In this episode, Carlos & Brad cover:</p>\n\n\n\n<p class=\"wp-block-paragraph\">Venba (scored review)<br>Save Koch<br>Fort Solis<br>Armored Core 6<br>Immortals of Aveum<br>Iron Danger<br>Baldur\u2019s Gate 3</p>\n\n\n\n<p class=\"wp-block-paragraph\">\u2026And more!</p>\n\n\n\n<p class=\"wp-block-paragraph\"></p>\n\n\n\n<p class=\"wp-block-paragraph\">You can also hear the tle": "So Videogames Ep. 318: Mad About Snaps", "desc": "<a href=\"https://gamecritics.com/wp-content/uploads/2022/04/SVG-Twitter.jpg\"></a>\n\n\n\n<p class=\"wp-block-paragraph\">In this belated episode, Carlos & Brad discuss:</p>\n\n\n\n<p class=\"wp-block-paragraph\">\u2013 Portal Dungeon Goblin Escape<br>\u2013 Kaiju Wars<br>\u2013 Aircraft Carrier Survival<br>\u2013 Soulstice<br>\u2013 Drago Noka<br>\u2013 Lone Ruin<br>\u2013 Vampire Survivors DLC<br>\u2013 Kandria<br>\u2013 Weird West<br>\u2013 Marvel Snap</p>\n\n\n\n<p class=\"wp-block-paragraph\">\u2026And more!</p>\n\n\n\n<p class=\"wp-block-paragraph\"></p>\n\n\n\n<p class=\"wp-block-paragraph\">You can also hear the show on <a href=\"https://podcasts.apple.com/us/podcast/the-so-videogames-podcast/id1168917623\">iTunes</a> and <a href=\"https://open.spotify.com/show/3PNLEo7I1ap7GeeNxOA4Kq\">Spotify</a>! </p>\n\n\n\n<p class=\"has-text-align-center wp-block-paragraph\"><strong>Please send feedback and mailbag questions to SoVideogamesPODCAST (at) gmail (dot) com, or post them in the comments section below. Thanks!</strong></p>", "date": "2023-01-10", "url": "https://gamecritics.com/brad-gallaway/so-videogames-ep-318-mad-about-snaps/"}, {"title": "So Videogames Ep. 317: GOTY 2022", "desc": "<a href=\"https://gamecritics.com/wp-content/uploads/2022/04/SVG-Twitter.jpg\"></a>\n\n\n\n<p class=\"wp-block-paragraph\">In this episode, Carlos & Brad forego the usual format and instead dive into an EPIC three-hour review of 2022 \u2014 the disappointments, the games they didn\u2019t have time for, the honorable mentions, and of course, their top ten of the year. The episode ends with picks & pans from our listeners for a varied wrapup!</p>\n\n\n\n<p class=\"wp-block-paragraph\"></p>\n\n\n\n<p class=\"wp-block-paragraph\">You can also hear the show on <a href=\"https://podcasts.apple.com/us/podcast/the-so-videogames-podcast/id1168917623\">iTunes</a> and <a href=\"https://open.spotify.com/show/3PNLEo7I1ap7GeeNxOA4Kq\"> u2013 Milk Inside a Bag of Milk Inside a Bag of Milk</p>\n\n\n\n<p class=\"wp-block-paragraph\">\u2013 Sonic Frontiers</p>\n\n\n\n<p class=\"wp-block-paragraph\">\u2026.And more!</p>\n\n\n\n<p class=\"wp-block-paragraph\"></p>\n\n\n\n<p class=\"has-text-align-center wp-block-paragraph\"><strong>Please send feedback and mailbag questions to SoVideogamesPODCAST (at) gmail (dot) com, or post them in the comments section below. Thanks!</strong></p>", "date": "2022-11-14", "url": "https://gamecritics.com/brad-gallaway/so-videogames-ep-310-people-pleaser-empath/"}, {"title": "So Videogames Ep 309: Cleavage = Romance", "desc": "<a href=\"https://gamecritics.com/wp-content/uploads/2022/04/SVG-Twitter.jpg\"></a>\n\n\n\n<p class=\"wp-block-paragraph\">In this episode, Carlos & Brad cover:</p>\n\n\n\n<p class=\"wp-block-paragraph\">\u2013 Wavetale</p>\n\n\n\n<p class=\"wp-block-paragraph\">\u2013 Space Tail</p>\n\n\n\n<p class=\"wp-block-paragraph\">\u2013 Paper Cut Mansion</p>\n\n\n\n<p class=\"wp-block-paragraph\">\u2013 Robotry</p>\n\n\n\n<p class=\"wp-block-paragraph\">\u2013 Ghost Song</p>\n\n\n\n<p class=\"wp-block-paragraph\">\u2013 The Chant</p>\n\n\n\n<p class=\"wp-block-paragraph\">\u2013 Sea Horizon</p>\n\n\n\n<p class=\"wp-block-paragraph\">\u2013 Darkwood</p>\n\n\n\n<p class=\"wp-block-paragraph\">\u2013 Star Ocean: The Divine Force\u00a0\u00a0 8/10</p>\n\n\n\n<p class=\"wp-block-paragraph\">\u2026And more!</p>\n\n\n\n<p class=\"wp-block-paragraph\"></p>\n\n\n\n<p class=\"has-text-align-center wp-block-paragraph\"><strong>Please send feedback and mailbag questions to SoVideogamesPODCAST (at) gmail (dot) com, or post them in the comments section below. Thanks!</strong></p>", "date": "2022-11-07", "url": "https://gamecritics.com/brad-gallaway/so-videogames-ep-309-cleavage-romance/"}, {"title": "So Videogames Ep. 308: The 2022 Halloween Spooktacular", "desc": "<a href=\"https://gamecritics.com/wp-content/uploads/2022/04/SVG-Twitter.jpg\"></a>\n\n\n\n<p class=\"wp-block-paragraph\">In this Halloween special, Carlos & Brad cover:</p>\n\n\n\n<ul class=\"wp-block-list\"><li>Marvel Snap</li><li>Yomawari: Lost in the dark</li><li>Skully</li><li>Bones of Halloween</li><li>Signalis</li><li>The Excavation of Hob\u2019s Barrow</li><li>Saturnalia</li><li>Unusual Findings</li><li>Hunt: Showdown</li><li>Remnant: From the Ashes</li><li>Demon Turf</li><li>Fhtagn Simulator</li><li>In Sound Mind</li></ul>\n\n\n\n<p class=\"wp-block-paragraph\">\u2026And more!! Come get spooky with us!!</p>\n\n\n\n<p class=\"wp-block-paragraph\">ALSO, we forgot to post the link to the <a href=\"https://www.taminggaming.com/search/pathways/Carlos+Nurturing+Empowerment+Through+Fantasy\">Taming Gaming interview with Carlos</a>, but listener Sean reminded us!! What a guy! = )</p>\n\n\n\n<p class=\"wp-block-paragraph\"></p>\n\n\n\n<p class=\"has-text-align-center wp-block-paragraph\"><strong>Please send feedback and mailbag questions to SoVideogamesPODCAST (at) gmail (dot) com, or post them in the comments section below. Thanks!</strong></p>", "date": "2022-10-30", "url": "https://gamecritics.com/brad-gallaway/so-videogames-ep-308-the-2022-halloween-spooktacular/"}, {"title": "SVG Review: Mario + Rabbids: Sparks of Hope", "desc": "<a href=\"https://gamecritics.com/wp-content/uploads/2022/09/SVG-Twitter.jpg\"></a>\n\n\n\n<p class=\"wp-block-paragraph\">This is a transcript excerpt covering the score awarded to <em>Mario + Rabbids: Sparks of Hope</em> on the So Videogames podcast, <a href=\"https://gamecritics.com/brad-gallaway/so-videogames-ep-307-the-worst-way-to-run/\">episode 307: The Worst Way To Run</a>.</p>\n\n\n\n<hr>\n\n\n\n<p class=\"wp-block-paragraph\"><strong>REVIEW TRANSCRIPT:</strong></p>\n\n\n\n<p class=\"wp-block-paragraph\">23:44</p>\n\n\n\n<p class=\"wp-block-paragraph\"><br><strong>Brad:</strong>  So I was thinking of circling back to Mario + Rabbids: Sparks of Hope. we covered it last episode. And at that time, I was just kind of barely scratching the surface of it. I\u2019d gotten through like a world or whatever. But I still, you know, clearly could tell there was a lot more to come. And we talked about maybe me giving it a review score, which I was I felt pretty solid at the time, but I just wanted to see more so I figured I would revisit that right now. I don\u2019t know why I\u2019m pausing so long on my words. </p>\n\n\n\n<p class=\"wp-block-paragraph\">But yeah, I figured I would go back and give it like, the official so videogames review. So I went back and played some more, played a bunch more, have been playing it every night in bed, which is great, because that\u2019s where I love to play the switch. And I gotta say this game. It\u2019s solid, dude. It\u2019s solid as fuck, like I\u2019m playing it and you know how critical I am you know, I can pick apart basically anything I can. I can take the best game and find something wrong with it. And man, this game is just like so fucking airtight. Like, every time I get annoyed with it (which is which is never) and I\u2019m trying to look for like, you know, rough edges or something. There\u2019s just aren\u2019t any like, it\u2019s just it\u2019s thoroughly polished. It\u2019s thoroughly well designed. </p>\n\n\n\n<p class=\"wp-block-paragraph\">I mean, as a quick recap for people who maybe missed last episode\u2026 So this is a turn based strategy in the vein of XCOM but instead you\u2019re using rabbids, which are the Ubisoft kind of mascot rabbit weird things. And then you have Mario characters \u2014 you got Mario, Princess Peach, Luigi, etc, etc. And you go on these levels that are kind of like XCOM levels. But the beautiful thing is, is the first game which came out a couple of years ago where I thought it was already great. I mean, but at that time, there\u2019s a couple of things that I was like, Okay, this is really good, but can be better. And the Ubisoft developers absolutely zeroed in on all of that stuff. Like, my biggest gripe I think about the previous game was the overworld was kind of messy and confusing. And I didn\u2019t really care for it too much, wanted to just to get back to the battles. And this time around, I think the overworlds are great. They\u2019re beautiful. They\u2019re there\u2019s a lot to explore, but they\u2019re not huge. And also the developers give you a map that highlights every single little point of interest. So if you want to just get straight to it, you can just go right there and find out what\u2019s going on. They tell you what you have done, what you haven\u2019t done, what you need to do for the stuff that you don\u2019t have yet. Like if you need a certain amount of keys or something, or a certain amount of points, it\u2019ll say, oh, yeah, you need like nine out of 12. And so you don\u2019t waste your time going back there if you\u2019re not ready to do it, right. </p>\n\n\n\n<p class=\"wp-block-paragraph\">And then, I mean, the graphics are so polished, the characters are all really interesting. I stuck with my core team of like Mario and Luigi and Rabbid Peach, which is a rabbid who\u2019s dressed up like Princess Peach, of course, and stuck with that for a while. But then like, oh, you know, I should probably check out these other characters. And you do unlock more as you go. </p>\n\n\n\n<p class=\"wp-block-paragraph\">But I started switching around and everybody had something cool and everybody I tried was like, okay, this guy does something cool. This guy\u2019s got a Frisbee that hits like everybody, that\u2019s awesome. Or like, Oh, this guy can deflect bullets, like you shoot him and he punches a bullet back. Okay, that\u2019s awesome. Like, I can already see like places where that would be really useful, you know. </p>\n\n\n\n<p class=\"wp-block-paragraph\">And on top of that, the movement systems are just so good. I think it really leverages Mario as a franchise in conjunction with what we generally think of as XCOM. So I mean, I\u2019ve said this before, but like, for example, mobility is really a huge aspect of this game. You can move forward like a regular XCOM game. But then also, you can have one character jump on top of another one and launch them really high in the air. So that not only gets you up to higher elevations, but it can also make you glide to get in back of people to flank them to get in and back out to some other cover that you might not have been able to get to. And you can also attack people when you\u2019re walking around to get like little extra hits in. You do like a little Mario slide like like you were going to be knocking over turtle shells or something. Oh, yes. Yeah, so they really leveraged like the Mario franchise in like brilliant ways that have really key effects in the gameplay. </p>\n\n\n\n<p class=\"wp-block-paragraph\">And I think that the difficulty levels are really great. It can be really difficult if you want it to be, or it can be really easy if you want it to be and the UI is perfect. Like I have no problem reading all the information. Loving it. </p>\n\n\n\n<p class=\"wp-block-paragraph\">And my dudes, they\u2019re really flexible. Because if you put level up points to somebody and you\u2019re like, oh, you know, I didn\u2019t think I wanted to do that. They\u2019re like, yeah, no problem. Take it back. Do it again. Spend those points, take it back. I love that you can just experiment with it. And if you try to get a good synergy or Team Build going and if you\u2019re like, Oh, I wish I had put one more point in Mario instead of two, Okay, cool. They\u2019re like Yeah, do it man. Like, like, they don\u2019t penalize you for like anything. And I just love that they want you to play this game they want you to get in experiment and it just feels so fucking fun to play this. Like it just, I mean, I could just go on and on and on and on. But like there\u2019s literally nothing I want more out of this game than than just like more levels and maybe more characters and some DLC, which I\u2019m sure is on the way. I mean, it\u2019s like it\u2019s basically a perfect game as far as I can tell. </p>\n\n\n\n<p class=\"wp-block-paragraph\"><strong>Carlos: </strong>So almost like my review of stray then. </p>\n\n\n\n<p class=\"wp-block-paragraph\">28:25<br></p>\n\n\n\n<p class=\"wp-block-paragraph\">Yeah, I mean, I mean, everything that I would want as a strategy fan as a turn base fan is here. And I just I\u2019m just like enjoying it like so much. </p>\n\n\n\n<p class=\"wp-block-paragraph\">28:38<br></p>\n\n\n\n<p class=\"wp-block-paragraph\"><strong>Carlos: </strong>Yeah, I mean, okay, but what about the rabbids?</p>\n\n\n\n<p class=\"wp-block-paragraph\">28:42<br></p>\n\n\n\n<p class=\"wp-block-paragraph\"><strong>Brad: </strong>Okay, okay, that\u2019s true. I\u2019m going to take a point off because rabbids. They really really suck, but, but I love this game anyway. And I will say that if this game had if this game had taken out the Rabbids and and put in just like all Mario characters \u2014 perfect game. Yes. Yeah. I hate the rabbids, but this game is so good. I\u2019m still playing even with rabbids. </p>\n\n\n\n<p class=\"wp-block-paragraph\"><strong>Carlos: </strong>And the game is so good that you\u2019re going to even give it a score of\u2026??? </p>\n\n\n\n<p class=\"wp-block-paragraph\"><strong>Brad:</strong> I\u2019m going to give it an official so video games score of nine out of 10</p>\n\n\n\n<p class=\"wp-block-paragraph\">29:14<br></p>\n\n\n\n<p class=\"wp-block-paragraph\"><strong>Carlos:</strong> I knew it. I knew it. </p>\n\n\n\n<p class=\"wp-block-paragraph\">29:17</p>\n\n\n\n<p class=\"wp-block-paragraph\"><br>I mean, I gotta I gotta keep it real. But Ubisoft, I don\u2019t like Rabbids at all. But this game kicks ass. This game kicks ass every every six ways from Sunday, dude. And if you like XCOM, you like turn based strategy, if you like Mario franchise. I mean, you will like this. </p>\n\n\n\n<p class=\"wp-block-paragraph\"><strong>It\u2019s a struggle to encapsulate what a wonderful, marvelous experience this is, and how carefully the developers have addressed all of the concerns from the past \u2014 and those concerns weren\u2019t huge! Despite doing a <em>great</em> job the first time out, they rolled up their sleeves, take a look at what didn\u2019t work perfectly and now everything here is just <em>so</em>, <em>so good</em>.</strong> I really appreciate that. And I really want to reward that, so I definitely feel like a 9 out of 10 is easily easily justifiable. Great, great stuff, and if you like XCOM, or Mario or anything on the switch, I mean, this is like a killer switch game for sure. So, absolutely check it out. Nine out of 10. Great stuff.</p>\n\n\n\n<hr>\n\n\n\n<p class=\"wp-block-paragraph\"><strong>So Videogames Stray Official Score:\u00a0</strong>9/10</p>\n\n\n\n<p class=\"wp-block-paragraph\"><strong>Developer:</strong> Ubisoft Paris</p>\n\n\n\n<p class=\"wp-block-paragraph\"><strong>Publisher:</strong> Ubisoft</p>\n\n\n\n<p class=\"wp-block-paragraph\"><strong>Platform Reviewed:\u00a0</strong>Nintendo Switch</p>\n\n\n\n<p class=\"wp-block-paragraph\"><strong>ESRB Rating:</strong> <strong>E10+</strong>. The official description reads as follows: <em>This is a strategy game in which players control characters from the Mario and Rabbids universes as they defend a kingdom from evil. From a top-down perspective, players explore whimsical landscapes, collect coins, and engage in turn-based battles with various enemies (e.g., rabbids, Bowser, goombas, henchmen). Characters use cartoony blasters, explosives, and melee weapons to defeat enemies that disappear when health bars/hit points are depleted. Cutscenes and attack animations sometimes feature slow-motion effects; battles are highlighted by explosions and futuristic/cartoony gunfire.</em></p>\n\n\n\n<p class=\"wp-block-paragraph\"><strong>Colorblind Modes:</strong> There are <strong>no colorblind modes</strong>. </p>\n\n\n\n<p class=\"wp-block-paragraph\"><strong>Subtitles: </strong>There are subtitles for all dialogue, but they are not adjustable or resizable. However, I\u2019ve played almost the entire time on mute and had no problems whatsoever \u2014 there are no audio cues needed for gameplay at all. Despite the lack of options for subtitles, the game does offer a variety of other accessibility options, including gameplay and physical controls. A player\u2019s mileage may vary with that suite, but as far as audio goes, this game is <strong>fully accessible</strong>.  </p>\n\n\n\n<a href=\"https://gamecritics.com/wp-content/uploads/2022/10/Ff-ptO3acAE_HVj.jpg\"></a>", "date": "2022-10-26", "url": "https://gamecritics.com/brad-gallaway/svg-review-mario-rabbids-sparks-of-hope/"}, {"title": "So Videogames Ep. 307: The Worst Way To Run", "desc": "<a href=\"https://gamecritics.com/wp-content/uploads/2022/04/SVG-Twitter.jpg\"></a>\n\n\n\n<p class=\"wp-block-paragraph\">In this pre-Halloween episode, Carlos & Brad cover:</p>\n\n\n\n<ul class=\"wp-block-list\"><li>Twilight Zone VR</li><li>Dropsy</li><li>Splatter: Zombiecalypse Now</li><li>Splatter</li><li>Batora: Lost Haven</li><li>Warpips</li><li>9th Dawn III: Shadow of Erthil</li><li>A Plague Tale: Requiem</li><li>Park Story</li></ul>\n\n\n\n<p class=\"wp-block-paragraph\">\u2026And more!</p>\n\n\n\n<p class=\"wp-block-paragraph\"></p>\n\n\n\n<p class=\"has-text-align-center wp-block-paragraph\"><strong>Please send feedback and mailbag questions to SoVideogamesPODCAST (at) gmail (dot) com, or post them in the comments section below. Thanks!</strong></p>", "date": "2022-10-23", "url": "https://gamecritics.com/brad-gallaway/so-videogames-ep-307-the-worst-way-to-run/"}, {"title": "So Videogames Ep. 306: Halloween Is In The Heart", "desc": "<a href=\"https://gamecritics.com/wp-content/uploads/2022/04/SVG-Twitter.jpg\"></a>\n\n\n\n<p class=\"wp-block-paragraph\">In this episode, Carlos & Brad cover:</p>\n\n\n\n<p class=\"wp-block-paragr
